# STAR tests on every push and pull request (2026-10-20): the Python suites of run_all_tests.py.
#   STAR     tests/test_star_python.py: BackEnd modules import, BackEnd / FrontEnd Python compiles,
#            FrontEnd/web/star_results_frontend_v5.html matches the shell template and web/modules/*.html
#   END-006  END006-ComponentSelector/star_component_selector/tests (the datasheet PDFs are not in the
#            repository: the checks on the files are skipped there, see tests/datasheet_library.py)
# The MATLAB suites (END-001, END-003, END-004) need a MATLAB licence: run them on the STAR PC with
#   python run_all_tests.py
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python suites (STAR, END-006)
    runs-on: windows-latest            # the platform STAR runs on
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Long paths in git (END-016 data files are over 260 characters)
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4      # no submodules: END-001 (private) is needed only by the MATLAB suites
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packages the tests import
        run: python -m pip install --disable-pip-version-check Pillow PyYAML openai
      - name: Run the Python suites
        run: python run_all_tests.py STAR END-006
