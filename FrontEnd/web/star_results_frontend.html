<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />

<title>STAR — Results FrontEnd</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

:root{
  --bg:#090a0d;
  --panel:#11141c;
  --panel-strong:#151925;
  --panel-muted:#0d1017;
  --border:#232838;
  --border-soft:rgba(114,125,151,.22);
  --text:#d7dde9;
  --text-strong:#ffffff;
  --muted:#7d879a;
  --muted-2:#9aa3b4;
  --accent:#e8ff47;
  --accent-2:#4dffc3;
  --danger:#ff5c7a;
  --success:#61f6a8;
  --plot-bg:#090a0d;
  --shadow:0 24px 80px rgba(0,0,0,.32);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8;
  --panel:#ffffff;
  --panel-strong:#f8fafc;
  --panel-muted:#eef2f7;
  --border:#d9e0eb;
  --border-soft:rgba(45,55,72,.13);
  --text:#222b3b;
  --text-strong:#070b12;
  --muted:#667085;
  --muted-2:#475467;
  --accent:#667c00;
  --accent-2:#007a66;
  --danger:#bd2450;
  --success:#047857;
  --plot-bg:#ffffff;
  --shadow:0 18px 60px rgba(31,41,55,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at top left,rgba(77,255,195,.10),transparent 32rem),
    radial-gradient(circle at top right,rgba(232,255,71,.08),transparent 36rem),
    var(--bg);
  color:var(--text);
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:13px;
  line-height:1.5;
}
button{font:inherit;border:1px solid var(--border);background:var(--panel-strong);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
button:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.primary-action{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07100d;font-weight:700}
.app-shell{width:min(1920px,100%);margin:0 auto;padding:18px}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  box-shadow:var(--shadow);
  position:sticky;
  top:12px;
  z-index:50;
  backdrop-filter:blur(18px);
}
.header h1{
  margin:0;
  font-family:'Syne',Inter,system-ui,sans-serif;
  font-size:clamp(19px,2vw,28px);
  line-height:1.05;
  color:var(--text-strong);
  letter-spacing:-.03em;
  text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.theme-toggle{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel-muted);
  color:var(--muted-2);
  user-select:none;
}
.switch{position:relative;width:48px;height:26px;display:inline-flex;align-items:center}
.switch input{opacity:0;width:0;height:0}
.slider-switch{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.22s ease;box-shadow:inset 0 0 0 1px var(--border-soft)}
.slider-switch:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--text-strong);transition:.22s ease}
.switch input:checked+.slider-switch{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch input:checked+.slider-switch:before{transform:translateX(22px);background:#07100d}
.tab-shell{
  margin-top:18px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 95%,transparent);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.tab-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px;
  border-bottom:1px solid var(--border);
  background:var(--panel-strong);
  flex-wrap:wrap;
}
.tab-buttons{display:flex;gap:8px;flex-wrap:wrap}
.tab-button{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-width:190px;
  min-height:54px;
  font-family:'Syne',Inter,system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:11px;
  line-height:1.05;
  color:var(--muted-2);
  background:var(--panel-muted);
}
.tab-button .tab-code{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em}
.tab-button .tab-title{font-size:12px;font-weight:700;letter-spacing:.035em;margin-top:4px}
.tab-button.active{
  border-color:transparent;
  background:var(--accent-2);
  color:#07100d;
  font-weight:800;
}
.root-status{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:11px;
  flex-wrap:wrap;
}
.status-dot{width:10px;height:10px;border-radius:999px;background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.status-dot.loaded{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 18%,transparent)}
.frame-wrap{height:calc(100vh - 162px);min-height:720px;background:var(--bg)}
.tab-frame{width:100%;height:100%;border:0;display:none;background:transparent}
.tab-frame.active{display:block}
.note{
  margin-top:12px;
  color:var(--muted);
  font-size:11px;
}
code{color:var(--accent-2)}
@media(max-width:980px){
  .header{align-items:flex-start;flex-direction:column;position:static}
  .header-actions{justify-content:flex-start;width:100%}
  .frame-wrap{height:78vh;min-height:650px}
}
</style>

async function collectFilesFromDirectoryHandle(handle, pathPrefix = &#x27;&#x27;) {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === &#x27;file&#x27;) {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${pathPrefix}${name}`;
      files.push(file);
    } else if (entry.kind === &#x27;directory&#x27;) {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${pathPrefix}${name}/`));
    }
  }
  return files;
}

async function requestFolder(kind, inputId) {

    if (picked &amp;&amp; picked.files) {
      await loadSelectedFolder(kind, picked.files, picked.label || &#x27;STAR&#x27;);
      return;
    }
  }
  if (&#x27;showDirectoryPicker&#x27; in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode:&#x27;read&#x27;, id:&#x27;star-reflectance-picker&#x27; });
      const files = await collectFilesFromDirectoryHandle(handle, `${handle.name}/`);
      await loadSelectedFolder(kind, files, handle.name);
      return;
    } catch (error) {
      if (error &amp;&amp; error.name === &#x27;AbortError&#x27;) return;
      console.warn(&#x27;Directory picker failed; falling back to directory input:&#x27;, error);
    }
  }
  $(inputId).click();
}

/* ---------------------------
   CSV parsing
   --------------------------- */
function parseCSVText(raw) {
  const lines = String(raw)
    .replace(/\r\n/g,&#x27;\n&#x27;)
    .replace(/\r/g,&#x27;\n&#x27;)
    .split(&#x27;\n&#x27;)
    .map(line =&gt; line.trim())
    .filter(Boolean);

  if (!lines.length) return;

  const parsed = [];
  let dateCount = 0;

  for (const line of lines) {
    const parts = line.split(/[,;\t]+/).map(part =&gt; part.trim());
    if (parts.length &lt; 2) continue;

    const first = parts[0];
    const second = parts[1];
    const timeNumber = Number(first);
    const fluxNumber = Number(second);

    if (!Number.isFinite(fluxNumber)) continue;

    if (Number.isFinite(timeNumber) &amp;&amp; first !== &#x27;&#x27;) {
      parsed.push({ rawT:timeNumber, flux:fluxNumber });
    } else {
      const ms = Date.parse(first);
      if (!Number.isNaN(ms)) {
        parsed.push({ rawT:ms, flux:fluxNumber, isDate:true });
        dateCount += 1;
      }
    }
  }

  if (!parsed.length) return;

  const isDate = dateCount &gt; 0;
  parsed.sort((a, b) =&gt; a.rawT - b.rawT);
  csvData = isDate
    ? parsed.map(row =&gt; ({ t:(row.rawT - parsed[0].rawT) / 1000, flux:row.flux }))
    : parsed.map(row =&gt; ({ t:row.rawT, flux:row.flux }));

  csvIsTimeDate = isDate;
  updateFooter();
  resizeCanvas();
  drawChart();

  if (frameURLs.length) showFrame(currentFrameIdx &gt;= 0 ? currentFrameIdx : 0, { force:true });
}

function loadFramesFromFiles(files, label = &#x27;Selected folder&#x27;) {
  revokeFrameURLs();
  imgCache.length = 0;
  frameFiles = Array.from(files).sort((a, b) =&gt; a.name.localeCompare(b.name, undefined, { numeric:true }));
  frameURLs = frameFiles.map(file =&gt; URL.createObjectURL(file));
  imgCache = new Array(frameURLs.length).fill(null);
  currentFrameIdx = -1;
  resetImageTransform();
  loadProgress.style.width = &#x27;0%&#x27;;

  let loaded = 0;
  for (let i = 0; i &lt; frameURLs.length; i += 1) {
    const img = new Image();
    img.decoding = &#x27;async&#x27;;
    img.src = frameURLs[i];
    img.onload = () =&gt; {
      imgCache[i] = img;
      loaded += 1;
      loadProgress.style.width = `${Math.round(loaded / frameURLs.length * 100)}%`;
      if (loaded === 1 &amp;&amp; currentFrameIdx === -1) showFrame(0, { noFade:true });
      if (loaded === frameURLs.length) setTimeout(() =&gt; { loadProgress.style.width = &#x27;0%&#x27;; }, 250);
    };
    img.onerror = () =&gt; {
      loaded += 1;
      loadProgress.style.width = `${Math.round(loaded / frameURLs.length * 100)}%`;
    };
  }

  ftFrames.textContent = frameURLs.length || &#x27;—&#x27;;
  updateFooter();
  drawChart();
}

function loadFramesFromURLs(urls, fileNames) {
  revokeFrameURLs();
  frameURLs = urls.slice();
  frameFiles = fileNames.map(name =&gt; ({ name }));
  imgCache = new Array(frameURLs.length).fill(null);
  currentFrameIdx = -1;
  resetImageTransform();

  let loaded = 0;
  for (let i = 0; i &lt; frameURLs.length; i += 1) {
    const img = new Image();
    img.decoding = &#x27;async&#x27;;
    img.src = frameURLs[i];
    img.onload = () =&gt; {
      imgCache[i] = img;
      loaded += 1;
      loadProgress.style.width = `${Math.round(loaded / frameURLs.length * 100)}%`;

      if (loaded === frameURLs.length) setTimeout(() =&gt; { loadProgress.style.width = &#x27;0%&#x27;; }, 250);
    };
    img.onerror = () =&gt; { loaded += 1; };
  }

  fileStatus.frames.loaded = true;
  fileStatus.frames.count = frameURLs.length;
  fileStatus.frames.path = DEFAULT_FRAMES_PATH;
  updateFooter();
  updateFileAccessPanel();
}

async function tryFetchText(urls) {

  for (const url of list) {
    try {
      const response = await fetch(url, { cache:&#x27;no-store&#x27; });
      if (response.ok) return await response.text();
      errors.push(`${url}: HTTP ${response.status}`);
    } catch (error) {
      errors.push(`${url}: ${error.message}`);
    }
  }

  throw new Error(errors.join(&#x27; | &#x27;));
}

async function loadDefaultPaths() {
  try {
    const text = await tryFetchText([DEFAULT_CSV_PATH, ABSOLUTE_CSV_FILE]);
    parseCSVText(text);
    fileStatus.csv.loaded = true;
    fileStatus.csv.path = DEFAULT_CSV_PATH;
  } catch (error) {
    console.warn(&#x27;Default CSV loading failed. Manual folder selection is available:&#x27;, error);
    fileStatus.csv.loaded = false;
  }

  updateFileAccessPanel();

  try {
    await loadDefaultFramesByPattern();
  } catch (error) {
    console.warn(&#x27;Default frame loading failed. Manual folder selection is available:&#x27;, error);
    fileStatus.frames.loaded = false;
    updateFileAccessPanel();
  }
}

function framePatterns() {
  const patterns = [];
  const stems = [&#x27;frame_&#x27;, &#x27;Frame_&#x27;, &#x27;&#x27;];
  const extensions = [&#x27;png&#x27;, &#x27;jpg&#x27;, &#x27;jpeg&#x27;, &#x27;webp&#x27;];
  const widths = [4, 3, 2, 0];
  const starts = [0, 1];

  for (const ext of extensions) {
    for (const stem of stems) {
      for (const width of widths) {
        for (const start of starts) {
          patterns.push({
            start,
            name: (idx) =&gt; `${stem}${width ? String(idx).padStart(width, &#x27;0&#x27;) : String(idx)}.${ext}`
          });
        }
      }
    }
  }
  return patterns;
}

async function urlExists(url) {
  try {
    const response = await fetch(url, { method:&#x27;HEAD&#x27;, cache:&#x27;no-store&#x27; });
    if (response.ok) return true;
  } catch (_) {}

  try {
    const response = await fetch(url, { cache:&#x27;no-store&#x27; });
    return response.ok;
  } catch (_) {
    return false;
  }
}

async function loadDefaultFramesByPattern() {
  let active = null;
  for (const pattern of framePatterns()) {
    const probe = DEFAULT_FRAMES_PATH + pattern.name(pattern.start);
    if (await urlExists(probe)) {
      active = pattern;
      break;
    }
  }

  if (!active) return;

  const urls = [];
  const names = [];
  const maxFrames = csvData.length ? Math.min(Math.max(csvData.length, 1), 20000) : 20000;
  let missingCount = 0;
  let idx = active.start;

  while (urls.length &lt; maxFrames &amp;&amp; missingCount &lt; 3) {
    const name = active.name(idx);
    const url = DEFAULT_FRAMES_PATH + name;
    if (await urlExists(url)) {
      urls.push(url);
      names.push(name);
      missingCount = 0;
    } else {
      missingCount += 1;
    }
    idx += 1;
  }

  if (urls.length) {
    loadFramesFromURLs(urls, names);
  }
}

/* ---------------------------
   Canvas chart
   --------------------------- */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = chartContainer.clientWidth;
  const cssHeight = chartContainer.clientHeight;
  chartCanvas.width = Math.max(1, Math.round(cssWidth * dpr));
  chartCanvas.height = Math.max(1, Math.round(cssHeight * dpr));
  chartCanvas.style.width = `${cssWidth}px`;
  chartCanvas.style.height = `${cssHeight}px`;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawChart();
}

function getPlotDims() {
  const dpr = window.devicePixelRatio || 1;
  const W = chartCanvas.width / dpr;
  const H = chartCanvas.height / dpr;
  return { W, H, pw: W - PAD.left - PAD.right, ph: H - PAD.top - PAD.bottom };
}

function findNearestIndexByTime(arr, t) {
  if (!arr.length) return 0;
  let low = 0;
  let high = arr.length - 1;

  while (high - low &gt; 8) {
    const mid = Math.floor((low + high) / 2);
    if (arr[mid].t &lt; t) low = mid;
    else high = mid;
  }

  let best = low;
  let bestDistance = Math.abs(arr[low].t - t);
  for (let i = low + 1; i &lt;= high; i += 1) {
    const distance = Math.abs(arr[i].t - t);
    if (distance &lt; bestDistance) {
      best = i;
      bestDistance = distance;
    }
  }
  return best;
}

function drawChart(cursorX) {
  const c = themeColors();
  const { W, H, pw, ph } = getPlotDims();

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = c.plotBg;
  ctx.fillRect(0,0,W,H);

  if (!csvData.length) {
    ctx.fillStyle = c.muted;
    ctx.font = &#x27;12px Space Mono, monospace&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;Load flux.csv to display the flux time series&#x27;, W / 2, H / 2);
    return;
  }

  const tMin = csvData[0].t;
  const tMax = csvData[csvData.length - 1].t;
  const fluxValues = csvData.map(row =&gt; row.flux);
  const fluxMin = Math.min(...fluxValues);
  const fluxMax = Math.max(...fluxValues);
  const fluxPad = (fluxMax - fluxMin) * 0.08 || 1;
  const yMin = fluxMin - fluxPad;
  const yMax = fluxMax + fluxPad;

  ctx.strokeStyle = c.border;
  ctx.lineWidth = 1;

  const yTicks = 6;
  for (let i = 0; i &lt;= yTicks; i += 1) {
    const y = PAD.top + (1 - i / yTicks) * ph;
    ctx.beginPath();
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + pw, y);
    ctx.stroke();
  }

  const xTicks = 6;
  for (let i = 0; i &lt;= xTicks; i += 1) {
    const x = PAD.left + (i / xTicks) * pw;
    ctx.beginPath();
    ctx.moveTo(x, PAD.top);
    ctx.lineTo(x, PAD.top + ph);
    ctx.stroke();
  }

  ctx.strokeStyle = c.muted;
  ctx.beginPath();
  ctx.rect(PAD.left, PAD.top, pw, ph);
  ctx.stroke();

  ctx.fillStyle = c.muted;
  ctx.font = &#x27;11px Space Mono, monospace&#x27;;
  ctx.textAlign = &#x27;right&#x27;;
  for (let i = 0; i &lt;= yTicks; i += 1) {
    const flux = yMin + (yMax - yMin) * i / yTicks;
    const y = PAD.top + (1 - (flux - yMin) / (yMax - yMin || 1)) * ph;
    ctx.fillText(flux.toFixed(2), PAD.left - 8, y + 4);
  }

  ctx.textAlign = &#x27;center&#x27;;
  for (let i = 0; i &lt;= xTicks; i += 1) {
    const t = tMin + (tMax - tMin) * i / xTicks;
    const x = PAD.left + (t - tMin) / (tMax - tMin || 1) * pw;
    ctx.fillText(formatSecondsLabel(t), x, PAD.top + ph + 18);
  }

  ctx.beginPath();
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 2;
  ctx.lineJoin = &#x27;round&#x27;;
  for (let i = 0; i &lt; csvData.length; i += 1) {
    const x = PAD.left + (csvData[i].t - tMin) / (tMax - tMin || 1) * pw;
    const y = PAD.top + (1 - (csvData[i].flux - yMin) / (yMax - yMin || 1)) * ph;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  if (frameURLs.length &gt; 1) {
    ctx.strokeStyle = c.accent2;
    for (let i = 0; i &lt; frameURLs.length; i += 1) {
      const frac = i / (frameURLs.length - 1);
      const x = PAD.left + frac * pw;
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.moveTo(x, PAD.top + ph);
      ctx.lineTo(x, PAD.top + ph + 6);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  if (typeof cursorX === &#x27;number&#x27;) {
    const clampedX = clamp(cursorX, PAD.left, PAD.left + pw);
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = c.accent;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(clampedX, PAD.top);
    ctx.lineTo(clampedX, PAD.top + ph);
    ctx.stroke();
    ctx.setLineDash([]);

    const tHover = tMin + (clampedX - PAD.left) / (pw || 1) * (tMax - tMin || 1);
    const idx = findNearestIndexByTime(csvData, tHover);
    const nearest = csvData[idx];
    const xNearest = PAD.left + (nearest.t - tMin) / (tMax - tMin || 1) * pw;
    const yNearest = PAD.top + (1 - (nearest.flux - yMin) / (yMax - yMin || 1)) * ph;

    ctx.beginPath();
    ctx.arc(xNearest, yNearest, 5, 0, Math.PI * 2);
    ctx.fillStyle = c.strong;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = c.accent;
    ctx.stroke();

    statT.textContent = nearest.t.toFixed(4);
    statFlux.textContent = nearest.flux.toFixed(4);

    if (frameURLs.length) {
      const frac = (nearest.t - tMin) / (tMax - tMin || 1);
      const frameIdx = clamp(Math.round(frac * (frameURLs.length - 1)), 0, frameURLs.length - 1);
      statFrame.textContent = `${frameIdx + 1}/${frameURLs.length}`;
      seekRange.max = Math.max(1, frameURLs.length - 1);
      seekRange.value = frameIdx;
    }
  }
}

function frameIndexFromCanvasX(x) {
  if (!frameURLs.length) return 0;
  const dims = getPlotDims();
  const clamped = clamp(x, PAD.left, PAD.left + dims.pw);
  const frac = (clamped - PAD.left) / (dims.pw || 1);
  return clamp(Math.round(frac * (frameURLs.length - 1)), 0, frameURLs.length - 1);
}

chartCanvas.addEventListener(&#x27;mousedown&#x27;, (event) =&gt; {
  if (!frameURLs.length) return;
  isScrubbing = true;
  stopPlayback();
  const rect = chartCanvas.getBoundingClientRect();
  showFrame(frameIndexFromCanvasX(event.clientX - rect.left));
});

window.addEventListener(&#x27;mousemove&#x27;, (event) =&gt; {
  if (!isScrubbing) return;
  const rect = chartCanvas.getBoundingClientRect();
  showFrame(frameIndexFromCanvasX(event.clientX - rect.left));
});

window.addEventListener(&#x27;mouseup&#x27;, () =&gt; {
  isScrubbing = false;
});

chartCanvas.addEventListener(&#x27;mousemove&#x27;, (event) =&gt; {
  if (isScrubbing) return;
  const rect = chartCanvas.getBoundingClientRect();
  drawChart(event.clientX - rect.left);
});

chartCanvas.addEventListener(&#x27;mouseleave&#x27;, () =&gt; {
  if (isScrubbing) return;

  statFlux.textContent = &#x27;—&#x27;;
  statFrame.textContent = &#x27;—&#x27;;
});

/* ---------------------------
   Frame display
   --------------------------- */
function ensureDisplayedImage() {
  let image = $(&#x27;displayed-img&#x27;);
  if (image) return image;

  image = document.createElement(&#x27;img&#x27;);
  image.id = &#x27;displayed-img&#x27;;
  image.alt = &#x27;frame&#x27;;
  frameDisplay.innerHTML = &#x27;&#x27;;
  frameDisplay.appendChild(image);
  return image;
}

function getXForFrameIndex(idx) {
  const dims = getPlotDims();
  if (!csvData.length) {
    const frac = frameURLs.length &gt; 1 ? idx / (frameURLs.length - 1) : 0;
    return PAD.left + frac * dims.pw;
  }

  const tMin = csvData[0].t;
  const tMax = csvData[csvData.length - 1].t;
  const frac = frameURLs.length &gt; 1 ? idx / (frameURLs.length - 1) : 0;
  const t = tMin + frac * (tMax - tMin || 1);
  return PAD.left + (t - tMin) / (tMax - tMin || 1) * dims.pw;
}

function showFrame(idx, options = {}) {
  if (!frameURLs.length) return;

  idx = clamp(Math.round(idx), 0, frameURLs.length - 1);
  if (idx === currentFrameIdx &amp;&amp; !options.force) return;

  const displayed = ensureDisplayedImage();
  const cached = imgCache[idx];

  if (cached &amp;&amp; cached.complete) displayed.src = cached.src;
  else displayed.src = frameURLs[idx];

  updateImageTransform();

  displayed.alt = frameFiles[idx]?.name || `frame-${idx + 1}`;
  frameCounter.textContent = `${idx + 1} / ${frameURLs.length}`;
  metaName.textContent = frameFiles[idx]?.name || &#x27;—&#x27;;
  metaIdx.textContent = idx + 1;

  if (csvData.length) {
    const frac = idx / Math.max(1, frameURLs.length - 1);
    const tMin = csvData[0].t;
    const tMax = csvData[csvData.length - 1].t;
    const t = tMin + frac * (tMax - tMin || 1);
    const nearestIdx = findNearestIndexByTime(csvData, t);
    metaTime.textContent = csvData[nearestIdx].t.toFixed(4);
    metaFlux.textContent = csvData[nearestIdx].flux.toFixed(4);
  } else {
    metaTime.textContent = &#x27;—&#x27;;
    metaFlux.textContent = &#x27;—&#x27;;
  }

  seekRange.max = Math.max(1, frameURLs.length - 1);
  seekRange.value = idx;
  statFrame.textContent = `${idx + 1}/${frameURLs.length}`;
  currentFrameIdx = idx;
  drawChart(getXForFrameIndex(idx));
}

/* ---------------------------
   Playback
   --------------------------- */
prevBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
  if (!frameURLs.length) return;
  showFrame(currentFrameIdx &lt;= 0 ? (loopPlayback ? frameURLs.length - 1 : 0) : currentFrameIdx - 1);
});

nextBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
  if (!frameURLs.length) return;
  showFrame(currentFrameIdx &gt;= frameURLs.length - 1 ? (loopPlayback ? 0 : frameURLs.length - 1) : currentFrameIdx + 1);
});

seekRange.addEventListener(&#x27;input&#x27;, (event) =&gt; showFrame(Number(event.target.value)));
playBtn.addEventListener(&#x27;click&#x27;, () =&gt; isPlaying ? stopPlayback() : startPlayback());
speedSel.addEventListener(&#x27;change&#x27;, () =&gt; { speedMultiplier = Number(speedSel.value) || 1; });
fpsInput.addEventListener(&#x27;change&#x27;, () =&gt; { baseFrameInterval = 1000 / (Number(fpsInput.value) || 24); });
loopChk.addEventListener(&#x27;change&#x27;, () =&gt; { loopPlayback = loopChk.checked; });

loopChk.checked = true;
speedMultiplier = Number(speedSel.value) || 1;
baseFrameInterval = 1000 / (Number(fpsInput.value) || 24);

function startPlayback() {
  if (!frameURLs.length || isPlaying) return;
  isPlaying = true;
  playBtn.textContent = &#x27;Pause&#x27;;
  lastPlayTS = performance.now();
  accumulated = 0;
  playLoop(lastPlayTS);
}

function stopPlayback() {
  if (!isPlaying) return;
  isPlaying = false;
  playBtn.textContent = &#x27;Play&#x27;;
  if (playRequest) cancelAnimationFrame(playRequest);
  playRequest = null;
}

function playLoop(timestamp) {
  if (!isPlaying) return;
  playRequest = requestAnimationFrame(playLoop);
  const delta = timestamp - lastPlayTS;
  lastPlayTS = timestamp;
  accumulated += delta;
  const interval = baseFrameInterval / (speedMultiplier || 1);

  if (accumulated &gt;= interval) {
    const steps = Math.floor(accumulated / interval);
    accumulated -= steps * interval;
    let nextIndex = (currentFrameIdx &lt; 0 ? 0 : currentFrameIdx) + steps;

    if (nextIndex &gt; frameURLs.length - 1) {
      if (loopPlayback) nextIndex %= frameURLs.length;
      else nextIndex = frameURLs.length - 1;
    }

    showFrame(nextIndex);
  } else if (currentFrameIdx &gt;= 0 &amp;&amp; frameURLs.length &gt; 1) {
    const progress = accumulated / (interval || 1);
    const nextIdx = Math.min(frameURLs.length - 1, currentFrameIdx + 1);
    const x0 = getXForFrameIndex(currentFrameIdx);
    const x1 = getXForFrameIndex(nextIdx);
    drawChart(x0 + (x1 - x0) * progress);
  }
}

function updateFooter() {
  ftPoints.textContent = csvData.length || &#x27;—&#x27;;
  ftFrames.textContent = frameURLs.length || &#x27;—&#x27;;

  if (csvData.length) {
    const tMin = csvData[0].t;
    const tMax = csvData[csvData.length - 1].t;
    const fluxValues = csvData.map(row =&gt; row.flux);
    ftTrange.textContent = `${tMin.toFixed(2)} → ${tMax.toFixed(2)}`;
    ftFluxRange.textContent = `${Math.min(...fluxValues).toFixed(2)} → ${Math.max(...fluxValues).toFixed(2)}`;
  } else {
    ftTrange.textContent = &#x27;—&#x27;;
    ftFluxRange.textContent = &#x27;—&#x27;;
  }
}

[&#x27;dragenter&#x27;,&#x27;dragover&#x27;].forEach(eventName =&gt; {

window.addEventListener(&#x27;drop&#x27;, async (event) =&gt; {
  event.preventDefault();
  const files = Array.from(event.dataTransfer.files || []);
  const csvs = files.filter(file =&gt; /\.(csv|txt)$/i.test(file.name));
  const imgs = files.filter(file =&gt; /\.(png|jpg|jpeg|webp)$/i.test(file.name));

    await loadCSVFromFolderFiles(csvs, &#x27;Dropped files&#x27;);
    fileStatus.csv.loaded = true;
    fileStatus.csv.path = csvs[0].name;
  }

  if (imgs.length) {

    fileStatus.frames.loaded = true;
    fileStatus.frames.count = imgs.length;
    fileStatus.frames.path = `${imgs.length} dropped image frame(s)`;

  updateFileAccessPanel();
});


window.receiveReflectanceFilesFromParent = async function(payload = {}, labels = {}) {
  try {
    if (payload.csvFiles) await loadCSVFromFolderFiles(Array.from(payload.csvFiles || []), labels.csv || 'RUN folder · END-010 flux output');
    if (payload.frameFiles) await loadFramesFromFolderFiles(Array.from(payload.frameFiles || []), labels.frames || 'RUN folder · END-010 rendered frames');
    updateFileAccessPanel();
    updateFooter();
    resizeCanvas();
    drawChart();
  } catch (error) {
    console.warn('Unable to load END-010 data from the selected RUN folder:', error);
  }
};
window.refreshReflectanceDashboard = function() {
  try { updateFileAccessPanel(); updateFooter(); resizeCanvas(); drawChart(); if (currentFrameIdx >= 0) showFrame(currentFrameIdx, { force:true }); } catch (error) { console.warn(error); }
};

   Input bindings
   --------------------------- */

(() =&gt; {
&#x27;use strict&#x27;;

const ABSOLUTE_DATA_DIR = &#x27;file:///C:/Users/s5oss/Desktop/software_s5lab/STAR/Output/RUN_XXXXX/modules_output/END-003/results_attitude_propagator/&#x27;;
const AUTO_INPUT_DIR = &#x27;./modules_output/END-003/&#x27;;

const $ = (id) =&gt; document.getElementById(id);

});

function escapeHtml(value) {
  return String(value ?? &#x27;&#x27;).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;).replaceAll(&quot;&#x27;&quot;,&#x27;&amp;#039;&#x27;);
}
function readPath(obj, path, fallback = undefined) {
  return path.split(&#x27;.&#x27;).reduce((acc, key) =&gt; (acc &amp;&amp; acc[key] !== undefined ? acc[key] : undefined), obj) ?? fallback;
}
function fmt(v, d = 2, fallback = &#x27;—&#x27;) {
  const n = Number(v);
  return Number.isFinite(n) ? n.toFixed(d) : fallback;
}

function setupTheme() {

function setTheme(theme, persist = true) {
  document.documentElement.dataset.theme = theme;
  if (persist) localStorage.setItem(&#x27;star-attitude-theme&#x27;, theme);
  $(&#x27;theme-switch&#x27;).checked = theme === &#x27;light&#x27;;
  $(&#x27;theme-label&#x27;).textContent = theme === &#x27;light&#x27; ? &#x27;Light&#x27; : &#x27;Dark&#x27;;
  drawDashboard();
}

function parseDataJs(text) {
  const match = String(text || &#x27;&#x27;).trim().match(/(?:window\.)?attitudePropagationData\s*=\s*([\s\S]*?)\s*;?\s*$/);
  if (!match) throw new Error(&#x27;The selected JavaScript file does not define window.attitudePropagationData.&#x27;);
  return JSON.parse(match[1]);
}
async function fetchJson(url) {

  if (!r.ok) throw new Error(`${url} returned HTTP ${r.status}`);
  return r.json();
}
async function fetchText(url) {
  const r = await fetch(url, { cache: &#x27;no-store&#x27; });
  if (!r.ok) throw new Error(`${url} returned HTTP ${r.status}`);
  return r.text();
}

  $(&#x27;file-access-panel&#x27;).innerHTML = `

  `;

async function collectFilesFromDirectoryHandle(handle, prefix = &#x27;&#x27;) {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === &#x27;file&#x27;) {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${prefix}${name}`;
      files.push(file);
    } else if (entry.kind === &#x27;directory&#x27;) {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${prefix}${name}/`));
    }
  }
  return files;
}
async function requestFolder(kind, inputId) {
  if (window.parent &amp;&amp; window.parent !== window &amp;&amp; typeof window.parent.STAR_PICK_DIRECTORY === &#x27;function&#x27;) {
    const picked = await window.parent.STAR_PICK_DIRECTORY(&#x27;attitude&#x27;, kind);
    if (picked &amp;&amp; picked.files) {
      await loadSelectedFolder(kind, picked.files, picked.label || &#x27;STAR&#x27;);
      return;
    }
  }
  if (&#x27;showDirectoryPicker&#x27; in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode: &#x27;read&#x27;, id: &#x27;star-attitude-folder&#x27;, startIn: &#x27;desktop&#x27; });
      const files = await collectFilesFromDirectoryHandle(handle, `${handle.name}/`);
      await loadSelectedFolder(kind, files, handle.name);
      return;
    } catch (error) {
      if (error &amp;&amp; error.name === &#x27;AbortError&#x27;) return;
      console.warn(&#x27;Directory picker failed; falling back to directory input:&#x27;, error);
    }
  }
  $(inputId).click();
}
function fileRelativePath(file) {
  return file.relativeDisplayPath || file.webkitRelativePath || file.name;
}
function findFile(files, name) {
  const target = name.toLowerCase();
  return files.find((file) =&gt; file.name.toLowerCase() === target) || null;
}
async function loadSelectedFolder(kind, files, label = &#x27;Selected folder&#x27;) {
  const array = Array.from(files || []);
  if (kind === &#x27;data&#x27;) await loadDataFromFiles(array, label);
  if (kind === &#x27;input&#x27;) await loadInputFromFiles(array, label);
  if (kind === &#x27;png&#x27;) loadPngFromFiles(array, label);
  updateFileAccessPanel();
  drawDashboard();
}
async function loadDataFromFiles(files, label) {
  const js = findFile(files, DATA_JS);
  const json = findFile(files, DATA_JSON);
  try {
    if (js) {
      state.data = parseDataJs(await js.text());
      state.fileStatus.data = { loaded: true, path: fileRelativePath(js) };
    } else if (json) {
      state.data = JSON.parse(await json.text());
      state.fileStatus.data = { loaded: true, path: fileRelativePath(json) };
    } else {
      state.fileStatus.data.loaded = false;
      state.fileStatus.data.path = `${label}: ${DATA_JS} not found`;
    }
    if (state.data &amp;&amp; state.data.input &amp;&amp; !state.input) state.input = state.data.input;
    loadPngFromFiles(files, label);
  } catch (error) {
    state.fileStatus.data.loaded = false;
    state.fileStatus.data.path = `${label}: ${error.message}`;
  }
}
async function loadInputFromFiles(files, label) {
  const file = findFile(files, INPUT_JSON) || findFile(files, LEGACY_INPUT_JSON) || findFile(files, 'STEP_002_END-003_input.json');
  if (!file) {
    state.fileStatus.input.loaded = false;
    state.fileStatus.input.path = `${label}: ${INPUT_JSON} or ${LEGACY_INPUT_JSON} not found`;
    return;
  }
  try {
    state.input = JSON.parse(await file.text());
    state.fileStatus.input = { loaded: true, path: fileRelativePath(file) };
  } catch (error) {
    state.fileStatus.input.loaded = false;
    state.fileStatus.input.path = `${fileRelativePath(file)}: ${error.message}`;
  }
}
function loadPngFromFiles(files, label) {
  const pngs = files.filter((file) =&gt; /^0[1-6]_.+\.png$/i.test(file.name) || /\.png$/i.test(file.name));
  state.pngFiles.forEach((url) =&gt; URL.revokeObjectURL(url));
  state.pngFiles.clear();
  pngs.sort((a,b) =&gt; a.name.localeCompare(b.name, undefined, { numeric: true })).forEach((file) =&gt; {
    state.pngFiles.set(file.name, URL.createObjectURL(file));
  });
  state.fileStatus.png.loaded = state.pngFiles.size &gt; 0;
  state.fileStatus.png.count = state.pngFiles.size;
  state.fileStatus.png.path = state.pngFiles.size ? `${label}: ${state.pngFiles.size} PNG figure(s)` : `${label}: no PNG figures found`;
}

async function loadDefaultRelativeData() {
  try {
    const parentData = getParentAttitudeData();
    if (parentData) {
      state.data = JSON.parse(JSON.stringify(parentData));
      state.fileStatus.data.loaded = true;
      state.fileStatus.data.path = &#x27;RUN_XXXXX/modules_output/END-003/results_attitude_propagator/attitude_propagation_plots_data.js&#x27;;
    } else if (window.attitudePropagationData) {
      state.data = JSON.parse(JSON.stringify(window.attitudePropagationData));
      state.fileStatus.data.loaded = true;
      state.fileStatus.data.path = AUTO_DATA_DIR + DATA_JS;
    } else {
      let text = null;
      try { text = await fetchText(AUTO_DATA_DIR + DATA_JS); }
      catch (_) { text = await fetchText(ABSOLUTE_DATA_DIR + DATA_JS); }
      state.data = parseDataJs(text);
      state.fileStatus.data.loaded = true;
      state.fileStatus.data.path = AUTO_DATA_DIR + DATA_JS;
    }
    if (state.data?.input) state.input = state.data.input;
  } catch (error) {
    console.warn(&#x27;Dashboard data auto-load failed:&#x27;, error);
  }
  try {
    try { state.input = await fetchJson(AUTO_INPUT_DIR + INPUT_JSON); }
    catch (_) { state.input = await fetchJson(ABSOLUTE_INPUT_DIR + INPUT_JSON); }
    state.fileStatus.input.loaded = true;
  } catch (error) {
    if (state.data?.input) state.fileStatus.input.loaded = true;
    console.warn(&#x27;Input auto-load failed:&#x27;, error);
  }
  await loadDefaultPngs();
  updateFileAccessPanel();
  drawDashboard();
}
async function loadDefaultPngs() {
  const names = readPath(state.data, &#x27;png_outputs&#x27;, [&#x27;01_telemetry.png&#x27;,&#x27;02_tracking.png&#x27;,&#x27;03_angular_momentum.png&#x27;,&#x27;04_ground_track.png&#x27;,&#x27;05_orbit_3d_ecef.png&#x27;,&#x27;06_orbit_3d_eci.png&#x27;]);
  names.forEach((name) =&gt; state.pngFiles.set(name, AUTO_DATA_DIR + name));
  /* Local browsers often block fetch/HEAD on file:// URLs, while &lt;img&gt; can still render
     relative PNG files correctly. Therefore the gallery is populated optimistically. */
  state.fileStatus.png.loaded = state.pngFiles.size &gt; 0;
  state.fileStatus.png.count = state.pngFiles.size;
  state.fileStatus.png.path = AUTO_DATA_DIR + &#x27;01_telemetry.png … 06_orbit_3d_eci.png&#x27;;
}

function latLonToXyz(lon, lat, r) {
  const lambda = lon * Math.PI / 180;
  const phi = lat * Math.PI / 180;
  const c = Math.cos(phi);
  return [r * c * Math.cos(lambda), r * c * Math.sin(lambda), r * Math.sin(phi)];
}

function drawOrbit3D(div, frame) {
  const el = $(div);
  const d = state.data;
  const fallbackName = frame === &#x27;ECI&#x27; ? &#x27;06_orbit_3d_eci.png&#x27; : &#x27;05_orbit_3d_ecef.png&#x27;;
  if (!el) return;
  if (!d) {
    const url = state.pngFiles.get(fallbackName);
    el.innerHTML = url ? `&lt;div class=&quot;plot-fallback-wrap&quot;&gt;&lt;img class=&quot;plot-fallback-image&quot; src=&quot;${url}&quot; alt=&quot;${fallbackName}&quot;&gt;&lt;/div&gt;` : &#x27;&#x27;;
    return;
  }

  try {
    const c = colors();
    const site = d.site || {};
    const R = 6371;
    const fullRaw = frame === &#x27;ECI&#x27; ? readPath(d,&#x27;orbit.r_eci_km&#x27;,[]) : readPath(d,&#x27;orbit.r_ecef_km&#x27;,[]);
    const groundRaw = readPath(d,&#x27;orbit.r_ground_ecef_km&#x27;,[]);
    const full = asArray(fullRaw).filter(validVec3);
    const ground = asArray(groundRaw).filter(validVec3);

    if (!full.length) {
      el.innerHTML = &#x27;&lt;div class=&quot;empty-cell&quot;&gt;3D orbit vectors not available in attitude_propagation_plots_data.js.&lt;/div&gt;&#x27;;
      return;

    const traces = [earthSurface(R)];

      if (arr.length) {
        traces.push({
          type:&#x27;scatter3d&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Coverage&#x27;, showlegend:i===0,
          x:vecColumn(arr,0), y:vecColumn(arr,1), z:vecColumn(arr,2),

        });
      }

      if (frame === &#x27;ECEF&#x27; &amp;&amp; gArr.length) {
        traces.push({
          type:&#x27;scatter3d&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Coverage ground&#x27;, showlegend:i===0,
          x:vecColumn(gArr,0), y:vecColumn(gArr,1), z:vecColumn(gArr,2),

        });

        x:[Number(gs[0])], y:[Number(gs[1])], z:[Number(gs[2])],

      });

      autorange:true, fixedrange:false,
      tickfont:{color:c.muted,size:9}, titlefont:{color:c.text,size:10}
    };
    const layout = {
      autosize:true,
      paper_bgcolor:c.panel,
      plot_bgcolor:c.plotBg,
      font:{color:c.text,family:&#x27;Space Mono, monospace&#x27;,size:10},
      margin:{t:4,b:4,l:4,r:4},
      showlegend:true,
      legend:{orientation:&#x27;h&#x27;,x:0.01,y:0.99,xanchor:&#x27;left&#x27;,yanchor:&#x27;top&#x27;,font:{size:9},bgcolor:&#x27;rgba(9,10,13,.55)&#x27;,bordercolor:&#x27;rgba(114,125,151,.18)&#x27;,borderwidth:1},

(() =&gt; {

function renderDiagnostics(data){

  const modules = data.modules || [];
  $(&#x27;modules-table&#x27;).innerHTML = modules.length ? modules.map(m =&gt; `&lt;tr&gt;&lt;td&gt;${esc(m.module)}&lt;/td&gt;&lt;td&gt;${esc(m.status || &#x27;unknown&#x27;)}&lt;/td&gt;&lt;td&gt;${esc(m.generatedArtifacts ?? &#x27;—&#x27;)}&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;${esc(m.notes || &#x27;&#x27;)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;empty&quot;&gt;No execution metadata loaded.&lt;/td&gt;&lt;/tr&gt;&#x27;;
  const issues = data.issues || [];

}
window.receiveDiagnosticsFromParent = renderDiagnostics;
window.refreshDiagnosticsDashboard = function(){ if (window.parent &amp;&amp; typeof window.parent.updateRunDiagnostics === &#x27;function&#x27;) window.parent.updateRunDiagnostics(); };

})();

  },
  synthetic: {
    png: ['modules_output', 'END-007', 'results_synthetic_data_generation']
  }
};

function setupTheme() {
  const saved = localStorage.getItem('star-unified-theme') || 'dark';
  const theme = saved === 'light' ? 'light' : 'dark';
  setTheme(theme, false);
}

function setTheme(theme, persist = true) {
  document.documentElement.dataset.theme = theme;
  if (persist) localStorage.setItem('star-unified-theme', theme);
  $('theme-switch').checked = theme === 'light';
  $('theme-label').textContent = theme === 'light' ? 'Light' : 'Dark';
  propagateTheme(theme);
}

function propagateTheme(theme) {
  for (const frame of [$('frame-constellation'), $('frame-attitude'), $('frame-power'), $('frame-synthetic'), $('frame-reflectance'), $('frame-diagnostics')]) {
    try {
      const doc = frame.contentDocument;
      if (!doc) continue;
      doc.documentElement.dataset.theme = theme;

      const childSwitch = doc.getElementById('theme-switch');
      const childLabel = doc.getElementById('theme-label');
      if (childSwitch) childSwitch.checked = theme === 'light';
      if (childLabel) childLabel.textContent = theme === 'light' ? 'Light' : 'Dark';

      frame.contentWindow.dispatchEvent(new Event('resize'));
    } catch (error) {
      console.warn('Unable to propagate theme to a child frame:', error);
    }
  }
}

async function collectFilesFromDirectoryHandle(handle, pathPrefix = '') {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === 'file') {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${pathPrefix}${name}`;
      files.push(file);
    } else if (entry.kind === 'directory') {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${pathPrefix}${name}/`));
    }
  }
  return files;
}

async function listRunFolders(rootHandle) {
  if (!rootHandle) return [];
  if (/^RUN[_-]/i.test(rootHandle.name)) return [{ name: rootHandle.name, handle: rootHandle }];
  return [];
}

async function ensureCurrentRunFolder() {
  if (currentRunHandle) return currentRunHandle;
  if (!starRootHandle) throw new Error('No RUN output folder has been selected.');
  currentRunHandle = starRootHandle;
  currentRunName = starRootHandle.name;
  updateRootStatus();
  return currentRunHandle;
}

async function resolveDirectoryHandle(rootHandle, pathParts) {
  let current = rootHandle;
  for (const part of pathParts) {
    if (part === '$RUN') {
      current = await ensureCurrentRunFolder();
    } else {
      current = await current.getDirectoryHandle(part);
    }
  }
  return current;
}

async function ensureStarRootFolder() {
  if (starRootHandle) {
    await ensureCurrentRunFolder();
    return starRootHandle;
  }

  if (!('showDirectoryPicker' in window)) {
    throw new Error('The File System Access API is not available in this browser. Use the folder buttons inside each module.');
  }

  const handle = await window.showDirectoryPicker({ mode:'read', id:'star-run-folder', startIn:'desktop' });
  try {
    await handle.getDirectoryHandle('modules_output');
  } catch (error) {
    throw new Error('The selected directory is not a valid STAR RUN folder because it does not contain modules_output. Select RUN_XXXXX, not STAR and not Output.');
  }
  starRootHandle = handle;
  currentRunHandle = handle;
  currentRunName = handle.name;
  updateRootStatus();
  return starRootHandle;
}

function updateRootStatus() {
  const dot = $('root-status-dot');
  const text = $('root-status-text');
  if (starRootHandle) {
    dot.classList.add('loaded');
    text.textContent = `RUN folder selected: ${currentRunName || starRootHandle.name}`;
  } else {
    dot.classList.remove('loaded');
    text.textContent = 'RUN output folder not selected. Select a RUN_XXXXX folder to load modules_output.';
  }
}

async function pickFallbackDirectoryFromStar() {
  const options = { mode:'read', id:'star-child-folder' };
  if (starRootHandle) options.startIn = starRootHandle;
  const handle = await window.showDirectoryPicker(options);
  const files = await collectFilesFromDirectoryHandle(handle, `${handle.name}/`);
  return { files, label: handle.name };
}

window.STAR_PICK_DIRECTORY = async function(moduleName, kind) {
  try {
    const root = await ensureStarRootFolder();
    const targetPath = STAR_KIND_PATHS[moduleName]?.[kind];

    if (targetPath) {
      try {
        const targetHandle = await resolveDirectoryHandle(root, targetPath);
        const printablePath = targetPath.map(part => part === '$RUN' ? currentRunName : part).join('/');
        const files = await collectFilesFromDirectoryHandle(targetHandle, `${root.name}/${printablePath}/`);
        return { files, label: `${root.name}/${printablePath}` };
      } catch (error) {
        console.warn('The expected RUN subdirectory was not found. Opening a manual folder picker from the selected RUN folder:', error);
      }
    }

    return await pickFallbackDirectoryFromStar();
  } catch (error) {
    if (error && error.name === 'AbortError') return null;
    console.warn('RUN directory selection failed:', error);
    return null;
  }
};

async function readTextFileFromPath(rootHandle, pathParts) {
  const dirParts = pathParts.slice(0, -1);
  const fileName = pathParts[pathParts.length - 1];
  const dirHandle = await resolveDirectoryHandle(rootHandle, dirParts);
  const fileHandle = await dirHandle.getFileHandle(fileName);
  const file = await fileHandle.getFile();
  return await file.text();
}

function parseAttitudeDataJs(text) {
  const match = String(text || '').trim().match(/(?:window\.)?attitudePropagationData\s*=\s*([\s\S]*?)\s*;?\s*$/);
  if (!match) throw new Error('attitudePropagationData not found in attitude_propagation_plots_data.js');
  return JSON.parse(match[1]);
}

function deliverAttitudeDataToFrame(sourceLabel = null) {
  const frame = $('frame-attitude');
  if (!frame || !window.attitudePropagationData) return false;
  try {
    if (frame.contentWindow && typeof frame.contentWindow.receiveAttitudeDataFromParent === 'function') {
      frame.contentWindow.receiveAttitudeDataFromParent(
        window.attitudePropagationData,
        sourceLabel || `${currentRunName || 'RUN_XXXXX'}/modules_output/END-003/results_attitude_propagator`
      );
      return true;
    }
  } catch (error) {
    console.warn('Unable to deliver attitude data to child frame:', error);
  }
  return false;
}

async function loadAttitudeDataFromStarRoot() {
  if (!starRootHandle) return false;
  const frame = $('frame-attitude');
  try {
    const resultsHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-003','results_attitude_propagator']);
    const resultsLabel = `${starRootHandle.name}/modules_output/END-003/results_attitude_propagator`;
    const resultFiles = await collectFilesFromDirectoryHandle(resultsHandle, `${resultsLabel}/`);

    let inputFiles = [];
    let inputLabel = `${starRootHandle.name}/modules_output/END-003`;
    try {
      const inputHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-003']);
      inputFiles = await collectFilesFromDirectoryHandle(inputHandle, `${inputLabel}/`);
    } catch (inputError) {
      console.warn('Unable to load END-003 runtime input files from the selected RUN folder:', inputError);
    }

    const jsFile = resultFiles.find(file => String(file.name).toLowerCase() === 'attitude_propagation_plots_data.js');
    if (jsFile) {
      const text = await jsFile.text();
      window.attitudePropagationData = parseAttitudeDataJs(text);
    }

    if (frame && frame.contentWindow && typeof frame.contentWindow.receiveAttitudeFilesFromParent === 'function') {
      await frame.contentWindow.receiveAttitudeFilesFromParent(
        { resultFiles, inputFiles },
        { results: resultsLabel, input: inputLabel }
      );
      return true;
    }

    if (window.attitudePropagationData) {
      return deliverAttitudeDataToFrame(resultsLabel);
    }
    return false;
  } catch (error) {
    console.warn('Unable to load END-003 attitude data from the selected RUN folder:', error);
    return false;
  }
}

function deliverSyntheticFilesToFrame(files, sourceLabel = null) {
  const frame = $('frame-synthetic');
  if (!frame || !files) return false;
  try {
    if (frame.contentWindow && typeof frame.contentWindow.receiveSyntheticFilesFromParent === 'function') {
      frame.contentWindow.receiveSyntheticFilesFromParent(
        files,
        sourceLabel || `${currentRunName || 'RUN_XXXXX'}/modules_output/END-007/results_synthetic_data_generation`
      );
      return true;
    }
  } catch (error) {
    console.warn('Unable to deliver synthetic data files to child frame:', error);
  }
  return false;
}

async function loadSyntheticImagesFromStarRoot() {
  if (!starRootHandle) return false;
  try {
    const targetHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-007','results_synthetic_data_generation']);
    const label = `${starRootHandle.name}/modules_output/END-007/results_synthetic_data_generation`;
    const files = await collectFilesFromDirectoryHandle(targetHandle, `${label}/`);
    deliverSyntheticFilesToFrame(files, label);
    return true;
  } catch (error) {
    console.warn('Unable to load synthetic data generation image files from current RUN folder:', error);
    return false;
  }
}

async function loadConstellationFromStarRoot() {
  if (!starRootHandle) return false;
  const frame = $('frame-constellation');
  if (!frame || !frame.contentWindow || typeof frame.contentWindow.receiveConstellationFilesFromParent !== 'function') return false;
  try {
    const plotHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-001','results_constellation_optimizer']);
    const inputHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-001']);
    const satelliteHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-001','output_constellation_optimizer']);
    const plotLabel = `${starRootHandle.name}/modules_output/END-001/results_constellation_optimizer`;
    const inputLabel = `${starRootHandle.name}/modules_output/END-001`;
    const satelliteLabel = `${starRootHandle.name}/modules_output/END-001/output_constellation_optimizer`;
    const payload = {
      plotFiles: await collectFilesFromDirectoryHandle(plotHandle, `${plotLabel}/`),
      inputFiles: await collectFilesFromDirectoryHandle(inputHandle, `${inputLabel}/`),
      satelliteFiles: await collectFilesFromDirectoryHandle(satelliteHandle, `${satelliteLabel}/`)
    };
    await frame.contentWindow.receiveConstellationFilesFromParent(payload, { plot: plotLabel, input: inputLabel, satellites: satelliteLabel });
    return true;
  } catch (error) {
    console.warn('Unable to load END-001 constellation data from the selected RUN folder:', error);
    return false;
  }
}


async function loadPowerBudgetFromStarRoot() {
  if (!starRootHandle) return false;
  const frame = $('frame-power');
  if (!frame || !frame.contentWindow || typeof frame.contentWindow.receivePowerBudgetFilesFromParent !== 'function') return false;
  try {
    const productHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-004','output_power_budget']);
    const resultsHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-004','results_power_budget']);
    const productLabel = `${starRootHandle.name}/modules_output/END-004/output_power_budget`;
    const resultsLabel = `${starRootHandle.name}/modules_output/END-004/results_power_budget`;
    const payload = {
      productFiles: await collectFilesFromDirectoryHandle(productHandle, `${productLabel}/`),
      resultFiles: await collectFilesFromDirectoryHandle(resultsHandle, `${resultsLabel}/`)
    };
    await frame.contentWindow.receivePowerBudgetFilesFromParent(payload, { product: productLabel, results: resultsLabel });
    return true;
  } catch (error) {
    console.warn('Unable to load END-004 power-budget data from the selected RUN folder:', error);
    return false;
  }
}

async function loadReflectanceFromStarRoot() {
  if (!starRootHandle) return false;
  const frame = $('frame-reflectance');
  if (!frame || !frame.contentWindow || typeof frame.contentWindow.receiveReflectanceFilesFromParent !== 'function') return false;
  try {
    const csvHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-010','output_reflectance_determination']);
    const framesHandle = await resolveDirectoryHandle(starRootHandle, ['modules_output','END-010','results_reflectance_determination','Frames']);
    const csvLabel = `${starRootHandle.name}/modules_output/END-010/output_reflectance_determination`;
    const framesLabel = `${starRootHandle.name}/modules_output/END-010/results_reflectance_determination/Frames`;
    const payload = {
      csvFiles: await collectFilesFromDirectoryHandle(csvHandle, `${csvLabel}/`),
      frameFiles: await collectFilesFromDirectoryHandle(framesHandle, `${framesLabel}/`)
    };
    await frame.contentWindow.receiveReflectanceFilesFromParent(payload, { csv: csvLabel, frames: framesLabel });
    return true;
  } catch (error) {
    console.warn('Unable to load END-010 reflectance data from the selected RUN folder:', error);
    return false;
  }
}


async function getDirectoryHandleIfExists(rootHandle, pathParts) {
  try {
    return await resolveDirectoryHandle(rootHandle, pathParts);
  } catch (_) {
    return null;
  }
}

async function getFilesIfDirectoryExists(rootHandle, pathParts) {
  const dir = await getDirectoryHandleIfExists(rootHandle, pathParts);
  if (!dir) return [];
  return await collectFilesFromDirectoryHandle(dir, `${rootHandle.name}/${pathParts.join('/')}/`);
}

function countMatchingFiles(files, matcher) {
  const matched = Array.from(files || []).filter(file => matcher(file.name, file));
  return {
    count: matched.length,
    examples: matched.slice(0, 5).map(file => file.name)
  };
}

async function readJsonFileFromPathIfExists(rootHandle, pathParts) {
  try {
    const text = await readTextFileFromPath(rootHandle, pathParts);
    return JSON.parse(text);
  } catch (_) {
    return null;
  }
}

function moduleDisplayName(moduleId) {
  const names = {
    'END-001': 'Constellation Optimizer',
    'END-003': 'Attitude Propagation',
    'END-004': 'Power Budget',
    'END-006': 'Scenario Generation',
    'END-007': 'Synthetic Data Generation',
    'END-010': 'Reflectance Determination'
  };
  return names[moduleId] || moduleId;
}

async function buildRunDiagnostics() {
  if (!starRootHandle) {
    return { selected: false, runName: null, checks: [], modules: [], issues: [{ level: 'warning', title: 'No RUN folder selected', message: 'Select a RUN_XXXXX folder to inspect module outputs.' }] };
  }

  const checksConfig = [
    { module:'END-001', artifact:'Constellation plot data', path:['modules_output','END-001','results_constellation_optimizer'], matcher:name=>/^constellation_plots_data\.js$/i.test(name) },
    { module:'END-001', artifact:'Satellite detail JSON files', path:['modules_output','END-001','output_constellation_optimizer'], matcher:name=>/^satellite_\d+\.json$/i.test(name) },
    { module:'END-001', artifact:'Constellation figures', path:['modules_output','END-001','results_constellation_optimizer'], matcher:name=>/\.(png|jpg|jpeg|html)$/i.test(name) },
    { module:'END-003', artifact:'Attitude dashboard data', path:['modules_output','END-003','results_attitude_propagator'], matcher:name=>/^attitude_propagation_plots_data\.(js|json)$/i.test(name) },
    { module:'END-003', artifact:'Attitude CSV outputs', path:['modules_output','END-003','output_attitude_propagation'], matcher:name=>/\.csv$/i.test(name) },
    { module:'END-003', artifact:'Attitude figures', path:['modules_output','END-003','results_attitude_propagator'], matcher:name=>/\.(png|jpg|jpeg)$/i.test(name) },
    { module:'END-004', artifact:'Power-budget product tables', path:['modules_output','END-004','output_power_budget'], matcher:name=>/^power_budget_(sheet1|foglio1|summary|subsystems)\.(csv|json)$/i.test(name) },
    { module:'END-004', artifact:'Power-budget frontend data', path:['modules_output','END-004','results_power_budget'], matcher:name=>/^power_budget_tables\.js$/i.test(name) },
    { module:'END-004', artifact:'Power-budget figures', path:['modules_output','END-004','results_power_budget'], matcher:name=>/\.(png|jpg|jpeg)$/i.test(name) },
    { module:'END-007', artifact:'Synthetic frames', path:['modules_output','END-007','results_synthetic_data_generation'], matcher:name=>/\.(png|jpg|jpeg|webp)$/i.test(name) },
    { module:'END-010', artifact:'Reflectance flux CSV', path:['modules_output','END-010','output_reflectance_determination'], matcher:name=>/^flux\.csv$/i.test(name) },
    { module:'END-010', artifact:'Reflectance frames', path:['modules_output','END-010','results_reflectance_determination','Frames'], matcher:name=>/\.(png|jpg|jpeg|webp)$/i.test(name) },
    { module:'END-010', artifact:'Reflectance plots', path:['modules_output','END-010','results_reflectance_determination'], matcher:name=>/\.(png|jpg|jpeg|html)$/i.test(name) }
  ];

  const checks = [];
  for (const cfg of checksConfig) {
    const files = await getFilesIfDirectoryExists(starRootHandle, cfg.path);
    const matched = countMatchingFiles(files, cfg.matcher);
    const exists = files.length > 0;
    checks.push({
      module: cfg.module,
      artifact: cfg.artifact,
      path: `${starRootHandle.name}/${cfg.path.join('/')}`,
      count: matched.count,
      examples: matched.examples,
      status: matched.count > 0 ? 'ok' : exists ? 'warning' : 'error'
    });
  }

  const modules = [];
  const execution = await readJsonFileFromPathIfExists(starRootHandle, ['intermediate','execution_results.json']);
  const stepList = Array.isArray(execution?.execution_results)
    ? execution.execution_results
    : Array.isArray(execution?.steps)
      ? execution.steps
      : Array.isArray(execution?.workflow_steps)
        ? execution.workflow_steps
        : Array.isArray(execution?.modules)
          ? execution.modules
          : [];
  for (const step of stepList) {
    const moduleId = step.module_id || step.end_id || step.id || step.module || 'UNKNOWN';
    const status = step.status || step.execution_status || step.result_status || 'unknown';
    const artifacts = step.generated_artifacts;
    const generated = Array.isArray(artifacts)
      ? artifacts.length
      : typeof artifacts === 'string'
        ? artifacts.split(';').map(item => item.trim()).filter(Boolean).length
        : step.generated_artifacts_count ?? step.generatedArtifacts ?? '—';
    modules.push({ module: `${moduleId} · ${moduleDisplayName(moduleId)}`, status, generatedArtifacts: generated, notes: step.error || step.message || step.output_dir || step.module_input_file || '' });
  }

  for (const moduleId of ['END-001','END-003','END-004','END-007','END-010']) {
    const processJsonName = moduleId.toLowerCase().replace('-', '') + '_process_result.json';
    const process = await readJsonFileFromPathIfExists(starRootHandle, ['modules_output', moduleId, processJsonName]);
    if (process) {
      modules.push({ module: `${moduleId} · process result`, status: process.status || process.returncode || 'recorded', generatedArtifacts: Array.isArray(process.generated_artifacts) ? process.generated_artifacts.length : '—', notes: process.output_dir || process.message || '' });
    }
  }

  const issues = [];
  for (const check of checks) {
    if (check.status === 'error') {
      issues.push({ level:'error', title:`Missing ${check.module} artifact group`, message:`No expected files were found in ${check.path}.` });
    } else if (check.status === 'warning') {
      issues.push({ level:'warning', title:`Partial ${check.module} artifact group`, message:`The directory exists, but the expected artifact type was not detected in ${check.path}.` });
    }
  }

  const end010Process = await readJsonFileFromPathIfExists(starRootHandle, ['modules_output','END-010','end010_process_result.json']);
  const processText = JSON.stringify(end010Process || {});
  if (end010Process && currentRunName && !processText.includes(currentRunName)) {
    issues.push({ level:'warning', title:'END-010 run identifier mismatch', message:'The END-010 process metadata does not reference the currently selected RUN folder. Verify that the reflectance outputs were generated by this run and were not copied from an earlier execution.' });
  }

  if (!issues.length) {
    issues.push({ level:'ok', title:'No critical output issue detected', message:'The expected artifact groups are available in the selected RUN folder.' });
  }

  return { selected:true, runName: currentRunName || starRootHandle.name, checks, modules, issues };
}

async function updateRunDiagnostics() {
  const frame = $('frame-diagnostics');
  if (!frame) return false;
  try {
    const diagnostics = await buildRunDiagnostics();
    if (frame.contentWindow && typeof frame.contentWindow.receiveDiagnosticsFromParent === 'function') {
      frame.contentWindow.receiveDiagnosticsFromParent(diagnostics);
      return true;
    }
  } catch (error) {
    console.warn('Unable to update run diagnostics:', error);
  }
  return false;
}
window.updateRunDiagnostics = updateRunDiagnostics;

function scheduleAttitudeDataDelivery() {
  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (window.attitudePropagationData && deliverAttitudeDataToFrame()) clearInterval(timer);
    if (tries > 30) clearInterval(timer);
  }, 200);
}

function switchTab(tabName) {
  for (const button of document.querySelectorAll('.tab-button')) {
    button.classList.toggle('active', button.dataset.tab === tabName);
  }

  const frameByTab = {
    constellation: $('frame-constellation'),
    attitude: $('frame-attitude'),
    power: $('frame-power'),
    synthetic: $('frame-synthetic'),
    reflectance: $('frame-reflectance'),
    diagnostics: $('frame-diagnostics')
  };

  Object.entries(frameByTab).forEach(([name, frame]) => {
    frame.classList.toggle('active', name === tabName);
  });

  setTimeout(() => {
    const activeFrame = frameByTab[tabName] || $('frame-constellation');
    (async () => {
      try {
        if (tabName === 'constellation' && starRootHandle) {
          await loadConstellationFromStarRoot();
        }
        if (tabName === 'attitude') {
          if (!window.attitudePropagationData && starRootHandle) await loadAttitudeDataFromStarRoot();
          if (window.attitudePropagationData) deliverAttitudeDataToFrame();
        }
        if (tabName === 'power' && starRootHandle) {
          await loadPowerBudgetFromStarRoot();
        }
        if (tabName === 'synthetic' && starRootHandle) {
          await loadSyntheticImagesFromStarRoot();
        }
        if (tabName === 'reflectance' && starRootHandle) {
          await loadReflectanceFromStarRoot();
        }
        if (tabName === 'diagnostics') {
          await updateRunDiagnostics();
        }
        activeFrame.contentWindow.dispatchEvent(new Event('resize'));
        if (typeof activeFrame.contentWindow.refreshConstellationDashboard === 'function') activeFrame.contentWindow.refreshConstellationDashboard();
        if (typeof activeFrame.contentWindow.refreshAttitudeDashboard === 'function') activeFrame.contentWindow.refreshAttitudeDashboard();
        if (typeof activeFrame.contentWindow.refreshPowerBudgetDashboard === 'function') activeFrame.contentWindow.refreshPowerBudgetDashboard();
        if (typeof activeFrame.contentWindow.refreshSyntheticDashboard === 'function') activeFrame.contentWindow.refreshSyntheticDashboard();
        if (typeof activeFrame.contentWindow.refreshReflectanceDashboard === 'function') activeFrame.contentWindow.refreshReflectanceDashboard();
        if (typeof activeFrame.contentWindow.refreshDiagnosticsDashboard === 'function') activeFrame.contentWindow.refreshDiagnosticsDashboard();
        if (activeFrame.contentWindow.Plotly) {
          const ids = ['plotWeights','plotGround','plot3D','plot3DECEF','plotAngularVelocity','plotEulerAngles','plotTorquesLinear','plotTorquesLog','plotEnergy','plotAltitude','plotElevation','plotNadirOffset','plotTargetOffset','plotHMag','plotHDir','plotGroundTrack','plotOrbitECI','plotOrbitECEF'];
          ids.forEach(id => { const el = activeFrame.contentDocument.getElementById(id); if (el && el.data) activeFrame.contentWindow.Plotly.Plots.resize(el); });
        }
      } catch (error) { console.warn('Unable to refresh active child frame:', error); }
    })();
  }, 160);
}

function bindEvents() {
  $('theme-switch').addEventListener('change', event => setTheme(event.target.checked ? 'light' : 'dark'));
  $('star-root-button').addEventListener('click', async () => {
    try {
      await ensureStarRootFolder();
      await loadConstellationFromStarRoot();
      await loadAttitudeDataFromStarRoot();
      await loadPowerBudgetFromStarRoot();
      await loadSyntheticImagesFromStarRoot();
      await loadReflectanceFromStarRoot();
      await updateRunDiagnostics();
      deliverAttitudeDataToFrame();
    } catch (error) {
      console.warn(error);
      updateRootStatus();
    }
  });

  for (const button of document.querySelectorAll('.tab-button')) {
    button.addEventListener('click', () => switchTab(button.dataset.tab));
  }

  for (const frame of [$('frame-constellation'), $('frame-attitude'), $('frame-power'), $('frame-synthetic'), $('frame-reflectance'), $('frame-diagnostics')]) {
    frame.addEventListener('load', () => {
      propagateTheme(document.documentElement.dataset.theme || 'dark');
      if (frame.id === 'frame-attitude') {
        if (window.attitudePropagationData) deliverAttitudeDataToFrame();
        else if (starRootHandle) loadAttitudeDataFromStarRoot();
      }
      if (frame.id === 'frame-constellation' && starRootHandle) {
        loadConstellationFromStarRoot();
      }
      if (frame.id === 'frame-power' && starRootHandle) {
        loadPowerBudgetFromStarRoot();
      }
      if (frame.id === 'frame-synthetic' && starRootHandle) {
        loadSyntheticImagesFromStarRoot();
      }
      if (frame.id === 'frame-reflectance' && starRootHandle) {
        loadReflectanceFromStarRoot();
      }
      if (frame.id === 'frame-diagnostics') {
        updateRunDiagnostics();
      }
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setupTheme();
  bindEvents();
  updateRootStatus();
  scheduleAttitudeDataDelivery();
});
window.addEventListener('star-attitude-data-ready', () => {
  deliverAttitudeDataToFrame();
});
</script>
