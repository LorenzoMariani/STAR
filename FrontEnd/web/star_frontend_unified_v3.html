<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space mission Twin for Architecture Representation (STAR) FrontEnd</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

:root{
  --bg:#090a0d;
  --panel:#11141c;
  --panel-strong:#151925;
  --panel-muted:#0d1017;
  --border:#232838;
  --border-soft:rgba(114,125,151,.22);
  --text:#d7dde9;
  --text-strong:#ffffff;
  --muted:#7d879a;
  --muted-2:#9aa3b4;
  --accent:#e8ff47;
  --accent-2:#4dffc3;
  --danger:#ff5c7a;
  --success:#61f6a8;
  --shadow:0 24px 80px rgba(0,0,0,.32);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8;
  --panel:#ffffff;
  --panel-strong:#f8fafc;
  --panel-muted:#eef2f7;
  --border:#d9e0eb;
  --border-soft:rgba(45,55,72,.13);
  --text:#222b3b;
  --text-strong:#070b12;
  --muted:#667085;
  --muted-2:#475467;
  --accent:#667c00;
  --accent-2:#007a66;
  --danger:#bd2450;
  --success:#047857;
  --shadow:0 18px 60px rgba(31,41,55,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at top left,rgba(77,255,195,.10),transparent 32rem),
    radial-gradient(circle at top right,rgba(232,255,71,.08),transparent 36rem),
    var(--bg);
  color:var(--text);
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:13px;
  line-height:1.5;
  overflow:hidden;
}
button{font:inherit;border:1px solid var(--border);background:var(--panel-strong);color:var(--text);border-radius:12px;padding:8px 13px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
button:hover{transform:translateY(-1px);border-color:var(--accent-2)}
button.active{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07100d;font-weight:800}
.app-shell{height:100%;display:flex;flex-direction:column;width:min(1920px,100%);margin:0 auto;padding:18px;gap:18px}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:16px 20px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);
  flex:0 0 auto;
}
.header h1{
  margin:0;
  font-family:'Syne',Inter,system-ui,sans-serif;
  font-size:clamp(20px,1.85vw,28px);
  line-height:1.05;
  color:var(--text-strong);
  letter-spacing:-.03em;
}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.theme-toggle{display:inline-flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--border);border-radius:999px;background:var(--panel-muted);color:var(--muted-2);user-select:none}
.switch{position:relative;width:48px;height:26px;display:inline-flex;align-items:center}
.switch input{opacity:0;width:0;height:0}
.slider-switch{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.22s ease;box-shadow:inset 0 0 0 1px var(--border-soft)}
.slider-switch:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--text-strong);transition:.22s ease}
.switch input:checked+.slider-switch{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch input:checked+.slider-switch:before{transform:translateX(22px);background:#07100d}
.workspace{
  min-height:0;
  flex:1 1 auto;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 95%,transparent);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.workspace-tabs{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px;border-bottom:1px solid var(--border);background:var(--panel-strong);flex:0 0 auto;flex-wrap:wrap}
.tab-buttons{display:flex;gap:8px;flex-wrap:wrap}
.workspace-tab{
  display:inline-flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  min-width:auto;
  min-height:38px;
  padding:8px 16px;
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  text-transform:none;
  letter-spacing:.01em;
  font-size:12px;
  line-height:1;
  white-space:nowrap;
  color:var(--muted-2);
  background:var(--panel-muted);
}
.workspace-tab .tab-title{font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.status-strip{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;flex-wrap:wrap}
.status-dot{width:10px;height:10px;border-radius:999px;background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 18%,transparent)}
.frame-stage{min-height:0;flex:1 1 auto;background:var(--bg);position:relative}
.workspace-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}
.workspace-frame.active{display:block}
.placeholder{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--muted)}
.placeholder.visible{display:flex}
.placeholder-card{max-width:720px;border:1px dashed var(--border);border-radius:18px;background:var(--panel-muted);padding:22px;box-shadow:var(--shadow)}
.placeholder-card h2{margin:0 0 10px;color:var(--text-strong);font-family:'Syne',Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
code{color:var(--accent-2)}
@media(max-width:980px){
  body{overflow:auto}.app-shell{min-height:100%;height:auto;padding:10px}.header{align-items:flex-start;flex-direction:column}.header-actions{justify-content:flex-start;width:100%}.workspace{height:78vh;min-height:720px}.workspace-tab{font-size:11px;padding:8px 12px}
}

/* STAR v2 compact shell patch */
.app-shell{padding:12px!important;gap:12px!important;}
.header{padding:12px 16px!important;border-radius:18px!important;}
.workspace{border-radius:18px!important;}
.workspace-tabs{padding:7px 8px!important;gap:8px!important;}
.workspace-tab{min-height:32px!important;padding:6px 12px!important;border-radius:10px!important;}
.workspace-tab .tab-title{font-size:11px!important;}
.frame-stage{min-height:0!important;}


.run-mode-switch{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--border);border-radius:999px;background:var(--panel-muted)}
.run-mode-btn{padding:5px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted-2);font-size:12px;line-height:1.2}
.run-mode-btn.active{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07100d;font-weight:800}
.run-mode-switch.locked{opacity:.55}
.run-mode-switch.locked .run-mode-btn,.run-mode-switch.locked .run-level-range{cursor:not-allowed;transform:none}
.run-level{display:none;align-items:center;gap:9px;padding:0 10px 0 8px;font-size:12px;color:var(--muted-2);white-space:nowrap}
.run-mode-switch.full .run-level{display:inline-flex}
.run-level-name{min-width:64px;text-align:right;color:var(--text-strong);font-weight:700}
.run-level-eta{min-width:58px;font-variant-numeric:tabular-nums}
.run-level-track{position:relative;display:inline-flex;align-items:center;width:112px;height:20px}
.run-level-ticks{position:absolute;left:6px;right:6px;top:50%;height:6px;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none;z-index:1}
.run-level-ticks i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.run-level-ticks i.on{background:#07100d}
.run-level-range{-webkit-appearance:none;appearance:none;position:relative;width:100%;height:6px;margin:0;border-radius:999px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--accent),var(--accent-2)) 0 0/var(--pct,50%) 100% no-repeat,var(--border)}
.run-level-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;position:relative;z-index:2;width:16px;height:16px;border-radius:50%;background:var(--text-strong);border:3px solid var(--accent-2);box-shadow:0 0 0 3px var(--panel-muted)}
.run-level-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent)}
@media(min-width:1200px){.header-actions{flex:0 0 auto;flex-wrap:nowrap}}
</style>
</head>
<body>
<div class="app-shell">
  <header class="header">
    <div>
      <h1>Space mission Twin for Architecture Representation (STAR) FrontEnd</h1>
    </div>
    <div class="header-actions">
      <div class="run-mode-switch" role="group" aria-label="STAR run mode" title="Run mode of the next workflow execution">
        <button type="button" class="run-mode-btn active" data-mode="test">Test</button>
        <button type="button" class="run-mode-btn" data-mode="full">Full</button>
        <div class="run-level" title="Accuracy of the Full run">
          <span class="run-level-name">High</span>
          <span class="run-level-track"><span class="run-level-ticks"><i></i><i></i><i></i><i></i><i></i></span>
            <input type="range" class="run-level-range" min="1" max="5" step="1" value="3" aria-label="Accuracy level of the Full run" /></span>
          <span class="run-level-eta">&asymp; 5 min</span>
        </div>
      </div>
      <label class="theme-toggle" title="Switch interface theme">
        <span id="theme-label">Dark</span>
        <span class="switch">
          <input id="theme-switch" type="checkbox" aria-label="Toggle light theme" />
          <span class="slider-switch"></span>
        </span>
      </label>
    </div>
  </header>

  <section class="workspace">
    <div class="workspace-tabs">
      <div class="tab-buttons" role="tablist" aria-label="STAR workspaces">
        <button id="tab-execution" class="workspace-tab active" data-workspace="execution" type="button"><span class="tab-title">Workflow Execution</span></button>
        <button id="tab-results" class="workspace-tab" data-workspace="results" type="button"><span class="tab-title">Outputs Results Visualisation</span></button>
      </div>
      <div class="status-strip"><span class="status-dot"></span><span id="workspace-status">Execution workspace active.</span></div>
    </div>
    <div class="frame-stage">
      <iframe id="execution-frame" class="workspace-frame active" allow="file-system-access" src="star_execution_frontend_v3.html?v=2" title="STAR Execution Workspace"></iframe>
      <iframe id="results-frame" class="workspace-frame" allow="file-system-access" src="star_results_frontend_v3.html?v=2" title="STAR Results Workspace"></iframe>
      <div id="execution-placeholder" class="placeholder"><div class="placeholder-card"><h2>Execution interface unavailable</h2><p>The file <code>web/index.html</code> was not found. Keep the original <code>web</code> folder next to this Python entry point.</p></div></div>
    </div>
  </section>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const state = { active: 'execution' };
  const executionFrame = $('execution-frame');
  const resultsFrame = $('results-frame');
  const statusText = $('workspace-status');

  function setTheme(theme) {
    const value = theme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = value;
    localStorage.setItem('star-integrated-theme', value);
    $('theme-switch').checked = value === 'light';
    $('theme-label').textContent = value === 'light' ? 'Light' : 'Dark';
    try { localStorage.setItem('star-ui-theme', value); } catch (_) {}
    try { localStorage.setItem('star-unified-theme', value); } catch (_) {}
    for (const frame of [executionFrame, resultsFrame]) {
      try {
        const doc = frame.contentDocument;
        const win = frame.contentWindow;
        if (doc && doc.documentElement) {
          doc.documentElement.dataset.theme = value;
          if (doc.body) doc.body.dataset.theme = value;
        }
        if (win && typeof win.setTheme === 'function') { win.setTheme(value, false); }
        else if (win && typeof win.applyTheme === 'function') { win.applyTheme(value); }
      } catch (_) {}
    }
  }

  function initialiseTheme() {
    setTheme(localStorage.getItem('star-integrated-theme') || 'dark');
    $('theme-switch').addEventListener('change', event => setTheme(event.target.checked ? 'light' : 'dark'));
  }

  function injectPywebviewApi() {
    try {
      if (executionFrame.contentWindow && window.pywebview) {
        executionFrame.contentWindow.pywebview = window.pywebview;
        executionFrame.contentWindow.dispatchEvent(new Event('pywebviewready'));
      }
    } catch (error) {
      console.warn('Unable to expose the pywebview API to the execution workspace:', error);
    }
  }

  function activateWorkspace(name) {
    state.active = name;
    document.querySelectorAll('.workspace-tab').forEach(button => {
      button.classList.toggle('active', button.dataset.workspace === name);
    });
    executionFrame.classList.toggle('active', name === 'execution');
    resultsFrame.classList.toggle('active', name === 'results');
    statusText.textContent = name === 'execution'
      ? 'Execution workspace active.'
      : 'Results workspace active. Select the required RUN_XXXXX folder inside the Results workspace.';

    if (name === 'execution') {
      setTimeout(injectPywebviewApi, 50);
    } else {
      try {
        const w = resultsFrame.contentWindow;
        if (w && typeof w.refreshAllDashboards === 'function') w.refreshAllDashboards();
      } catch (_) {}
    }
  }

  function bindTabs() {
    document.querySelectorAll('.workspace-tab').forEach(button => {
      button.addEventListener('click', () => activateWorkspace(button.dataset.workspace));
    });
  }

  function checkExecutionFile() {
    fetch('star_execution_frontend_v3.html', { cache: 'no-store' }).catch(() => {
      $('execution-placeholder').classList.add('visible');
    });
  }

  window.addEventListener('pywebviewready', () => {
    injectPywebviewApi();
    setTimeout(injectPywebviewApi, 200);
  });
  executionFrame.addEventListener('load', () => {
    injectPywebviewApi();
    setTimeout(injectPywebviewApi, 100);
    setTimeout(injectPywebviewApi, 500);
    setTheme(localStorage.getItem('star-integrated-theme') || 'dark');
  });
  resultsFrame.addEventListener('load', () => setTheme(localStorage.getItem('star-integrated-theme') || 'dark'));

  document.addEventListener('DOMContentLoaded', () => {
    initialiseTheme();
    bindTabs();
    checkExecutionFile();
    activateWorkspace('execution');
  });
})();
</script>
<script id="star-v3-run-mode-buttons">
(() => {
  'use strict';
  const group = document.querySelector('.run-mode-switch');
  if (!group) return;
  const range = group.querySelector('.run-level-range');
  const nameEl = group.querySelector('.run-level-name');
  const etaEl = group.querySelector('.run-level-eta');
  const ticks = Array.from(group.querySelectorAll('.run-level-ticks i'));
  const api = () => window.pywebview && window.pywebview.api;
  let state = null, dragging = false;
  const fmt = s => s < 90 ? Math.round(s) + ' s' : (s < 5400 ? Math.round(s / 60) + ' min' : (s / 3600).toFixed(1) + ' h');
  function breakdown(est) {
    return Object.entries(est.per_module).map(([m, s]) => m + ' ' + fmt(s)).join(', ');
  }
  function paintLevel(level) {
    const pct = (level - 1) / 4 * 100;
    range.style.setProperty('--pct', pct + '%');
    ticks.forEach((t, i) => t.classList.toggle('on', i + 1 <= level));
    if (!state) return;
    const lv = state.levels[String(level)], est = state.estimates.full[String(level)];
    nameEl.textContent = lv.name;
    etaEl.textContent = '\u2248 ' + fmt(est.total_s);
    range.title = lv.name + ': ' + lv.description;
    group.querySelector('.run-level').title = 'Accuracy of the Full run: ' + lv.name + ' (' + lv.description + ').\n'
      + 'Estimated time \u2248 ' + fmt(est.total_s) + ' (' + state.estimate_scope + '): ' + breakdown(est)
      + '.\nMeasured on the STAR workstation; the scenario changes it.';
  }
  function show(r) {
    state = r;
    const running = !!r.execution_running;
    group.querySelectorAll('.run-mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === r.run_mode);
      b.disabled = running;
      const est = b.dataset.mode === 'full' ? r.estimates.full[String(r.run_level)] : r.estimates.test;
      b.title = (r.modes[b.dataset.mode] || '') + ' (\u2248 ' + fmt(est.total_s) + ')' + (running ? ' (locked while a workflow runs)' : '');
    });
    group.classList.toggle('full', r.run_mode === 'full');
    group.classList.toggle('locked', running);
    range.disabled = running;
    if (!dragging) { range.value = r.run_level; paintLevel(r.run_level); }
  }
  async function sync() {
    const a = api(); if (!a || !a.get_run_mode) return;
    try { const r = await a.get_run_mode(); if (r && r.ok) show(r); } catch (_) {}
  }
  async function choose(mode, level) {
    const a = api(); if (!a || !a.set_run_mode) return;
    const r = await a.set_run_mode(mode, level);
    if (r && r.ok) show(r); else if (r && r.error) { alert(r.error); sync(); }
  }
  group.addEventListener('click', event => {
    const b = event.target.closest('.run-mode-btn');
    if (!b || b.disabled) return;
    choose(b.dataset.mode, null);
  });
  range.addEventListener('input', () => { dragging = true; paintLevel(Number(range.value)); });
  range.addEventListener('change', () => { dragging = false; choose('full', Number(range.value)); });
  window.addEventListener('pywebviewready', sync);
  setInterval(sync, 2000);     // in step with the backend (plan changes the estimate); locked while a workflow runs
  paintLevel(Number(range.value));
})();
</script>
</body>
</html>
