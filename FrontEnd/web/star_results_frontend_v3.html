:root{
  --bg:#090a0d;
  --panel:#11141c;
  --panel-strong:#151925;
  --panel-muted:#0d1017;
  --border:#232838;
  --border-soft:rgba(114,125,151,.22);
  --text:#d7dde9;
  --text-strong:#ffffff;
  --muted:#7d879a;
  --muted-2:#9aa3b4;
  --accent:#e8ff47;
  --accent-2:#4dffc3;
  --danger:#ff5c7a;
  --success:#61f6a8;
  --plot-bg:#090a0d;
  --shadow:0 24px 80px rgba(0,0,0,.32);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8;
  --panel:#ffffff;
  --panel-strong:#f8fafc;
  --panel-muted:#eef2f7;
  --border:#d9e0eb;
  --border-soft:rgba(45,55,72,.13);
  --text:#222b3b;
  --text-strong:#070b12;
  --muted:#667085;
  --muted-2:#475467;
  --accent:#667c00;
  --accent-2:#007a66;
  --danger:#bd2450;
  --success:#047857;
  --plot-bg:#ffffff;
  --shadow:0 18px 60px rgba(31,41,55,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at top left,rgba(77,255,195,.10),transparent 32rem),
    radial-gradient(circle at top right,rgba(232,255,71,.08),transparent 36rem),
    var(--bg);
  color:var(--text);
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:13px;
  line-height:1.5;
}
button{font:inherit;border:1px solid var(--border);background:var(--panel-strong);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
button:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.primary-action{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07100d;font-weight:700}
.app-shell{width:min(1920px,100%);margin:0 auto;padding:18px}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  box-shadow:var(--shadow);
  position:sticky;
  top:12px;
  z-index:50;
  backdrop-filter:blur(18px);
}
.header h1{
  margin:0;
  font-family:'Syne',Inter,system-ui,sans-serif;
  font-size:clamp(19px,2vw,28px);
  line-height:1.05;
  color:var(--text-strong);
  letter-spacing:-.03em;
  text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.theme-toggle{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel-muted);
  color:var(--muted-2);
  user-select:none;
}
.switch{position:relative;width:48px;height:26px;display:inline-flex;align-items:center}
.switch input{opacity:0;width:0;height:0}
.slider-switch{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.22s ease;box-shadow:inset 0 0 0 1px var(--border-soft)}
.slider-switch:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--text-strong);transition:.22s ease}
.switch input:checked+.slider-switch{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch input:checked+.slider-switch:before{transform:translateX(22px);background:#07100d}
.tab-shell{
  margin-top:18px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 95%,transparent);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.tab-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px;
  border-bottom:1px solid var(--border);
  background:var(--panel-strong);
  flex-wrap:wrap;
}
.tab-buttons{display:flex;gap:8px;flex-wrap:wrap}
.tab-button{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-width:190px;
  min-height:54px;
  font-family:'Syne',Inter,system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:11px;
  line-height:1.05;
  color:var(--muted-2);
  background:var(--panel-muted);
}
.tab-button .tab-code{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em}
.tab-button .tab-title{font-size:12px;font-weight:700;letter-spacing:.035em;margin-top:4px}
.tab-button.active{
  border-color:transparent;
  background:var(--accent-2);
  color:#07100d;
  font-weight:800;
}
.root-status{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:11px;
  flex-wrap:wrap;
}
.status-dot{width:10px;height:10px;border-radius:999px;background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.status-dot.loaded{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 18%,transparent)}
.frame-wrap{height:calc(100vh - 162px);min-height:720px;background:var(--bg)}
.tab-frame{width:100%;height:100%;border:0;display:none;background:transparent}
.tab-frame.active{display:block}
.note{
  margin-top:12px;
  color:var(--muted);
  font-size:11px;
}
code{color:var(--accent-2)}
@media(max-width:980px){
  .header{align-items:flex-start;flex-direction:column;position:static}
  .header-actions{justify-content:flex-start;width:100%}
  .frame-wrap{height:78vh;min-height:650px}
}

.header-actions .theme-toggle{display:none!important;}

/* STAR v2 unified-results compact layout patch */
.header.results-header-removed{display:none!important;}
.app-shell{padding:8px 10px 10px!important;}

.tab-buttons{gap:6px!important;align-items:center!important;flex-wrap:wrap!important;}
.tab-button{
  min-width:auto!important;
  min-height:34px!important;
  height:34px!important;
  padding:5px 10px!important;
  flex-direction:row!important;
  align-items:center!important;
  gap:6px!important;
  border-radius:10px!important;
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace!important;

  line-height:1!important;
}
.tab-button .tab-code{font-size:10px!important;line-height:1!important;letter-spacing:.01em!important;}
.tab-button .tab-title{font-size:10px!important;line-height:1!important;margin-top:0!important;letter-spacing:.01em!important;white-space:nowrap!important;}
.run-folder-action{
  min-height:34px!important;
  height:34px!important;
  padding:5px 12px!important;
  border-radius:10px!important;
  font-size:10px!important;
  line-height:1!important;
  white-space:nowrap!important;
  flex:0 0 auto!important;
}
.root-status{font-size:10px!important;line-height:1.2!important;gap:8px!important;}
.status-dot{width:8px!important;height:8px!important;}
.frame-wrap{height:calc(100vh - 64px)!important;min-height:660px!important;}
@media(max-width:980px){.frame-wrap{height:78vh!important;min-height:620px!important}.tab-button{height:32px!important;min-height:32px!important}.run-folder-action{height:32px!important;min-height:32px!important}}

</style>

      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Daily energy balance&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Generation vs consumption by mode (Wh/day, margin included)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotWaterfall&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);

/* ---------- entities: fixed colour slots (colour follows the entity) ---------- */
const MODE_DEFS = [
  { key:&#x27;idle&#x27;,     label:&#x27;Idle&#x27;,      css:&#x27;--s1&#x27; },
  { key:&#x27;tx_uhf&#x27;,   label:&#x27;TX UHF&#x27;,    css:&#x27;--s2&#x27; },
  { key:&#x27;tx_sband&#x27;, label:&#x27;TX S-BAND&#x27;, css:&#x27;--s3&#x27; },
  { key:&#x27;payload&#x27;,  label:&#x27;Payload&#x27;,   css:&#x27;--s4&#x27; }
];
const GROUP_DEFS = [
  { key:&#x27;payload&#x27;,  label:&#x27;Payload (SDR, cameras)&#x27;,           css:&#x27;--s5&#x27;, test:/camera|sdr/i },
  { key:&#x27;comms&#x27;,    label:&#x27;Communications (TX/RX/beacon)&#x27;,    css:&#x27;--s6&#x27;, test:/\b(tx|rx)\b|beacon|uhf|s band|s-band/i },
  { key:&#x27;platform&#x27;, label:&#x27;Platform (OBDH, EPS, ADCS)&#x27;,       css:&#x27;--s7&#x27;, test:/obdh|eps|adcs/i },
  { key:&#x27;thermal&#x27;,  label:&#x27;Thermal control&#x27;,                  css:&#x27;--s8&#x27;, test:/thermal/i }
];
function groupOf(name){
  const n = String(name);
  for (const g of GROUP_DEFS) { if (g.test.test(n)) return g.key; }
  return &#x27;platform&#x27;;
}

const state = { data:null, model:null, mode:&#x27;payload&#x27;, order:&#x27;interleaved&#x27;, labels:{} };

/* ---------- helpers ---------- */
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(v){ return String(v ?? &#x27;&#x27;).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;); }
function num(v, d = 0){ const n = Number(v); return Number.isFinite(n) ? n : d; }
function fmt(v, d = 2){ return Number.isFinite(Number(v)) ? Number(v).toFixed(d) : &#x27;—&#x27;; }
function sgn(v, d = 2){ const n = Number(v); return Number.isFinite(n) ? (n &gt;= 0 ? &#x27;+&#x27; : &#x27;−&#x27;) + Math.abs(n).toFixed(d) : &#x27;—&#x27;; }
function colors(){
  const c = { text:css(&#x27;--text&#x27;), strong:css(&#x27;--text-strong&#x27;), muted:css(&#x27;--muted&#x27;), muted2:css(&#x27;--muted-2&#x27;), panel:css(&#x27;--panel&#x27;),
    panelStrong:css(&#x27;--panel-strong&#x27;), border:css(&#x27;--border&#x27;), grid:css(&#x27;--border-soft&#x27;), sunTint:css(&#x27;--sun-tint&#x27;), eclTint:css(&#x27;--ecl-tint&#x27;),
    good:css(&#x27;--st-good&#x27;), critical:css(&#x27;--st-critical&#x27;), modes:{}, groups:{} };
  MODE_DEFS.forEach(m =&gt; c.modes[m.key] = css(m.css));
  GROUP_DEFS.forEach(g =&gt; c.groups[g.key] = css(g.css));
  return c;
}
function baseLayout(c, extra){
  return Object.assign({
    paper_bgcolor:&#x27;rgba(0,0,0,0)&#x27;, plot_bgcolor:&#x27;rgba(0,0,0,0)&#x27;,
    font:{ family:&quot;&#x27;Space Mono&#x27;, ui-monospace, monospace&quot;, size:11, color:c.text },
    margin:{ l:64, r:18, t:10, b:46 },
    hoverlabel:{ bgcolor:c.panelStrong, bordercolor:c.border, font:{ color:c.text, family:&quot;&#x27;Space Mono&#x27;, monospace&quot;, size:11 } },
    legend:{ orientation:&#x27;h&#x27;, x:0, y:1.13, font:{ size:11, color:c.text } }
  }, extra || {});
}
function axis(c, extra){
  return Object.assign({ gridcolor:c.grid, zerolinecolor:c.grid, linecolor:c.border, tickcolor:c.border, tickfont:{ color:c.muted2, size:11 }, titlefont:{ color:c.muted2, size:11 } }, extra || {});
}
const PLOT_CFG = { responsive:true, displaylogo:false, displayModeBar:false };
function draw(id, traces, layout){
  const el = $(id);
  if (!el || !window.Plotly) return;
  el.querySelectorAll(&#x27;.empty&#x27;).forEach(n =&gt; n.remove());   // drop a previous &quot;no data&quot; placeholder
  Plotly.react(el, traces, layout, PLOT_CFG);
}
function empty(id, message){
  const el = $(id);
  if (!el) return;
  if (window.Plotly) { try { Plotly.purge(el); } catch (_) {} }
  el.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${esc(message)}&lt;/div&gt;`;
}

/* ---------- data model ---------- */
function buildModel(data){
  const cfg = data.input_config || {};
  const orb = cfg.orbit || {};
  const sum = data.orbit || {};
  const period = num(orb.period_min, num(sum.periodMin, 0));
  const sunMin = num(orb.sunlight_min, num(sum.sunlightMin, 0));
  const eclMin = num(orb.eclipse_min, num(sum.eclipseMin, Math.max(0, period - sunMin)));
  const N = Math.round(num(orb.daily_orbits, num(sum.dailyOrbits, 15)));
  const genOrbit = num((cfg.generation || {}).power_generated_per_orbit_Wh, num(sum.powerGeneratedPerOrbitWh, 0));
  const capacity = num((cfg.battery || {}).capacity_Wh, num(sum.batteryCapacityWh, 0));
  const margin = num(cfg.margin_fraction, num((data.analysis || {}).margin_fraction, 0));
  const counts = Object.assign({ idle:0, tx_uhf:0, tx_sband:0, payload:0 }, (cfg.operations || {}).mode_orbits_per_day || {});
  const summaries = {};
  (data.mode_summaries || []).forEach(s =&gt; { summaries[s.mode_key] = s; });
  const subs = cfg.subsystems || [];
  if (!(period &gt; 0) || !subs.length) return null;

  const modes = MODE_DEFS.map(def =&gt; {
    const rows = subs.map(s =&gt; {
      const duty = ((s.duty || {})[def.key]) || {};
      const dutySun = num(duty.sun, 0), dutyEcl = num(duty.eclipse, 0), P = num(s.powerW, 0);
      return { name:s.name, group:groupOf(s.name), P, dutySun, dutyEcl,
        minSun:dutySun * sunMin, minEcl:dutyEcl * eclMin,
        eSun:P * dutySun * sunMin / 60, eEcl:P * dutyEcl * eclMin / 60 };
    });
    const eSun = rows.reduce((a, r) =&gt; a + r.eSun, 0);
    const eEcl = rows.reduce((a, r) =&gt; a + r.eEcl, 0);
    const avgSunW = rows.reduce((a, r) =&gt; a + r.P * r.dutySun, 0);
    const avgEclW = rows.reduce((a, r) =&gt; a + r.P * r.dutyEcl, 0);
    const total = eSun + eEcl;
    const totalM = total * (1 + margin);
    const sm = summaries[def.key] || {};
    return Object.assign({}, def, {
      rows, eSun, eEcl, total, totalM, avgSunW, avgEclW,
      count:num(counts[def.key], 0),
      label:def.label,
      fullLabel:sm.mode || def.label,
      peakW:num(sm.peak_power_W, Math.max(avgSunW, avgEclW)),
      dod:num(sm.orbital_DoD, capacity &gt; 0 ? eEcl / capacity : NaN),
      savedPerOrbit:genOrbit - totalM
    });
  });
  const byKey = {}; modes.forEach(m =&gt; byKey[m.key] = m);

  const orbitsInPlan = MODE_DEFS.reduce((a, d) =&gt; a + byKey[d.key].count, 0);
  const genDay = N * genOrbit;
  const consDay = modes.reduce((a, m) =&gt; a + m.count * m.totalM, 0);
  const balance = genDay - consDay;
  const genW = sunMin &gt; 0 ? genOrbit / (sunMin / 60) : 0;

  /* payload orbits the day can sustain (other modes kept as declared, idle fills the rest) */
  const fixedNonIdle = byKey.tx_uhf.count * byKey.tx_uhf.totalM + byKey.tx_sband.count * byKey.tx_sband.totalM;
  const nonPayloadNonIdle = byKey.tx_uhf.count + byKey.tx_sband.count;
  const dE = byKey.payload.totalM - byKey.idle.totalM;
  const nMax = dE &gt; 1e-9 ? (genDay - fixedNonIdle - (N - nonPayloadNonIdle) * byKey.idle.totalM) / dE : Infinity;

  return { period, sunMin, eclMin, N, genOrbit, genDay, genW, capacity, margin, counts, modes, byKey,
    orbitsInPlan, consDay, balance, nMax, nonPayloadNonIdle, fixedNonIdle,
    balanceReported:(data.analysis || {}).daily_balance_Wh, runId:(cfg.star_runtime || {}).run_id || data.run_id || &#x27;&#x27;,
    startUtc:sum.startUtc || &#x27;&#x27;, attitudeMode:sum.attitudeMode || &#x27;&#x27; };
}

function buildSequence(model, order){
  const keys = MODE_DEFS.map(d =&gt; d.key);
  const total = keys.reduce((a, k) =&gt; a + model.byKey[k].count, 0);
  const seq = [];
  if (order === &#x27;grouped&#x27;) {
    keys.forEach(k =&gt; { for (let i = 0; i &lt; model.byKey[k].count; i++) seq.push(k); });
    return seq;
  }
  const given = {}; keys.forEach(k =&gt; given[k] = 0);
  for (let step = 1; step &lt;= total; step++) {
    let best = null, bestGap = -Infinity;
    keys.forEach(k =&gt; {
      const cnt = model.byKey[k].count;
      if (!cnt || given[k] &gt;= cnt) return;
      const gap = cnt * step / total - given[k];
      if (gap &gt; bestGap + 1e-12) { bestGap = gap; best = k; }
    });
    given[best]++; seq.push(best);
  }
  return seq;
}

function simulateBattery(model, seq){
  const cap = model.capacity, pts = [{ t:0, e:cap }];
  let e = cap, t = 0, minE = cap, depleted = false;
  const perOrbit = [];
  const seg = (net, dt) =&gt; {
    if (net &gt; 0 &amp;&amp; cap &gt; 0) {
      const tFull = (cap - e) / net;
      if (tFull &lt; dt) { pts.push({ t:t + tFull, e:cap }); e = cap; t += dt; pts.push({ t, e }); return; }
    } else if (net &lt; 0) {
      const tEmpty = e / -net;
      if (tEmpty &lt; dt) { pts.push({ t:t + tEmpty, e:0 }); e = 0; depleted = true; t += dt; pts.push({ t, e }); return; }
    }
    e += net * dt; t += dt; pts.push({ t, e }); minE = Math.min(minE, e);
  };
  seq.forEach((k, i) =&gt; {
    const m = model.byKey[k], f = 1 + model.margin;
    const startE = e;
    seg(model.genW - m.avgSunW * f, model.sunMin / 60);
    seg(-m.avgEclW * f, model.eclMin / 60);
    perOrbit.push({ orbit:i + 1, mode:k, startE, endE:e });
  });
  minE = Math.min(minE, ...pts.map(p =&gt; p.e));
  return { pts, minE, depleted, perOrbit };
}

/* ---------- rendering ---------- */
function renderBanner(model){
  const el = $(&#x27;banner&#x27;);
  const bal = model.balance;
  const pay = model.byKey.payload;
  let cls = &#x27;good&#x27;, icon = &#x27;✓&#x27;, head;
  const tight = Number.isFinite(model.nMax) &amp;&amp; model.byKey.payload.count &gt; 0 &amp;&amp; (model.nMax - model.byKey.payload.count) &lt; 1;
  if (bal &lt; 0) { cls = &#x27;critical&#x27;; icon = &#x27;✕&#x27;; head = &#x27;ENERGY DEFICIT&#x27;; }
  else if (tight) { cls = &#x27;warning&#x27;; icon = &#x27;!&#x27;; head = &#x27;ENERGY POSITIVE — TIGHT MARGIN&#x27;; }
  else { head = &#x27;ENERGY POSITIVE&#x27;; }
  const pct = model.consDay &gt; 0 ? (bal / model.consDay * 100) : NaN;
  let text = `&lt;b&gt;${head}&lt;/b&gt; — the daily budget closes with &lt;b&gt;${sgn(bal)} Wh/day&lt;/b&gt; (${fmt(model.genDay, 1)} Wh generated vs ${fmt(model.consDay, 1)} Wh consumed incl. ${fmt(model.margin * 100, 0)}% margin${Number.isFinite(pct) ? `, ${sgn(pct, 1)}% of consumption` : &#x27;&#x27;}).`;
  if (pay.count &gt; 0) {
    text += ` Payload mode costs &lt;b&gt;${sgn(pay.savedPerOrbit)} Wh/orbit&lt;/b&gt;${pay.savedPerOrbit &lt; 0 ? &#x27; and is recovered by the idle orbits&#x27; : &#x27;&#x27;}; the day sustains at most &lt;b&gt;${Number.isFinite(model.nMax) ? fmt(model.nMax, 1) : &#x27;∞&#x27;}&lt;/b&gt; payload orbits (declared: ${pay.count}).`;
  }
  el.className = &#x27;banner &#x27; + cls;
  el.innerHTML = `&lt;div class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;${icon}&lt;/div&gt;&lt;div&gt;${text}&lt;/div&gt;`;
  el.hidden = false;
}

function renderKpis(model, batt){
  const pay = model.byKey.payload, peak = Math.max(...model.modes.map(m =&gt; m.peakW));
  const peakMode = model.modes.reduce((a, m) =&gt; m.peakW &gt; a.peakW ? m : a, model.modes[0]);
  const worstDod = Math.max(...model.modes.filter(m =&gt; m.count &gt; 0 || true).map(m =&gt; num(m.dod, 0)));
  const items = [
    { label:&#x27;Daily energy balance&#x27;, value:sgn(model.balance), unit:&#x27;Wh/day&#x27;, note:`${fmt(model.genDay, 1)} generated · ${fmt(model.consDay, 1)} consumed`,
      flag:model.balance &gt;= 0 ? { cls:&#x27;good&#x27;, text:&#x27;✓ positive&#x27; } : { cls:&#x27;critical&#x27;, text:&#x27;✕ deficit&#x27; } },
    { label:&#x27;Payload orbit balance&#x27;, value:sgn(pay.savedPerOrbit), unit:&#x27;Wh/orbit&#x27;, note:`${fmt(pay.totalM, 2)} Wh used vs ${fmt(model.genOrbit, 2)} Wh generated`,
      flag:pay.savedPerOrbit &gt;= 0 ? { cls:&#x27;good&#x27;, text:&#x27;✓ self-sustained&#x27; } : { cls:&#x27;warning&#x27;, text:&#x27;! needs idle orbits&#x27; } },
    { label:&#x27;Max payload orbits / day&#x27;, value:Number.isFinite(model.nMax) ? fmt(model.nMax, 1) : &#x27;∞&#x27;, unit:&#x27;&#x27;, note:`declared ${pay.count} of ${model.N} orbits`,
      flag:(!Number.isFinite(model.nMax) || model.nMax &gt;= pay.count) ? { cls:(Number.isFinite(model.nMax) &amp;&amp; model.nMax - pay.count &lt; 1) ? &#x27;warning&#x27; : &#x27;good&#x27;, text:(Number.isFinite(model.nMax) &amp;&amp; model.nMax - pay.count &lt; 1) ? &#x27;! margin &lt; 1 orbit&#x27; : &#x27;✓ within limit&#x27; } : { cls:&#x27;critical&#x27;, text:&#x27;✕ above limit&#x27; } },
    { label:&#x27;Peak load&#x27;, value:fmt(peak, 2), unit:&#x27;W&#x27;, note:`${peakMode.label} · solar avg ${fmt(model.genW, 2)} W in sunlight` },
    { label:&#x27;Battery&#x27;, value:fmt(model.capacity, 0), unit:&#x27;Wh&#x27;, note:`worst orbit DoD ${fmt(worstDod * 100, 1)}% · min charge ${fmt(model.capacity &gt; 0 ? batt.minE / model.capacity * 100 : NaN, 0)}% over the day`,
      flag:batt.depleted ? { cls:&#x27;critical&#x27;, text:&#x27;✕ battery depleted&#x27; } : null },
    { label:&#x27;Orbit&#x27;, value:fmt(model.period, 1), unit:&#x27;min&#x27;, note:`${fmt(model.sunMin, 1)} sunlight · ${fmt(model.eclMin, 1)} eclipse (${fmt(model.eclMin / model.period * 100, 0)}%)` }
  ];
  $(&#x27;kpis&#x27;).innerHTML = items.map(i =&gt; `&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;k-label&quot;&gt;${esc(i.label)}&lt;/div&gt;&lt;div class=&quot;k-value&quot;&gt;${esc(i.value)}&lt;span class=&quot;k-unit&quot;&gt;${esc(i.unit)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;${esc(i.note)}&lt;/div&gt;${i.flag ? `&lt;div class=&quot;k-flag ${i.flag.cls}&quot;&gt;${esc(i.flag.text)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;);
}

function renderModeBar(model, c){
  const seg = $(&#x27;mode-seg&#x27;);
  seg.innerHTML = model.modes.map(m =&gt; `&lt;button type=&quot;button&quot; role=&quot;tab&quot; data-mode=&quot;${m.key}&quot; class=&quot;${m.key === state.mode ? &#x27;active&#x27; : &#x27;&#x27;}&quot; aria-selected=&quot;${m.key === state.mode}&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:${c.modes[m.key]}&quot;&gt;&lt;/span&gt;${esc(m.label)}${m.count ? ` &lt;span style=&quot;color:var(--muted)&quot;&gt;· ${m.count}/day&lt;/span&gt;` : &#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;);
  seg.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; b.onclick = () =&gt; { state.mode = b.dataset.mode; renderAll(); });
  $(&#x27;mode-bar&#x27;).hidden = false;
}

function renderTimeline(model, c){
  const m = model.byKey[state.mode];
  $(&#x27;t1-title&#x27;).textContent = `Subsystem ON/OFF over one orbit · ${m.fullLabel}`;
  const rowLabel = r =&gt; `${r.name} · ${fmt(r.P, r.P &lt; 1 ? 2 : 1)} W`;
  const rows = m.rows.map(rowLabel);
  const traces = GROUP_DEFS.map(g =&gt; ({ type:&#x27;bar&#x27;, orientation:&#x27;h&#x27;, name:g.label, x:[], base:[], y:[], text:[], customdata:[],
    marker:{ color:c.groups[g.key], line:{ color:c.groups[g.key], width:1 } }, width:0.62, cliponaxis:false,
    textposition:&#x27;inside&#x27;, insidetextanchor:&#x27;middle&#x27;, textfont:{ color:&#x27;#ffffff&#x27;, size:10 },
    hovertemplate:&#x27;%{y}&lt;br&gt;%{customdata}&lt;extra&gt;&lt;/extra&gt;&#x27;, showlegend:false }));
  const annotations = [];
  const place = (r, start, len, phaseName, phaseLen, duty) =&gt; {
    if (!(len &gt; 1e-6)) return;
    const g = traces[GROUP_DEFS.findIndex(x =&gt; x.key === r.group)];
    const always = duty &gt;= 0.999;
    const s = always ? start : start + (phaseLen - len) / 2;   // partial duty: centred in the phase (schematic)
    g.x.push(len); g.base.push(s); g.y.push(rowLabel(r));
    g.text.push(len &gt;= 6 ? `${fmt(len, len &lt; 10 ? 1 : 0)} min` : &#x27;&#x27;);
    g.customdata.push(`${phaseName}: ON ${fmt(len, 2)} min of ${fmt(phaseLen, 1)} min (${fmt(duty * 100, 1)}% duty) · ${fmt(r.P, 2)} W`);
  };
  m.rows.forEach(r =&gt; {
    place(r, 0, r.minSun, &#x27;Sunlight&#x27;, model.sunMin, r.dutySun);
    place(r, model.sunMin, r.minEcl, &#x27;Eclipse&#x27;, model.eclMin, r.dutyEcl);
    if (!(r.minSun &gt; 1e-6) &amp;&amp; !(r.minEcl &gt; 1e-6)) {
      annotations.push({ x:model.period / 2, y:rowLabel(r), text:&#x27;OFF in this mode&#x27;, showarrow:false, font:{ color:c.muted, size:10 } });
    }
  });
  annotations.push({ xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x:model.sunMin / 2, y:1.0, yanchor:&#x27;bottom&#x27;, text:`SUNLIGHT · ${fmt(model.sunMin, 1)} min`, showarrow:false, font:{ color:c.muted2, size:10 } });
  annotations.push({ xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x:model.sunMin + model.eclMin / 2, y:1.0, yanchor:&#x27;bottom&#x27;, text:`ECLIPSE · ${fmt(model.eclMin, 1)} min`, showarrow:false, font:{ color:c.muted2, size:10 } });
  const shapes = [
    { type:&#x27;rect&#x27;, xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x0:0, x1:model.sunMin, y0:0, y1:1, fillcolor:c.sunTint, line:{ width:0 }, layer:&#x27;below&#x27; },
    { type:&#x27;rect&#x27;, xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x0:model.sunMin, x1:model.period, y0:0, y1:1, fillcolor:c.eclTint, line:{ width:0 }, layer:&#x27;below&#x27; }
  ];
  draw(&#x27;plotTimeline&#x27;, traces, baseLayout(c, {
    barmode:&#x27;overlay&#x27;, height:Math.max(300, 46 + rows.length * 30), shapes, annotations,
    margin:{ l:170, r:18, t:26, b:44 }, showlegend:false,
    xaxis:axis(c, { range:[0, model.period], title:&#x27;Minutes from the start of sunlight&#x27;, zeroline:false }),
    yaxis:axis(c, { autorange:&#x27;reversed&#x27;, categoryorder:&#x27;array&#x27;, categoryarray:rows, showgrid:false })
  }));
  $(&#x27;legend-groups&#x27;).innerHTML = GROUP_DEFS.map(g =&gt; `&lt;span&gt;&lt;i style=&quot;background:${c.groups[g.key]}&quot;&gt;&lt;/i&gt;${esc(g.label)}&lt;/span&gt;`).join(&#x27;&#x27;)
    + `&lt;span&gt;&lt;i class=&quot;tint-sun&quot;&gt;&lt;/i&gt;Sunlight phase&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;tint-ecl&quot;&gt;&lt;/i&gt;Eclipse phase&lt;/span&gt;`;
}

function renderDaily(model, c, seq){
  const T = model.period / 60;
  const traces = MODE_DEFS.map(d =&gt; ({ type:&#x27;bar&#x27;, orientation:&#x27;h&#x27;, name:d.label, x:[], base:[], y:[], customdata:[],
    marker:{ color:c.modes[d.key], line:{ color:c.panel, width:2 } }, width:0.7,
    hovertemplate:&#x27;%{customdata}&lt;extra&gt;&lt;/extra&gt;&#x27;, showlegend:false }));
  const rowMode = &#x27;Operating mode&#x27;, rowPay = &#x27;Payload acquisition&#x27;, rowSun = &#x27;Sunlight / eclipse&#x27;;
  const off = { type:&#x27;bar&#x27;, orientation:&#x27;h&#x27;, name:&#x27;Payload OFF&#x27;, x:[], base:[], y:[], customdata:[], marker:{ color:c.muted, opacity:0.28, line:{ color:c.panel, width:2 } }, width:0.32, hovertemplate:&#x27;%{customdata}&lt;extra&gt;&lt;/extra&gt;&#x27;, showlegend:false };
  const sunBar = { type:&#x27;bar&#x27;, orientation:&#x27;h&#x27;, name:&#x27;Sunlight&#x27;, x:[], base:[], y:[], marker:{ color:c.muted2, opacity:0.55, line:{ color:c.panel, width:2 } }, width:0.32, hovertemplate:&#x27;Sunlight %{x:.2f} h&lt;extra&gt;&lt;/extra&gt;&#x27;, showlegend:false };
  const eclBar = { type:&#x27;bar&#x27;, orientation:&#x27;h&#x27;, name:&#x27;Eclipse&#x27;, x:[], base:[], y:[], marker:{ color:c.border, opacity:1, line:{ color:c.panel, width:2 } }, width:0.32, hovertemplate:&#x27;Eclipse %{x:.2f} h&lt;extra&gt;&lt;/extra&gt;&#x27;, showlegend:false };
  const payOn = traces[MODE_DEFS.findIndex(d =&gt; d.key === &#x27;payload&#x27;)];
  seq.forEach((k, i) =&gt; {
    const idx = MODE_DEFS.findIndex(d =&gt; d.key === k), tr = traces[idx];
    const info = `Orbit ${i + 1} · ${model.byKey[k].fullLabel} · ${fmt(i * T, 1)}–${fmt((i + 1) * T, 1)} h`;
    tr.x.push(T); tr.base.push(i * T); tr.y.push(rowMode); tr.customdata.push(info);
    if (k === &#x27;payload&#x27;) {
      // payload ON is drawn with the payload-mode trace itself (same entity colour)
      payOn.x.push(T); payOn.base.push(i * T); payOn.y.push(rowPay); payOn.customdata.push(`Orbit ${i + 1} · payload ON (acquisition mode)`);
    } else {
      off.x.push(T); off.base.push(i * T); off.y.push(rowPay); off.customdata.push(`Orbit ${i + 1} · payload OFF (${model.byKey[k].fullLabel})`);
    }
    sunBar.x.push(model.sunMin / 60); sunBar.base.push(i * T); sunBar.y.push(rowSun);
    eclBar.x.push(model.eclMin / 60); eclBar.base.push(i * T + model.sunMin / 60); eclBar.y.push(rowSun);
  });
  const all = traces.concat([off, sunBar, eclBar]);
  const orbitsN = seq.length;
  const shapes = [];
  for (let i = 0; i &lt;= orbitsN; i++) shapes.push({ type:&#x27;line&#x27;, xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x0:i * T, x1:i * T, y0:0, y1:1, line:{ color:c.grid, width:1 }, layer:&#x27;below&#x27; });
  draw(&#x27;plotDaily&#x27;, all, baseLayout(c, {
    barmode:&#x27;overlay&#x27;, height:230, shapes, margin:{ l:150, r:18, t:10, b:46 }, showlegend:false,
    xaxis:axis(c, { range:[0, orbitsN * T], title:`Orbit number (${fmt(model.period, 1)} min each · ${fmt(orbitsN * T, 1)} h in total)`, tickvals:Array.from({ length:orbitsN }, (_, i) =&gt; (i + 0.5) * T), ticktext:Array.from({ length:orbitsN }, (_, i) =&gt; String(i + 1)), zeroline:false, showgrid:false }),
    yaxis:axis(c, { autorange:&#x27;reversed&#x27;, categoryorder:&#x27;array&#x27;, categoryarray:[rowMode, rowPay, rowSun], showgrid:false })
  }));
  $(&#x27;legend-modes&#x27;).innerHTML = MODE_DEFS.map(d =&gt; `&lt;span&gt;&lt;i style=&quot;background:${c.modes[d.key]}&quot;&gt;&lt;/i&gt;${esc(d.label)}${model.byKey[d.key].count ? ` · ${model.byKey[d.key].count} orbits` : &#x27; · 0 orbits&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;)
    + `&lt;span&gt;&lt;i style=&quot;background:${c.muted};opacity:.4&quot;&gt;&lt;/i&gt;Payload OFF&lt;/span&gt;`;
  const mismatch = model.orbitsInPlan !== model.N;
  $(&#x27;t2-hint&#x27;).textContent = mismatch
    ? `Warning: the declared mode orbits (${model.orbitsInPlan}) differ from the ${model.N} orbits/day of the orbit model.`
    : `${model.N} orbits/day · mode budget as declared in the END-004 input; the order of the orbits is not defined by END-004.`;
}

function pie(id, labels, values, hover, cols, centerTop, centerBottom, c, unit){
  const idx = values.map((v, i) =&gt; v &gt; 1e-9 ? i : -1).filter(i =&gt; i &gt;= 0);
  if (!idx.length) { empty(id, &#x27;No consumption in this mode&#x27;); return; }
  draw(id, [{ type:&#x27;pie&#x27;, hole:0.58, sort:false, direction:&#x27;clockwise&#x27;, labels:idx.map(i =&gt; labels[i]), values:idx.map(i =&gt; values[i]),
    customdata:idx.map(i =&gt; hover[i]), marker:{ colors:idx.map(i =&gt; cols[i]), line:{ color:c.panel, width:2 } },
    textinfo:&#x27;percent&#x27;, textposition:&#x27;outside&#x27;, textfont:{ color:c.text, size:11 }, automargin:false,
    hovertemplate:`%{label}&lt;br&gt;%{value:.3f} ${unit} (%{percent})&lt;br&gt;%{customdata}&lt;extra&gt;&lt;/extra&gt;`, showlegend:true }],
  baseLayout(c, { height:300, margin:{ l:44, r:44, t:26, b:64 }, showlegend:true,
    legend:{ orientation:&#x27;h&#x27;, x:0.5, xanchor:&#x27;center&#x27;, y:-0.02, yanchor:&#x27;top&#x27;, font:{ size:10, color:c.text } },
    annotations:[{ text:`&lt;b style=&quot;font-size:16px&quot;&gt;${centerTop}&lt;/b&gt;&lt;br&gt;&lt;span style=&quot;font-size:10px&quot;&gt;${centerBottom}&lt;/span&gt;`, showarrow:false, x:0.5, y:0.5, font:{ color:c.strong } }] }));
}

function groupTotals(m, fn){
  return GROUP_DEFS.map(g =&gt; {
    const rows = m.rows.filter(r =&gt; r.group === g.key);
    return { value:rows.reduce((a, r) =&gt; a + fn(r), 0), rows };
  });
}

function renderPies(model, c){
  const m = model.byKey[state.mode];
  $(&#x27;pies-hint&#x27;).textContent = `Function shares for the selected mode (${m.fullLabel}); the last pie compares operating modes.`;
  const labels = GROUP_DEFS.map(g =&gt; g.label.split(&#x27; (&#x27;)[0]);
  const cols = GROUP_DEFS.map(g =&gt; c.groups[g.key]);
  const eGroups = groupTotals(m, r =&gt; r.eSun + r.eEcl);
  pie(&#x27;pieEnergy&#x27;, labels, eGroups.map(x =&gt; x.value),
    eGroups.map(x =&gt; x.rows.filter(r =&gt; r.eSun + r.eEcl &gt; 1e-9).map(r =&gt; `${r.name} ${fmt(r.eSun + r.eEcl, 3)} Wh`).join(&#x27; · &#x27;) || &#x27;—&#x27;),
    cols, fmt(m.total, 2), &#x27;Wh / orbit&#x27;, c, &#x27;Wh&#x27;);
  const sGroups = groupTotals(m, r =&gt; r.P * r.dutySun);
  pie(&#x27;pieSun&#x27;, labels, sGroups.map(x =&gt; x.value),
    sGroups.map(x =&gt; x.rows.filter(r =&gt; r.P * r.dutySun &gt; 1e-9).map(r =&gt; `${r.name} ${fmt(r.P * r.dutySun, 3)} W`).join(&#x27; · &#x27;) || &#x27;—&#x27;),
    cols, fmt(m.avgSunW, 2), &#x27;W average&#x27;, c, &#x27;W&#x27;);
  const xGroups = groupTotals(m, r =&gt; r.P * r.dutyEcl);
  pie(&#x27;pieEcl&#x27;, labels, xGroups.map(x =&gt; x.value),
    xGroups.map(x =&gt; x.rows.filter(r =&gt; r.P * r.dutyEcl &gt; 1e-9).map(r =&gt; `${r.name} ${fmt(r.P * r.dutyEcl, 3)} W`).join(&#x27; · &#x27;) || &#x27;—&#x27;),
    cols, fmt(m.avgEclW, 2), &#x27;W average&#x27;, c, &#x27;W&#x27;);
  const dayModes = model.modes.filter(x =&gt; x.count &gt; 0);
  pie(&#x27;pieDaily&#x27;, dayModes.map(x =&gt; `${x.label} ×${x.count}`), dayModes.map(x =&gt; x.count * x.totalM),
    dayModes.map(x =&gt; `${fmt(x.totalM, 3)} Wh/orbit × ${x.count} orbits`), dayModes.map(x =&gt; c.modes[x.key]),
    fmt(model.consDay, 1), `Wh/day · ${fmt(model.genDay, 1)} generated`, c, &#x27;Wh&#x27;);
}

function renderBattery(model, c, seq, batt){
  if (!seq.length || !(model.capacity &gt; 0)) { empty(&#x27;plotBattery&#x27;, &#x27;No battery data&#x27;); return; }
  const T = model.period / 60;
  const shapes = seq.map((k, i) =&gt; ({ type:&#x27;rect&#x27;, xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x0:i * T, x1:(i + 1) * T, y0:0, y1:0.06, fillcolor:c.modes[k], opacity:0.85, line:{ color:c.panel, width:2 }, layer:&#x27;above&#x27; }));
  const yMin = Math.max(0, Math.min(100, batt.minE / model.capacity * 100 - 6));
  draw(&#x27;plotBattery&#x27;, [{ type:&#x27;scatter&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Battery energy&#x27;, x:batt.pts.map(p =&gt; p.t), y:batt.pts.map(p =&gt; p.e / model.capacity * 100),
    customdata:batt.pts.map(p =&gt; p.e), line:{ color:c.modes.idle, width:2 }, hovertemplate:&#x27;%{x:.2f} h · %{y:.1f}% (%{customdata:.2f} Wh)&lt;extra&gt;&lt;/extra&gt;&#x27; }],
  baseLayout(c, { height:300, shapes, showlegend:false,
    annotations:[{ x:batt.pts.reduce((a, p) =&gt; p.e &lt; a.e ? p : a, batt.pts[0]).t, y:batt.minE / model.capacity * 100, text:`min ${fmt(batt.minE / model.capacity * 100, 0)}%`, showarrow:true, arrowhead:0, ax:0, ay:-26, font:{ color:c.text, size:10 }, arrowcolor:c.muted }],
    xaxis:axis(c, { title:&#x27;Hours from the start of the day&#x27;, range:[0, seq.length * T], zeroline:false }),
    yaxis:axis(c, { title:&#x27;State of charge [%]&#x27;, range:[yMin, 101] }) }));
}

function renderProfile(model, c){
  const traces = [{ type:&#x27;scatter&#x27;, mode:&#x27;lines&#x27;, name:`Solar generation (${fmt(model.genW, 2)} W)`, x:[0, model.sunMin, model.sunMin, model.period], y:[model.genW, model.genW, 0, 0], fill:&#x27;tozeroy&#x27;,
    fillcolor:c.muted2.startsWith(&#x27;#&#x27;) ? c.muted2 + &#x27;22&#x27; : &#x27;rgba(150,160,180,.15)&#x27;, line:{ color:c.muted2, width:2 }, hovertemplate:&#x27;generation %{y:.2f} W&lt;extra&gt;&lt;/extra&gt;&#x27; }];
  const f = 1 + model.margin;
  model.modes.forEach(m =&gt; traces.push({ type:&#x27;scatter&#x27;, mode:&#x27;lines&#x27;, name:m.label, x:[0, model.sunMin, model.sunMin, model.period],
    y:[m.avgSunW * f, m.avgSunW * f, m.avgEclW * f, m.avgEclW * f], line:{ color:c.modes[m.key], width:2 }, hovertemplate:`${m.label}: %{y:.2f} W&lt;extra&gt;&lt;/extra&gt;` }));
  draw(&#x27;plotProfile&#x27;, traces, baseLayout(c, { height:300,
    shapes:[{ type:&#x27;rect&#x27;, xref:&#x27;x&#x27;, yref:&#x27;paper&#x27;, x0:model.sunMin, x1:model.period, y0:0, y1:1, fillcolor:c.eclTint, line:{ width:0 }, layer:&#x27;below&#x27; }],
    xaxis:axis(c, { title:&#x27;Minutes from the start of sunlight&#x27;, range:[0, model.period], zeroline:false }),
    yaxis:axis(c, { title:&#x27;Average power [W]&#x27;, rangemode:&#x27;tozero&#x27; }) }));
}

function renderSensitivity(model, c){
  const nMaxSweep = model.N - model.nonPayloadNonIdle;
  const xs = [], ys = [];
  for (let n = 0; n &lt;= nMaxSweep; n++) {
    xs.push(n);
    const idle = model.N - n - model.nonPayloadNonIdle;
    ys.push(model.genDay - model.fixedNonIdle - n * model.byKey.payload.totalM - idle * model.byKey.idle.totalM);
  }
  const cur = model.byKey.payload.count;
  const traces = [{ type:&#x27;scatter&#x27;, mode:&#x27;lines+markers&#x27;, name:&#x27;Daily balance&#x27;, x:xs, y:ys, line:{ color:c.modes.idle, width:2 }, marker:{ size:8, color:c.modes.idle, line:{ color:c.panel, width:2 } },
    hovertemplate:&#x27;%{x} payload orbits → %{y:+.2f} Wh/day&lt;extra&gt;&lt;/extra&gt;&#x27; }];
  const curIdx = xs.indexOf(cur);
  if (curIdx &gt;= 0) traces.push({ type:&#x27;scatter&#x27;, mode:&#x27;markers+text&#x27;, name:&#x27;Declared allocation&#x27;, x:[cur], y:[ys[curIdx]], text:[`declared: ${cur} (${sgn(ys[curIdx])} Wh)`], textposition:&#x27;top right&#x27;, textfont:{ color:c.strong, size:11 },
    marker:{ size:14, color:c.modes.payload, line:{ color:c.strong, width:2 } }, hovertemplate:&#x27;declared allocation&lt;extra&gt;&lt;/extra&gt;&#x27; });
  $(&#x27;sens-hint&#x27;).textContent = Number.isFinite(model.nMax) ? `Zero crossing at ${fmt(model.nMax, 1)} payload orbits/day` : &#x27;Balance stays positive for every allocation&#x27;;
  draw(&#x27;plotSens&#x27;, traces, baseLayout(c, { height:300, showlegend:false,
    xaxis:axis(c, { title:&#x27;Payload orbits per day (remaining orbits idle)&#x27;, dtick:1, zeroline:false }),
    yaxis:axis(c, { title:&#x27;Daily energy balance [Wh]&#x27;, zeroline:true, zerolinecolor:c.muted, zerolinewidth:1.5 }) }));
}

function renderWaterfall(model, c){
  const dayModes = model.modes.filter(x =&gt; x.count &gt; 0);
  const x = [&#x27;Generation&#x27;], base = [0], y = [model.genDay], cols = [c.muted2], text = [`+${fmt(model.genDay, 1)}`], hover = [`Generation: +${fmt(model.genDay, 2)} Wh/day`];
  let running = model.genDay;
  dayModes.forEach(m =&gt; {
    const cons = m.count * m.totalM;
    running -= cons;
    x.push(`${m.label} ×${m.count}`); base.push(running); y.push(cons); cols.push(c.modes[m.key]);
    text.push(`−${fmt(cons, 1)}`); hover.push(`${m.fullLabel}: −${fmt(cons, 2)} Wh/day (${m.count} orbits × ${fmt(m.totalM, 3)} Wh)`);
  });
  const net = running;
  x.push(&#x27;Net balance&#x27;); base.push(0); y.push(net); cols.push(net &gt;= 0 ? c.good : c.critical);
  text.push(`${sgn(net)} ${net &gt;= 0 ? &#x27;✓&#x27; : &#x27;✕&#x27;}`); hover.push(`Net balance: ${sgn(net, 2)} Wh/day`);
  draw(&#x27;plotWaterfall&#x27;, [{ type:&#x27;bar&#x27;, x, y, base, text, textposition:&#x27;outside&#x27;, textfont:{ color:c.text, size:11 }, cliponaxis:false,
    marker:{ color:cols, line:{ color:c.panel, width:2 } }, width:0.55, hovertext:hover, hoverinfo:&#x27;text&#x27; }],
  baseLayout(c, { height:300, showlegend:false, margin:{ l:64, r:18, t:26, b:60 },
    xaxis:axis(c, { showgrid:false }), yaxis:axis(c, { title:&#x27;Energy [Wh/day]&#x27;, zeroline:true, zerolinecolor:c.muted }) }));
}

function tableHtml(title, head, rows){
  const th = head.map(h =&gt; `&lt;th&gt;${esc(h)}&lt;/th&gt;`).join(&#x27;&#x27;);
  const tr = rows.map(r =&gt; `&lt;tr&gt;${r.map(v =&gt; `&lt;td class=&quot;${v &amp;&amp; v.cls ? v.cls : &#x27;&#x27;}&quot;&gt;${esc(v &amp;&amp; v.t !== undefined ? v.t : v)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;);
  return `&lt;div class=&quot;table-title&quot;&gt;${esc(title)}&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;${th}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${tr}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
}
function renderTables(model, seq, batt){
  const t1 = tableHtml(&#x27;Mode summary (per orbit)&#x27;, [&#x27;Mode&#x27;, &#x27;Orbits/day&#x27;, &#x27;Sunlight Wh&#x27;, &#x27;Eclipse Wh&#x27;, &#x27;Total Wh&#x27;, &#x27;Total + margin Wh&#x27;, &#x27;Generated Wh&#x27;, &#x27;Saved Wh&#x27;, &#x27;Avg W sun&#x27;, &#x27;Avg W eclipse&#x27;, &#x27;Peak W&#x27;, &#x27;DoD %&#x27;],
    model.modes.map(m =&gt; [m.fullLabel, m.count, fmt(m.eSun, 3), fmt(m.eEcl, 3), fmt(m.total, 3), fmt(m.totalM, 3), fmt(model.genOrbit, 3), { t:sgn(m.savedPerOrbit, 3), cls:m.savedPerOrbit &gt;= 0 ? &#x27;pos&#x27; : &#x27;neg&#x27; }, fmt(m.avgSunW, 3), fmt(m.avgEclW, 3), fmt(m.peakW, 3), fmt(num(m.dod, 0) * 100, 2)]));
  const m = model.byKey[state.mode];
  const t2 = tableHtml(`Subsystems · ${m.fullLabel}`, [&#x27;Subsystem&#x27;, &#x27;Function&#x27;, &#x27;Power W&#x27;, &#x27;Duty sun %&#x27;, &#x27;Duty eclipse %&#x27;, &#x27;ON min sun&#x27;, &#x27;ON min eclipse&#x27;, &#x27;Wh sun&#x27;, &#x27;Wh eclipse&#x27;],
    m.rows.map(r =&gt; [r.name, GROUP_DEFS.find(g =&gt; g.key === r.group).label.split(&#x27; (&#x27;)[0], fmt(r.P, 3), fmt(r.dutySun * 100, 2), fmt(r.dutyEcl * 100, 2), fmt(r.minSun, 2), fmt(r.minEcl, 2), fmt(r.eSun, 4), fmt(r.eEcl, 4)]));
  const t3 = tableHtml(`Daily allocation (${state.order})`, [&#x27;Orbit&#x27;, &#x27;Mode&#x27;, &#x27;Battery start Wh&#x27;, &#x27;Battery end Wh&#x27;, &#x27;Net Wh&#x27;],
    batt.perOrbit.map(o =&gt; [o.orbit, model.byKey[o.mode].fullLabel, fmt(o.startE, 2), fmt(o.endE, 2), { t:sgn(o.endE - o.startE, 2), cls:(o.endE - o.startE) &gt;= 0 ? &#x27;pos&#x27; : &#x27;neg&#x27; }]));
  $(&#x27;tables&#x27;).innerHTML = t1 + t2 + t3;
}

function renderAll(){
  if (!state.model) return;
  const c = colors();
  const seq = buildSequence(state.model, state.order);
  const batt = simulateBattery(state.model, seq);
  renderBanner(state.model);
  renderKpis(state.model, batt);
  renderModeBar(state.model, c);
  renderTimeline(state.model, c);
  renderDaily(state.model, c, seq);
  renderPies(state.model, c);
  renderBattery(state.model, c, seq, batt);
  renderProfile(state.model, c);
  renderSensitivity(state.model, c);
  renderWaterfall(state.model, c);
  renderTables(state.model, seq, batt);

function extractJs(text){
  const m = String(text || &#x27;&#x27;).match(/(?:window\.)?powerBudgetData\s*=\s*([\s\S]*?)\s*;?\s*$/);
  return m ? JSON.parse(m[1]) : null;
}
function setLoaded(ok, label){
  $(&#x27;status-dot&#x27;).classList.toggle(&#x27;loaded&#x27;, ok);
  $(&#x27;load-status&#x27;).textContent = label;
}
function applyData(data, labels){
  const model = buildModel(data || {});
  if (!model) { setLoaded(false, &#x27;END-004 data found, but the orbit/subsystem model is incomplete&#x27;); return false; }
  state.data = data; state.model = model; state.labels = labels || {};
  const run = model.runId ? `${model.runId} · ` : &#x27;&#x27;;
  setLoaded(true, `${run}Loaded · ${model.modes.length} modes · ${model.modes[0].rows.length} subsystems`);
  if (labels &amp;&amp; (labels.product || labels.all)) $(&#x27;source-label&#x27;).textContent = `${labels.product || labels.all} · derived from power_budget_summary.json`;
  renderAll();
  return true;
}
async function loadFiles(files, labels){
  const arr = Array.from(files || []);
  const sj = arr.find(f =&gt; f.name.toLowerCase() === &#x27;power_budget_summary.json&#x27;);
  const js = arr.find(f =&gt; f.name.toLowerCase() === &#x27;power_budget_tables.js&#x27;);
  let data = null;
  try { if (sj) data = JSON.parse(await sj.text()); } catch (e) { console.warn(e); }
  try { if (!data &amp;&amp; js) data = extractJs(await js.text()); } catch (e) { console.warn(e); }
  if (!data) { setLoaded(false, &#x27;power_budget_summary.json not found in the selected folder&#x27;); return false; }
  return applyData(data, labels);
}
async function collect(handle, prefix = &#x27;&#x27;){
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === &#x27;file&#x27;) { const f = await entry.getFile(); f.relativeDisplayPath = `${prefix}${name}`; files.push(f); }
    else if (entry.kind === &#x27;directory&#x27;) files.push(...await collect(entry, `${prefix}${name}/`));
  }
  return files;
}
async function requestFolder(){
  if (window.parent &amp;&amp; window.parent !== window &amp;&amp; typeof window.parent.STAR_PICK_DIRECTORY === &#x27;function&#x27;) {
    const picked = await window.parent.STAR_PICK_DIRECTORY(&#x27;power&#x27;, &#x27;all&#x27;);
    if (picked &amp;&amp; picked.files) { await loadFiles(picked.files, { all:picked.label }); return; }
  }
  if (&#x27;showDirectoryPicker&#x27; in window) {
    try { const h = await window.showDirectoryPicker({ mode:&#x27;read&#x27;, id:&#x27;star-power-insights&#x27; }); await loadFiles(await collect(h, `${h.name}/`), { all:h.name }); return; }
    catch (e) { if (e &amp;&amp; e.name === &#x27;AbortError&#x27;) return; console.warn(e); }
  }
  $(&#x27;powerFolderInput&#x27;).click();
}

window.receivePowerInsightsFilesFromParent = async function(payload = {}, labels = {}){
  await loadFiles([...(payload.productFiles || []), ...(payload.resultFiles || [])], labels);
};
window.loadPowerInsightsData = applyData;   // direct feed (tests / scripting)

  $(&#x27;order-select&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; { state.order = e.target.value; renderAll(); });

function escapeHtml(value) {

    .replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;)

}

function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

function formatSecondsLabel(seconds) {
  if (seconds &gt;= 3600) {
    const hh = Math.floor(seconds / 3600);
    const mm = Math.floor((seconds % 3600) / 60);
    const ss = Math.floor(seconds % 60);
    return `${hh}:${String(mm).padStart(2,&#x27;0&#x27;)}:${String(ss).padStart(2,&#x27;0&#x27;)}`;
  }
  return seconds.toFixed(2);
}

function formatNumber(value, digits = 4) {

}

async function collectFilesFromDirectoryHandle(handle, pathPrefix = &#x27;&#x27;) {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === &#x27;file&#x27;) {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${pathPrefix}${name}`;
      files.push(file);
    } else if (entry.kind === &#x27;directory&#x27;) {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${pathPrefix}${name}/`));
    }
  }
  return files;
}

async function requestFolder(kind, inputId) {
  if (window.parent &amp;&amp; window.parent !== window &amp;&amp; typeof window.parent.STAR_PICK_DIRECTORY === &#x27;function&#x27;) {
    const picked = await window.parent.STAR_PICK_DIRECTORY(&#x27;reflectance&#x27;, kind);
    if (picked &amp;&amp; picked.files) {
      await loadSelectedFolder(kind, picked.files, picked.label || &#x27;STAR&#x27;);
      return;
    }
  }
  if (&#x27;showDirectoryPicker&#x27; in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode:&#x27;read&#x27;, id:&#x27;star-reflectance-picker&#x27; });
      const files = await collectFilesFromDirectoryHandle(handle, `${handle.name}/`);
      await loadSelectedFolder(kind, files, handle.name);
      return;
    } catch (error) {
      if (error &amp;&amp; error.name === &#x27;AbortError&#x27;) return;
      console.warn(&#x27;Directory picker failed; falling back to directory input:&#x27;, error);
    }
  }
  $(inputId).click();
}

function fileRelativePath(file) {
  return file.relativeDisplayPath || file.webkitRelativePath || file.name;
}

async function loadSelectedFolder(kind, files, label = &#x27;Selected folder&#x27;) {
  const fileArray = Array.from(files || []);
  if (kind === &#x27;csv&#x27;) await loadCSVFromFolderFiles(fileArray, label);
  if (kind === &#x27;frames&#x27;) await loadFramesFromFolderFiles(fileArray, label);
  if (kind === &#x27;kpi&#x27;) {
    await loadKpiFromFolderFiles(fileArray, label);
    await loadTimeSeriesFromFolderFiles(fileArray, label);
  }
  updateFileAccessPanel();
}

function fmtNum(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return String(n);
  if (v !== 0 &amp;&amp; Math.abs(v) &lt; 0.01) return v.toExponential(2);
  return v.toLocaleString(&#x27;en-US&#x27;, { maximumFractionDigits: 2 });
}

async function loadKpiFromFolderFiles(files, label) {
  const kpiFile = files.find(file =&gt; file.name.toLowerCase() === KPI_JSON_NAME);
  if (!kpiFile) {
    kpiData = null;
    fileStatus.kpi.loaded = false;
    fileStatus.kpi.path = `${label}: ${KPI_JSON_NAME} not found`;
    populateKpiTable();
    return;
  }
  try {
    kpiData = JSON.parse(await kpiFile.text());
    fileStatus.kpi.loaded = true;
    fileStatus.kpi.path = fileRelativePath(kpiFile);
  } catch (error) {
    kpiData = null;
    fileStatus.kpi.loaded = false;
    fileStatus.kpi.path = `${fileRelativePath(kpiFile)}: ${error.message}`;
  }
  populateKpiTable();
}

function populateKpiTable() {
  const container = $(&#x27;kpi-table&#x27;);
  if (!container) return;
  const kpis = kpiData &amp;&amp; Array.isArray(kpiData.kpis) ? kpiData.kpis : null;
  if (!kpis || !kpis.length) {
    container.innerHTML = &#x27;&lt;div class=&quot;empty-cell&quot;&gt;No KPI catalog loaded.&lt;/div&gt;&#x27;;
    return;
  }
  const catLabels = {
    run_validity: &#x27;Run Validity&#x27;,
    geometry_observability: &#x27;Geometry &amp; Observability&#x27;,
    light_curve_photometry: &#x27;Light Curve Photometry&#x27;,
    light_pollution_detectability: &#x27;Light Pollution &amp; Detectability&#x27;
  };
  const cats = [...new Set(kpis.map((k) =&gt; k.category))];
  container.innerHTML = cats.map((cat) =&gt; {
    const rows = kpis.filter((k) =&gt; k.category === cat).map((k) =&gt; {
      let cls = &#x27;neutral&#x27;;
      if (k.meets_requirement === true) cls = &#x27;ok&#x27;; else if (k.meets_requirement === false) cls = &#x27;bad&#x27;;
      let valueText = (k.value === null || k.value === undefined) ? &#x27;—&#x27; : (typeof k.value === &#x27;number&#x27; ? fmtNum(k.value) : String(k.value));
      if (k.unit &amp;&amp; k.unit !== &#x27;-&#x27; &amp;&amp; valueText !== &#x27;—&#x27;) valueText += &#x27; &#x27; + k.unit;
      let thr = &#x27;&#x27;;
      if (k.threshold_ok !== null &amp;&amp; k.threshold_ok !== undefined &amp;&amp; k.threshold_bad !== null &amp;&amp; k.threshold_bad !== undefined) {
        thr = `&lt;span class=&quot;kpi-threshold&quot;&gt;thresholds: ok ${fmtNum(k.threshold_ok)} · bad ${fmtNum(k.threshold_bad)}&lt;/span&gt;`;
      } else if (k.threshold_ok !== null &amp;&amp; k.threshold_ok !== undefined) {
        thr = `&lt;span class=&quot;kpi-threshold&quot;&gt;threshold: ${fmtNum(k.threshold_ok)}&lt;/span&gt;`;
      }
      return `&lt;div class=&quot;data-row&quot;&gt;&lt;span class=&quot;data-label&quot;&gt;${escapeHtml(k.id)} · ${escapeHtml(k.name)}&lt;/span&gt;&lt;span class=&quot;data-value ${cls}&quot;&gt;${escapeHtml(valueText)}${thr}&lt;/span&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    return `&lt;div class=&quot;kpi-category&quot;&gt;&lt;h4&gt;${escapeHtml(catLabels[cat] || cat)}&lt;/h4&gt;${rows}&lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

function drawGeometryCharts() {
  if (typeof Plotly === &#x27;undefined&#x27;) return;
  const ids = [&#x27;plot-elevation&#x27;, &#x27;plot-range&#x27;, &#x27;plot-phase&#x27;, &#x27;plot-magnitude&#x27;];
  const ts = timeSeriesData;
  if (!ts || !Array.isArray(ts.time_iso) || !ts.time_iso.length) {
    ids.forEach((id) =&gt; {
      const el = $(id);
      if (el) el.innerHTML = &#x27;&lt;div class=&quot;empty-cell&quot;&gt;No time series data loaded.&lt;/div&gt;&#x27;;
    });
    return;
  }
  const c = themeColors();
  const base = {
    paper_bgcolor: &#x27;transparent&#x27;,
    plot_bgcolor: c.plotBg,
    font: { color: c.text, family: &quot;&#x27;Space Mono&#x27;,monospace&quot;, size: 11 },
    margin: { l: 58, r: 16, t: 10, b: 40 },
    xaxis: { title: &#x27;Time (UTC)&#x27;, gridcolor: c.border, type: &#x27;date&#x27; }
  };
  const opts = { responsive: true, displayModeBar: false };
  const x = ts.time_iso;

  Plotly.newPlot(&#x27;plot-elevation&#x27;,
    [{ x, y: ts.elevation_deg, mode: &#x27;lines&#x27;, line: { color: c.accent, width: 2 } }],
    { ...base, yaxis: { title: &#x27;Elevation (deg)&#x27;, gridcolor: c.border } }, opts);

  Plotly.newPlot(&#x27;plot-range&#x27;,
    [{ x, y: ts.range_km, mode: &#x27;lines&#x27;, line: { color: c.accent2, width: 2 } }],
    { ...base, yaxis: { title: &#x27;Range (km)&#x27;, gridcolor: c.border } }, opts);

  Plotly.newPlot(&#x27;plot-phase&#x27;,
    [{ x, y: ts.phase_angle_deg, mode: &#x27;lines&#x27;, line: { color: c.accent, width: 2 } }],
    { ...base, yaxis: { title: &#x27;Phase Angle (deg)&#x27;, gridcolor: c.border } }, opts);

  // Astronomical convention: brighter (lower magnitude) at the top.
  Plotly.newPlot(&#x27;plot-magnitude&#x27;,
    [{ x, y: ts.apparent_magnitude_std, mode: &#x27;lines&#x27;, line: { color: c.accent2, width: 2 } }],
    { ...base, yaxis: { title: &#x27;Apparent magnitude (est.)&#x27;, gridcolor: c.border, autorange: &#x27;reversed&#x27; } }, opts);
}

async function loadCSVFromFolderFiles(files, label) {
  const csvFile = files.find(file =&gt; file.name.toLowerCase() === &#x27;flux.csv&#x27;)
    || files.find(file =&gt; /\.(csv|txt)$/i.test(file.name));

  if (!csvFile) {
    fileStatus.csv.loaded = false;
    fileStatus.csv.path = `${label}: flux.csv not found`;
    return;
  }

  try {
    const text = await csvFile.text();
    parseCSVText(text);
    fileStatus.csv.loaded = true;
    fileStatus.csv.path = fileRelativePath(csvFile);
  } catch (error) {
    fileStatus.csv.loaded = false;
    fileStatus.csv.path = `${fileRelativePath(csvFile)}: ${error.message}`;
  }
}

async function loadFramesFromFolderFiles(files, label) {
  const imageFiles = files
    .filter(file =&gt; /\.(png|jpg|jpeg|webp)$/i.test(file.name))
    .sort((a, b) =&gt; a.name.localeCompare(b.name, undefined, { numeric:true }));

  if (!imageFiles.length) {
    fileStatus.frames.loaded = false;
    fileStatus.frames.count = 0;
    fileStatus.frames.path = `${label}: no PNG/JPG/WEBP frames found`;
    resetFramesOnly();
    return;
  }

  loadFramesFromFiles(imageFiles, label);
  fileStatus.frames.loaded = true;
  fileStatus.frames.count = imageFiles.length;
  fileStatus.frames.path = `${label}: ${imageFiles.length} image frame(s)`;
}

/* ---------------------------
   CSV parsing
   --------------------------- */
function parseCSVText(raw) {
  const lines = String(raw)
    .replace(/\r\n/g,&#x27;\n&#x27;)
    .replace(/\r/g,&#x27;\n&#x27;)
    .split(&#x27;\n&#x27;)
    .map(line =&gt; line.trim())
    .filter(Boolean);

  if (!lines.length) return;

  const parsed = [];
  let dateCount = 0;

  for (const line of lines) {
    const parts = line.split(/[,;\t]+/).map(part =&gt; part.trim());
    if (parts.length &lt; 2) continue;

    const first = parts[0];
    const second = parts[1];
    const timeNumber = Number(first);
    const fluxNumber = Number(second);

    if (!Number.isFinite(fluxNumber)) continue;

    if (Number.isFinite(timeNumber) &amp;&amp; first !== &#x27;&#x27;) {
      parsed.push({ rawT:timeNumber, flux:fluxNumber });
    } else {
      const ms = Date.parse(first);
      if (!Number.isNaN(ms)) {
        parsed.push({ rawT:ms, flux:fluxNumber, isDate:true });
        dateCount += 1;
      }
    }
  }

  if (!parsed.length) return;

  const isDate = dateCount &gt; 0;
  parsed.sort((a, b) =&gt; a.rawT - b.rawT);
  csvData = isDate
    ? parsed.map(row =&gt; ({ t:(row.rawT - parsed[0].rawT) / 1000, flux:row.flux }))
    : parsed.map(row =&gt; ({ t:row.rawT, flux:row.flux }));

  csvIsTimeDate = isDate;
  updateFooter();
  resizeCanvas();
  drawChart();

  if (frameURLs.length) showFrame(currentFrameIdx &gt;= 0 ? currentFrameIdx : 0, { force:true });
}

/* ---------------------------
   Frame loading
   --------------------------- */
function revokeFrameURLs() {
  frameURLs.forEach(url =&gt; {
    if (String(url).startsWith(&#x27;blob:&#x27;)) {
      try { URL.revokeObjectURL(url); } catch (_) {}
    }
  });
}

function resetFramesOnly() {
  revokeFrameURLs();
  frameFiles = [];
  frameURLs = [];
  imgCache = [];

function loadFramesFromFiles(files, label = &#x27;Selected folder&#x27;) {

  frameURLs = frameFiles.map(file =&gt; URL.createObjectURL(file));
  imgCache = new Array(frameURLs.length).fill(null);
  currentFrameIdx = -1;
  resetImageTransform();
  loadProgress.style.width = &#x27;0%&#x27;;

  let loaded = 0;
  for (let i = 0; i &lt; frameURLs.length; i += 1) {
    const img = new Image();
    img.decoding = &#x27;async&#x27;;
    img.src = frameURLs[i];
    img.onload = () =&gt; {
      imgCache[i] = img;
      loaded += 1;
      loadProgress.style.width = `${Math.round(loaded / frameURLs.length * 100)}%`;
      if (loaded === 1 &amp;&amp; currentFrameIdx === -1) showFrame(0, { noFade:true });
      if (loaded === frameURLs.length) setTimeout(() =&gt; { loadProgress.style.width = &#x27;0%&#x27;; }, 250);
    };
    img.onerror = () =&gt; {
      loaded += 1;
      loadProgress.style.width = `${Math.round(loaded / frameURLs.length * 100)}%`;
    };
  }

  ftFrames.textContent = frameURLs.length || &#x27;—&#x27;;
  updateFooter();
  drawChart();
}

function loadFramesFromURLs(urls, fileNames) {
  revokeFrameURLs();

  frameFiles = fileNames.map(name =&gt; ({ name }));
  imgCache = new Array(frameURLs.length).fill(null);
  currentFrameIdx = -1;
  resetImageTransform();

  let loaded = 0;
  for (let i = 0; i &lt; frameURLs.length; i += 1) {

    img.decoding = &#x27;async&#x27;;
    img.src = frameURLs[i];
    img.onload = () =&gt; {
      imgCache[i] = img;
      loaded += 1;
      loadProgress.style.width = `${Math.round(loaded / frameURLs.length * 100)}%`;
      if (loaded === 1 &amp;&amp; currentFrameIdx === -1) showFrame(0, { noFade:true });
      if (loaded === frameURLs.length) setTimeout(() =&gt; { loadProgress.style.width = &#x27;0%&#x27;; }, 250);

  }

/* ---------------------------
   Default relative loading
   --------------------------- */
async function tryFetchText(urls) {
  const list = Array.isArray(urls) ? urls : [urls];
  const errors = [];

  for (const url of list) {
    try {
      const response = await fetch(url, { cache:&#x27;no-store&#x27; });
      if (response.ok) return await response.text();
      errors.push(`${url}: HTTP ${response.status}`);
    } catch (error) {
      errors.push(`${url}: ${error.message}`);
    }
  }

  throw new Error(errors.join(&#x27; | &#x27;));
}

async function loadDefaultPaths() {
  try {
    const text = await tryFetchText([DEFAULT_CSV_PATH, ABSOLUTE_CSV_FILE]);
    parseCSVText(text);
    fileStatus.csv.loaded = true;
    fileStatus.csv.path = DEFAULT_CSV_PATH;
  } catch (error) {
    console.warn(&#x27;Default CSV loading failed. Manual folder selection is available:&#x27;, error);
    fileStatus.csv.loaded = false;
  }

  updateFileAccessPanel();

  try {
    await loadDefaultFramesByPattern();
  } catch (error) {
    console.warn(&#x27;Default frame loading failed. Manual folder selection is available:&#x27;, error);
    fileStatus.frames.loaded = false;
    updateFileAccessPanel();
  }

  try {
    const text = await tryFetchText([DEFAULT_KPI_PATH, ABSOLUTE_KPI_FILE]);
    kpiData = JSON.parse(text);
    fileStatus.kpi.loaded = true;
    fileStatus.kpi.path = DEFAULT_KPI_PATH;
  } catch (error) {
    console.warn(&#x27;Default KPI catalog loading failed. Manual folder selection is available:&#x27;, error);
    kpiData = null;
    fileStatus.kpi.loaded = false;
  }
  populateKpiTable();

  try {
    const text = await tryFetchText([DEFAULT_TIMESERIES_PATH, ABSOLUTE_TIMESERIES_FILE]);
    timeSeriesData = JSON.parse(text);
    fileStatus.timeseries.loaded = true;
    fileStatus.timeseries.path = DEFAULT_TIMESERIES_PATH;
  } catch (error) {
    console.warn(&#x27;Default time series loading failed. Manual folder selection is available:&#x27;, error);
    timeSeriesData = null;
    fileStatus.timeseries.loaded = false;
  }
  drawGeometryCharts();
  updateFileAccessPanel();
}

function framePatterns() {
  const patterns = [];
  const stems = [&#x27;frame_&#x27;, &#x27;Frame_&#x27;, &#x27;&#x27;];
  const extensions = [&#x27;png&#x27;, &#x27;jpg&#x27;, &#x27;jpeg&#x27;, &#x27;webp&#x27;];
  const widths = [4, 3, 2, 0];
  const starts = [0, 1];

  for (const ext of extensions) {
    for (const stem of stems) {
      for (const width of widths) {
        for (const start of starts) {
          patterns.push({
            start,
            name: (idx) =&gt; `${stem}${width ? String(idx).padStart(width, &#x27;0&#x27;) : String(idx)}.${ext}`
          });
        }
      }
    }
  }
  return patterns;
}

async function urlExists(url) {
  try {
    const response = await fetch(url, { method:&#x27;HEAD&#x27;, cache:&#x27;no-store&#x27; });
    if (response.ok) return true;
  } catch (_) {}

  try {
    const response = await fetch(url, { cache:&#x27;no-store&#x27; });
    return response.ok;
  } catch (_) {
    return false;
  }
}

async function loadDefaultFramesByPattern() {
  let active = null;
  for (const pattern of framePatterns()) {
    const probe = DEFAULT_FRAMES_PATH + pattern.name(pattern.start);
    if (await urlExists(probe)) {
      active = pattern;
      break;
    }
  }

  if (!active) return;

  const urls = [];
  const names = [];
  const maxFrames = csvData.length ? Math.min(Math.max(csvData.length, 1), 20000) : 20000;
  let missingCount = 0;
  let idx = active.start;

  while (urls.length &lt; maxFrames &amp;&amp; missingCount &lt; 3) {
    const name = active.name(idx);
    const url = DEFAULT_FRAMES_PATH + name;
    if (await urlExists(url)) {
      urls.push(url);
      names.push(name);
      missingCount = 0;
    } else {
      missingCount += 1;
    }
    idx += 1;
  }

  if (urls.length) {
    loadFramesFromURLs(urls, names);
  }
}

/* ---------------------------
   Canvas chart
   --------------------------- */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = chartContainer.clientWidth;
  const cssHeight = chartContainer.clientHeight;
  chartCanvas.width = Math.max(1, Math.round(cssWidth * dpr));
  chartCanvas.height = Math.max(1, Math.round(cssHeight * dpr));
  chartCanvas.style.width = `${cssWidth}px`;
  chartCanvas.style.height = `${cssHeight}px`;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawChart();
}

function getPlotDims() {
  const dpr = window.devicePixelRatio || 1;
  const W = chartCanvas.width / dpr;
  const H = chartCanvas.height / dpr;
  return { W, H, pw: W - PAD.left - PAD.right, ph: H - PAD.top - PAD.bottom };
}

function findNearestIndexByTime(arr, t) {
  if (!arr.length) return 0;
  let low = 0;
  let high = arr.length - 1;

  while (high - low &gt; 8) {
    const mid = Math.floor((low + high) / 2);
    if (arr[mid].t &lt; t) low = mid;
    else high = mid;
  }

  let best = low;
  let bestDistance = Math.abs(arr[low].t - t);
  for (let i = low + 1; i &lt;= high; i += 1) {
    const distance = Math.abs(arr[i].t - t);
    if (distance &lt; bestDistance) {
      best = i;
      bestDistance = distance;
    }
  }
  return best;
}

function drawChart(cursorX) {
  const c = themeColors();
  const { W, H, pw, ph } = getPlotDims();

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = c.plotBg;
  ctx.fillRect(0,0,W,H);

  if (!csvData.length) {
    ctx.fillStyle = c.muted;
    ctx.font = &#x27;12px Space Mono, monospace&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;Load flux.csv to display the flux time series&#x27;, W / 2, H / 2);
    return;
  }

  const tMin = csvData[0].t;
  const tMax = csvData[csvData.length - 1].t;
  const fluxValues = csvData.map(row =&gt; row.flux);
  const fluxMin = Math.min(...fluxValues);
  const fluxMax = Math.max(...fluxValues);
  const fluxPad = (fluxMax - fluxMin) * 0.08 || 1;
  const yMin = fluxMin - fluxPad;
  const yMax = fluxMax + fluxPad;

  ctx.strokeStyle = c.border;
  ctx.lineWidth = 1;

  const yTicks = 6;
  for (let i = 0; i &lt;= yTicks; i += 1) {
    const y = PAD.top + (1 - i / yTicks) * ph;
    ctx.beginPath();
    ctx.moveTo(PAD.left, y);
    ctx.lineTo(PAD.left + pw, y);
    ctx.stroke();
  }

  const xTicks = 6;
  for (let i = 0; i &lt;= xTicks; i += 1) {
    const x = PAD.left + (i / xTicks) * pw;
    ctx.beginPath();
    ctx.moveTo(x, PAD.top);
    ctx.lineTo(x, PAD.top + ph);
    ctx.stroke();
  }

  ctx.strokeStyle = c.muted;
  ctx.beginPath();
  ctx.rect(PAD.left, PAD.top, pw, ph);
  ctx.stroke();

  ctx.fillStyle = c.muted;
  ctx.font = &#x27;11px Space Mono, monospace&#x27;;
  ctx.textAlign = &#x27;right&#x27;;
  for (let i = 0; i &lt;= yTicks; i += 1) {
    const flux = yMin + (yMax - yMin) * i / yTicks;
    const y = PAD.top + (1 - (flux - yMin) / (yMax - yMin || 1)) * ph;
    ctx.fillText(flux.toFixed(2), PAD.left - 8, y + 4);
  }

  ctx.textAlign = &#x27;center&#x27;;
  for (let i = 0; i &lt;= xTicks; i += 1) {
    const t = tMin + (tMax - tMin) * i / xTicks;
    const x = PAD.left + (t - tMin) / (tMax - tMin || 1) * pw;
    ctx.fillText(formatSecondsLabel(t), x, PAD.top + ph + 18);
  }

  ctx.beginPath();
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 2;
  ctx.lineJoin = &#x27;round&#x27;;
  for (let i = 0; i &lt; csvData.length; i += 1) {
    const x = PAD.left + (csvData[i].t - tMin) / (tMax - tMin || 1) * pw;
    const y = PAD.top + (1 - (csvData[i].flux - yMin) / (yMax - yMin || 1)) * ph;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  if (frameURLs.length &gt; 1) {
    ctx.strokeStyle = c.accent2;
    for (let i = 0; i &lt; frameURLs.length; i += 1) {
      const frac = i / (frameURLs.length - 1);
      const x = PAD.left + frac * pw;
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.moveTo(x, PAD.top + ph);
      ctx.lineTo(x, PAD.top + ph + 6);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  if (typeof cursorX === &#x27;number&#x27;) {
    const clampedX = clamp(cursorX, PAD.left, PAD.left + pw);
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = c.accent;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(clampedX, PAD.top);
    ctx.lineTo(clampedX, PAD.top + ph);
    ctx.stroke();
    ctx.setLineDash([]);

    const tHover = tMin + (clampedX - PAD.left) / (pw || 1) * (tMax - tMin || 1);
    const idx = findNearestIndexByTime(csvData, tHover);
    const nearest = csvData[idx];
    const xNearest = PAD.left + (nearest.t - tMin) / (tMax - tMin || 1) * pw;
    const yNearest = PAD.top + (1 - (nearest.flux - yMin) / (yMax - yMin || 1)) * ph;

    ctx.beginPath();
    ctx.arc(xNearest, yNearest, 5, 0, Math.PI * 2);
    ctx.fillStyle = c.strong;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = c.accent;
    ctx.stroke();

    statT.textContent = nearest.t.toFixed(4);
    statFlux.textContent = nearest.flux.toFixed(4);

    if (frameURLs.length) {
      const frac = (nearest.t - tMin) / (tMax - tMin || 1);
      const frameIdx = clamp(Math.round(frac * (frameURLs.length - 1)), 0, frameURLs.length - 1);
      statFrame.textContent = `${frameIdx + 1}/${frameURLs.length}`;
      seekRange.max = Math.max(1, frameURLs.length - 1);
      seekRange.value = frameIdx;
    }
  }
}

/* ---------------------------
   Scrubbing
   --------------------------- */
function frameIndexFromCanvasX(x) {
  if (!frameURLs.length) return 0;
  const dims = getPlotDims();
  const clamped = clamp(x, PAD.left, PAD.left + dims.pw);
  const frac = (clamped - PAD.left) / (dims.pw || 1);
  return clamp(Math.round(frac * (frameURLs.length - 1)), 0, frameURLs.length - 1);
}

chartCanvas.addEventListener(&#x27;mousedown&#x27;, (event) =&gt; {
  if (!frameURLs.length) return;
  isScrubbing = true;
  stopPlayback();
  const rect = chartCanvas.getBoundingClientRect();
  showFrame(frameIndexFromCanvasX(event.clientX - rect.left));
});

window.addEventListener(&#x27;mousemove&#x27;, (event) =&gt; {
  if (!isScrubbing) return;
  const rect = chartCanvas.getBoundingClientRect();
  showFrame(frameIndexFromCanvasX(event.clientX - rect.left));
});

window.addEventListener(&#x27;mouseup&#x27;, () =&gt; {
  isScrubbing = false;
});

chartCanvas.addEventListener(&#x27;mousemove&#x27;, (event) =&gt; {
  if (isScrubbing) return;
  const rect = chartCanvas.getBoundingClientRect();
  drawChart(event.clientX - rect.left);
});

chartCanvas.addEventListener(&#x27;mouseleave&#x27;, () =&gt; {
  if (isScrubbing) return;
  drawChart();
  statT.textContent = &#x27;—&#x27;;
  statFlux.textContent = &#x27;—&#x27;;
  statFrame.textContent = &#x27;—&#x27;;
});

/* ---------------------------
   Frame display
   --------------------------- */
function ensureDisplayedImage() {
  let image = $(&#x27;displayed-img&#x27;);
  if (image) return image;

  image = document.createElement(&#x27;img&#x27;);
  image.id = &#x27;displayed-img&#x27;;
  image.alt = &#x27;frame&#x27;;
  frameDisplay.innerHTML = &#x27;&#x27;;
  frameDisplay.appendChild(image);
  return image;
}

function getXForFrameIndex(idx) {
  const dims = getPlotDims();
  if (!csvData.length) {
    const frac = frameURLs.length &gt; 1 ? idx / (frameURLs.length - 1) : 0;
    return PAD.left + frac * dims.pw;
  }

  const tMin = csvData[0].t;
  const tMax = csvData[csvData.length - 1].t;
  const frac = frameURLs.length &gt; 1 ? idx / (frameURLs.length - 1) : 0;
  const t = tMin + frac * (tMax - tMin || 1);
  return PAD.left + (t - tMin) / (tMax - tMin || 1) * dims.pw;
}

function showFrame(idx, options = {}) {
  if (!frameURLs.length) return;

  idx = clamp(Math.round(idx), 0, frameURLs.length - 1);
  if (idx === currentFrameIdx &amp;&amp; !options.force) return;

  const displayed = ensureDisplayedImage();
  const cached = imgCache[idx];

  if (cached &amp;&amp; cached.complete) displayed.src = cached.src;
  else displayed.src = frameURLs[idx];

  updateImageTransform();

  displayed.alt = frameFiles[idx]?.name || `frame-${idx + 1}`;
  frameCounter.textContent = `${idx + 1} / ${frameURLs.length}`;
  metaName.textContent = frameFiles[idx]?.name || &#x27;—&#x27;;
  metaIdx.textContent = idx + 1;

  if (csvData.length) {
    const frac = idx / Math.max(1, frameURLs.length - 1);
    const tMin = csvData[0].t;
    const tMax = csvData[csvData.length - 1].t;
    const t = tMin + frac * (tMax - tMin || 1);
    const nearestIdx = findNearestIndexByTime(csvData, t);
    metaTime.textContent = csvData[nearestIdx].t.toFixed(4);
    metaFlux.textContent = csvData[nearestIdx].flux.toFixed(4);
  } else {
    metaTime.textContent = &#x27;—&#x27;;
    metaFlux.textContent = &#x27;—&#x27;;
  }

  seekRange.max = Math.max(1, frameURLs.length - 1);
  seekRange.value = idx;
  statFrame.textContent = `${idx + 1}/${frameURLs.length}`;
  currentFrameIdx = idx;
  drawChart(getXForFrameIndex(idx));
}

  showFrame(currentFrameIdx &gt;= frameURLs.length - 1 ? (loopPlayback ? 0 : frameURLs.length - 1) : currentFrameIdx + 1);
});

seekRange.addEventListener(&#x27;input&#x27;, (event) =&gt; showFrame(Number(event.target.value)));
playBtn.addEventListener(&#x27;click&#x27;, () =&gt; isPlaying ? stopPlayback() : startPlayback());
speedSel.addEventListener(&#x27;change&#x27;, () =&gt; { speedMultiplier = Number(speedSel.value) || 1; });
fpsInput.addEventListener(&#x27;change&#x27;, () =&gt; { baseFrameInterval = 1000 / (Number(fpsInput.value) || 24); });
loopChk.addEventListener(&#x27;change&#x27;, () =&gt; { loopPlayback = loopChk.checked; });

loopChk.checked = true;
speedMultiplier = Number(speedSel.value) || 1;
baseFrameInterval = 1000 / (Number(fpsInput.value) || 24);

function startPlayback() {
  if (!frameURLs.length || isPlaying) return;
  isPlaying = true;
  playBtn.textContent = &#x27;Pause&#x27;;
  lastPlayTS = performance.now();
  accumulated = 0;
  playLoop(lastPlayTS);
}

function stopPlayback() {
  if (!isPlaying) return;
  isPlaying = false;
  playBtn.textContent = &#x27;Play&#x27;;
  if (playRequest) cancelAnimationFrame(playRequest);
  playRequest = null;
}

function playLoop(timestamp) {
  if (!isPlaying) return;
  playRequest = requestAnimationFrame(playLoop);
  const delta = timestamp - lastPlayTS;
  lastPlayTS = timestamp;
  accumulated += delta;
  const interval = baseFrameInterval / (speedMultiplier || 1);

  if (accumulated &gt;= interval) {
    const steps = Math.floor(accumulated / interval);
    accumulated -= steps * interval;
    let nextIndex = (currentFrameIdx &lt; 0 ? 0 : currentFrameIdx) + steps;

    if (nextIndex &gt; frameURLs.length - 1) {
      if (loopPlayback) nextIndex %= frameURLs.length;
      else nextIndex = frameURLs.length - 1;
    }

    showFrame(nextIndex);
  } else if (currentFrameIdx &gt;= 0 &amp;&amp; frameURLs.length &gt; 1) {
    const progress = accumulated / (interval || 1);
    const nextIdx = Math.min(frameURLs.length - 1, currentFrameIdx + 1);
    const x0 = getXForFrameIndex(currentFrameIdx);
    const x1 = getXForFrameIndex(nextIdx);
    drawChart(x0 + (x1 - x0) * progress);
  }
}

/* ---------------------------
   Footer
   --------------------------- */
function updateFooter() {
  ftPoints.textContent = csvData.length || &#x27;—&#x27;;
  ftFrames.textContent = frameURLs.length || &#x27;—&#x27;;

  if (csvData.length) {
    const tMin = csvData[0].t;
    const tMax = csvData[csvData.length - 1].t;
    const fluxValues = csvData.map(row =&gt; row.flux);
    ftTrange.textContent = `${tMin.toFixed(2)} → ${tMax.toFixed(2)}`;
    ftFluxRange.textContent = `${Math.min(...fluxValues).toFixed(2)} → ${Math.max(...fluxValues).toFixed(2)}`;
  } else {
    ftTrange.textContent = &#x27;—&#x27;;
    ftFluxRange.textContent = &#x27;—&#x27;;
  }
}

/* ---------------------------
   Drag and drop
   --------------------------- */
[&#x27;dragenter&#x27;,&#x27;dragover&#x27;].forEach(eventName =&gt; {
  window.addEventListener(eventName, event =&gt; event.preventDefault());
});

window.addEventListener(&#x27;drop&#x27;, async (event) =&gt; {
  event.preventDefault();
  const files = Array.from(event.dataTransfer.files || []);
  const csvs = files.filter(file =&gt; /\.(csv|txt)$/i.test(file.name));
  const imgs = files.filter(file =&gt; /\.(png|jpg|jpeg|webp)$/i.test(file.name));
  const kpiFile = files.find(file =&gt; file.name.toLowerCase() === KPI_JSON_NAME);
  const timeseriesFile = files.find(file =&gt; file.name.toLowerCase() === TIMESERIES_JSON_NAME);

  if (csvs.length) {
    await loadCSVFromFolderFiles(csvs, &#x27;Dropped files&#x27;);
    fileStatus.csv.loaded = true;
    fileStatus.csv.path = csvs[0].name;
  }

  if (imgs.length) {
    loadFramesFromFiles(imgs, &#x27;Dropped files&#x27;);
    fileStatus.frames.loaded = true;
    fileStatus.frames.count = imgs.length;
    fileStatus.frames.path = `${imgs.length} dropped image frame(s)`;
  }

  if (kpiFile) {
    await loadKpiFromFolderFiles([kpiFile], &#x27;Dropped files&#x27;);
  }

  if (timeseriesFile) {
    await loadTimeSeriesFromFolderFiles([timeseriesFile], &#x27;Dropped files&#x27;);
  }

  updateFileAccessPanel();
});


window.receiveReflectanceFilesFromParent = async function(payload = {}, labels = {}) {
  try {
    if (payload.csvFiles) await loadCSVFromFolderFiles(Array.from(payload.csvFiles || []), labels.csv || &#x27;RUN folder · END-010 flux output&#x27;);
    if (payload.frameFiles) await loadFramesFromFolderFiles(Array.from(payload.frameFiles || []), labels.frames || &#x27;RUN folder · END-010 rendered frames&#x27;);
    if (payload.kpiData) {
      kpiData = payload.kpiData;
      fileStatus.kpi.loaded = true;
      fileStatus.kpi.path = `${labels.results || &#x27;RUN folder · END-010 results&#x27;}: embedded KPI catalog`;
      populateKpiTable();
    } else if (payload.resultFiles) {
      await loadKpiFromFolderFiles(Array.from(payload.resultFiles || []), labels.results || &#x27;RUN folder · END-010 results&#x27;);
    }
    if (payload.timeSeriesData) {
      timeSeriesData = payload.timeSeriesData;
      fileStatus.timeseries.loaded = true;
      fileStatus.timeseries.path = `${labels.results || &#x27;RUN folder · END-010 results&#x27;}: embedded time series`;
      drawGeometryCharts();
    } else if (payload.resultFiles) {
      await loadTimeSeriesFromFolderFiles(Array.from(payload.resultFiles || []), labels.results || &#x27;RUN folder · END-010 results&#x27;);
    }
    updateFileAccessPanel();
    updateFooter();
    resizeCanvas();
    drawChart();
  } catch (error) {
    console.warn(&#x27;Unable to load END-010 data from the selected RUN folder:&#x27;, error);
  }
};
window.refreshReflectanceDashboard = function() {
  try { updateFileAccessPanel(); updateFooter(); populateKpiTable(); drawGeometryCharts(); resizeCanvas(); drawChart(); if (currentFrameIdx &gt;= 0) showFrame(currentFrameIdx, { force:true }); } catch (error) { console.warn(error); }
};

/* ---------------------------
   Input bindings
   --------------------------- */
csvFolderInput.addEventListener(&#x27;change&#x27;, async (event) =&gt; {
  await loadSelectedFolder(&#x27;csv&#x27;, event.target.files, &#x27;Selected CSV folder&#x27;);
  event.target.value = &#x27;&#x27;;
});

framesFolderInput.addEventListener(&#x27;change&#x27;, async (event) =&gt; {
  await loadSelectedFolder(&#x27;frames&#x27;, event.target.files, &#x27;Selected Frames folder&#x27;);
  event.target.value = &#x27;&#x27;;
});

kpiFolderInput.addEventListener(&#x27;change&#x27;, async (event) =&gt; {
  await loadSelectedFolder(&#x27;kpi&#x27;, event.target.files, &#x27;Selected Results folder&#x27;);
  event.target.value = &#x27;&#x27;;
});

$(&#x27;theme-switch&#x27;).addEventListener(&#x27;change&#x27;, event =&gt; setTheme(event.target.checked ? &#x27;light&#x27; : &#x27;dark&#x27;));

/* ---------------------------
   Initialisation
   --------------------------- */
function initialise() {
  setupTheme();
  updateFileAccessPanel();
  resizeCanvas();
  loadDefaultPaths();
}

window.addEventListener(&#x27;load&#x27;, () =&gt; {
  initialise();
  setTimeout(resizeCanvas, 80);
});
