:root[data-theme=&quot;light&quot;]{--bg:#f3f5f8;--panel:#fff;--panel-strong:#f8fafc;--panel-muted:#eef2f7;--border:#d9e0eb;--border-soft:rgba(45,55,72,.13);--text:#222b3b;--text-strong:#070b12;--muted:#667085;--muted-2:#475467;--accent:#667c00;--accent-2:#007a66;--danger:#bd2450;--success:#047857;--plot-bg:#fff;--shadow:0 18px 60px rgba(31,41,55,.12);color-scheme:light}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(circle at top left,rgba(77,255,195,.10),transparent 32rem),radial-gradient(circle at top right,rgba(232,255,71,.08),transparent 36rem),var(--bg);color:var(--text);font-family:&#x27;Space Mono&#x27;,ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;line-height:1.5}
button,input{font:inherit}
button{border:1px solid var(--border);background:var(--panel-strong);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .16s ease,border-color .16s ease}
button:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.primary-action{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07100d;font-weight:700}
.app-shell{width:min(1920px,100%);margin:0 auto;padding:18px}
.header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px;border:1px solid var(--border);border-radius:22px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:var(--shadow);position:sticky;top:12px;z-index:20;backdrop-filter:blur(18px)}
.header h1{margin:0;font-family:&#x27;Syne&#x27;,Inter,system-ui,sans-serif;font-size:clamp(19px,2vw,28px);line-height:1.05;color:var(--text-strong);letter-spacing:-.03em;text-transform:uppercase}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.theme-toggle{display:inline-flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid var(--border);border-radius:999px;background:var(--panel-muted);color:var(--muted-2);user-select:none}
.switch{position:relative;width:48px;height:26px;display:inline-flex;align-items:center}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.22s ease;box-shadow:inset 0 0 0 1px var(--border-soft)}
.slider:before{content:&#x27;&#x27;;position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--text-strong);transition:.22s ease}
.switch input:checked+.slider{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch input:checked+.slider:before{transform:translateX(22px);background:#07100d}
.dashboard-grid{display:grid;grid-template-columns:minmax(330px,430px) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.panel,.card{border:1px solid var(--border);background:color-mix(in srgb,var(--panel) 95%,transparent);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.sidebar{position:sticky;top:118px;max-height:calc(100vh - 136px);overflow-y:auto}
.panel-header,.card-header{padding:16px 18px;border-bottom:1px solid var(--border);background:var(--panel-strong);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-header h2,.card h3,.sidebar-section h2{margin:0;color:var(--text-strong);font-family:&#x27;Syne&#x27;,Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.sidebar-section{padding:18px}
.sidebar-section+.sidebar-section{border-top:1px solid var(--border)}
.sidebar-section h2{margin-bottom:12px}
.muted{color:var(--muted)}
.data-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border-soft)}
.data-row:last-child{border-bottom:0}
.data-label{color:var(--muted);font-size:12px}
.data-value{color:var(--accent);font-weight:700;text-align:right;overflow-wrap:anywhere}
.file-status-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--border-soft)}
.file-status-row:last-child{border-bottom:0}
.status-dot{width:11px;height:11px;margin-top:4px;border-radius:999px;background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.status-dot.loaded{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 18%,transparent)}
.file-title{color:var(--text-strong);font-weight:700}
.file-path{color:var(--muted);font-size:11px;overflow-wrap:anywhere;margin-top:3px}
.file-row-button{padding:7px 10px;border-radius:10px;font-size:11px;white-space:nowrap}
.hidden-file-input{display:none}
.main-content{display:flex;flex-direction:column;gap:18px;min-width:0}
.card-body{padding:8px}
.plot{width:100%;min-height:320px;background:var(--plot-bg);border-radius:16px;border:1px solid var(--border-soft);overflow:hidden}
.plot.small{min-height:300px}
.plot.space{height:500px;min-height:460px}
.plot.ground{height:430px}
.plot-grid{display:grid;gap:18px}
.plot-grid.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.plot-grid.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gallery-item{border:1px solid var(--border-soft);background:var(--panel-muted);border-radius:16px;overflow:hidden}
.gallery-item img{display:block;width:100%;height:auto;background:#fff}
.gallery-caption{padding:10px 12px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.status-message{color:var(--muted);border:1px dashed var(--border);border-radius:14px;background:var(--panel-muted);padding:12px;font-size:11px}
.empty-cell{color:var(--muted);text-align:center;padding:28px}
.data-value.ok{color:var(--success)}
.data-value.bad{color:var(--danger)}
.data-value.neutral{color:var(--muted-2)}
.kpi-category{margin-bottom:16px}
.kpi-category:last-child{margin-bottom:0}
.kpi-category h4{margin:0 0 8px;color:var(--text-strong);font-family:&#x27;Syne&#x27;,Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.kpi-threshold{font-size:10px;color:var(--muted);display:block;font-weight:400;text-align:right}
@media(max-width:1280px){.dashboard-grid{grid-template-columns:1fr}.sidebar{position:static;max-height:none}.plot-grid.three-col{grid-template-columns:1fr 1fr}}

const ABSOLUTE_DATA_DIR = &#x27;file:///C:/Users/s5oss/Desktop/software_s5lab/STAR/Output/RUN_XXXXX/modules_output/END-003/results_attitude_propagator/&#x27;;
const AUTO_INPUT_DIR = &#x27;./modules_output/END-003/&#x27;;

const DATA_JS = &#x27;attitude_propagation_plots_data.js&#x27;;

const state = {

  pngFiles: new Map(),
  kpiData: null,
  passes: null,
  fileStatus: {
    data: { loaded: false, path: AUTO_DATA_DIR + DATA_JS },

  }
};

const $ = (id) =&gt; document.getElementById(id);
const cssVar = (name) =&gt; getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const colors = () =&gt; ({

  accent: cssVar(&#x27;--accent&#x27;),
  accent2: cssVar(&#x27;--accent-2&#x27;)
});

function escapeHtml(value) {
  return String(value ?? &#x27;&#x27;).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;).replaceAll(&quot;&#x27;&quot;,&#x27;&amp;#039;&#x27;);
}
function readPath(obj, path, fallback = undefined) {
  return path.split(&#x27;.&#x27;).reduce((acc, key) =&gt; (acc &amp;&amp; acc[key] !== undefined ? acc[key] : undefined), obj) ?? fallback;
}
function fmt(v, d = 2, fallback = &#x27;—&#x27;) {
  const n = Number(v);
  return Number.isFinite(n) ? n.toFixed(d) : fallback;
}
function row(label, value) {
  return `&lt;div class=&quot;data-row&quot;&gt;&lt;span class=&quot;data-label&quot;&gt;${escapeHtml(label)}&lt;/span&gt;&lt;span class=&quot;data-value&quot;&gt;${escapeHtml(value)}&lt;/span&gt;&lt;/div&gt;`;
}

function setupTheme() {
  const saved = localStorage.getItem(&#x27;star-attitude-theme&#x27;) || &#x27;dark&#x27;;
  setTheme(saved === &#x27;light&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;, false);
}
function setTheme(theme, persist = true) {
  document.documentElement.dataset.theme = theme;
  if (persist) localStorage.setItem(&#x27;star-attitude-theme&#x27;, theme);
  $(&#x27;theme-switch&#x27;).checked = theme === &#x27;light&#x27;;
  $(&#x27;theme-label&#x27;).textContent = theme === &#x27;light&#x27; ? &#x27;Light&#x27; : &#x27;Dark&#x27;;
  drawDashboard();
}

function parseDataJs(text) {
  const match = String(text || &#x27;&#x27;).trim().match(/(?:window\.)?attitudePropagationData\s*=\s*([\s\S]*?)\s*;?\s*$/);
  if (!match) throw new Error(&#x27;The selected JavaScript file does not define window.attitudePropagationData.&#x27;);
  return JSON.parse(match[1]);
}
async function fetchJson(url) {
  const r = await fetch(url, { cache: &#x27;no-store&#x27; });
  if (!r.ok) throw new Error(`${url} returned HTTP ${r.status}`);
  return r.json();
}
async function fetchText(url) {
  const r = await fetch(url, { cache: &#x27;no-store&#x27; });
  if (!r.ok) throw new Error(`${url} returned HTTP ${r.status}`);
  return r.text();
}

async function collectFilesFromDirectoryHandle(handle, prefix = &#x27;&#x27;) {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === &#x27;file&#x27;) {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${prefix}${name}`;
      files.push(file);
    } else if (entry.kind === &#x27;directory&#x27;) {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${prefix}${name}/`));
    }
  }
  return files;
}
async function requestFolder(kind, inputId) {
  if (window.parent &amp;&amp; window.parent !== window &amp;&amp; typeof window.parent.STAR_PICK_DIRECTORY === &#x27;function&#x27;) {
    const picked = await window.parent.STAR_PICK_DIRECTORY(&#x27;attitude&#x27;, kind);
    if (picked &amp;&amp; picked.files) {
      await loadSelectedFolder(kind, picked.files, picked.label || &#x27;STAR&#x27;);
      return;
    }
  }
  if (&#x27;showDirectoryPicker&#x27; in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode: &#x27;read&#x27;, id: &#x27;star-attitude-folder&#x27;, startIn: &#x27;desktop&#x27; });
      const files = await collectFilesFromDirectoryHandle(handle, `${handle.name}/`);
      await loadSelectedFolder(kind, files, handle.name);
      return;
    } catch (error) {
      if (error &amp;&amp; error.name === &#x27;AbortError&#x27;) return;
      console.warn(&#x27;Directory picker failed; falling back to directory input:&#x27;, error);
    }
  }
  $(inputId).click();
}
function fileRelativePath(file) {
  return file.relativeDisplayPath || file.webkitRelativePath || file.name;
}
function findFile(files, name) {
  const target = name.toLowerCase();
  return files.find((file) =&gt; file.name.toLowerCase() === target) || null;
}
async function loadSelectedFolder(kind, files, label = &#x27;Selected folder&#x27;) {
  const array = Array.from(files || []);
  if (kind === &#x27;data&#x27;) await loadDataFromFiles(array, label);
  if (kind === &#x27;input&#x27;) await loadInputFromFiles(array, label);
  if (kind === &#x27;png&#x27;) loadPngFromFiles(array, label);
  if (kind === &#x27;kpi&#x27;) await loadKpiFromFiles(array, label);
  updateFileAccessPanel();
  drawDashboard();
}
async function loadDataFromFiles(files, label) {
  const js = findFile(files, DATA_JS);
  const json = findFile(files, DATA_JSON);
  try {
    if (js) {
      state.data = parseDataJs(await js.text());
      state.fileStatus.data = { loaded: true, path: fileRelativePath(js) };
    } else if (json) {
      state.data = JSON.parse(await json.text());
      state.fileStatus.data = { loaded: true, path: fileRelativePath(json) };
    } else {
      state.fileStatus.data.loaded = false;
      state.fileStatus.data.path = `${label}: ${DATA_JS} not found`;
    }
    if (state.data &amp;&amp; state.data.input &amp;&amp; !state.input) state.input = state.data.input;
    loadPngFromFiles(files, label);
    await loadKpiFromFiles(files, label);
  } catch (error) {
    state.fileStatus.data.loaded = false;
    state.fileStatus.data.path = `${label}: ${error.message}`;
  }
}
async function loadInputFromFiles(files, label) {
  const file = findFile(files, INPUT_JSON) || findFile(files, LEGACY_INPUT_JSON) || findFile(files, &#x27;STEP_002_END-003_input.json&#x27;);
  if (!file) {
    state.fileStatus.input.loaded = false;
    state.fileStatus.input.path = `${label}: ${INPUT_JSON} or ${LEGACY_INPUT_JSON} not found`;
    return;
  }
  try {
    state.input = JSON.parse(await file.text());
    state.fileStatus.input = { loaded: true, path: fileRelativePath(file) };
  } catch (error) {
    state.fileStatus.input.loaded = false;
    state.fileStatus.input.path = `${fileRelativePath(file)}: ${error.message}`;
  }
}
function loadPngFromFiles(files, label) {
  const pngs = files.filter((file) =&gt; /^0[1-6]_.+\.png$/i.test(file.name) || /\.png$/i.test(file.name));
  state.pngFiles.forEach((url) =&gt; URL.revokeObjectURL(url));
  state.pngFiles.clear();
  pngs.sort((a,b) =&gt; a.name.localeCompare(b.name, undefined, { numeric: true })).forEach((file) =&gt; {
    state.pngFiles.set(file.name, URL.createObjectURL(file));
  });
  state.fileStatus.png.loaded = state.pngFiles.size &gt; 0;
  state.fileStatus.png.count = state.pngFiles.size;
  state.fileStatus.png.path = state.pngFiles.size ? `${label}: ${state.pngFiles.size} PNG figure(s)` : `${label}: no PNG figures found`;
}
function fmtNum(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return String(n);
  if (v !== 0 &amp;&amp; Math.abs(v) &lt; 0.01) return v.toExponential(2);
  return v.toLocaleString(&#x27;en-US&#x27;, { maximumFractionDigits: 2 });
}
async function loadKpiFromFiles(files, label) {
  const file = findFile(files, KPI_JSON);
  if (!file) {
    state.kpiData = null;
    state.fileStatus.kpi.loaded = false;
    state.fileStatus.kpi.path = `${label}: ${KPI_JSON} not found`;
    populateKpiTable();
    return;
  }
  try {
    state.kpiData = JSON.parse(await file.text());
    state.fileStatus.kpi.loaded = true;
    state.fileStatus.kpi.path = fileRelativePath(file);
  } catch (error) {
    state.kpiData = null;
    state.fileStatus.kpi.loaded = false;
    state.fileStatus.kpi.path = `${fileRelativePath(file)}: ${error.message}`;
  }
  populateKpiTable();
}
async function loadPassesFromFiles(files) {

function passUtcParts(iso) {

function populateKpiTable() {
  const container = $(&#x27;kpi-table&#x27;);
  if (!container) return;
  const kpis = state.kpiData &amp;&amp; Array.isArray(state.kpiData.kpis) ? state.kpiData.kpis : null;
  if (!kpis || !kpis.length) {
    container.innerHTML = &#x27;&lt;div class=&quot;empty-cell&quot;&gt;No KPI catalog loaded.&lt;/div&gt;&#x27;;
    return;
  }
  const catLabels = {
    run_validity: &#x27;Run Validity&#x27;,
    pointing_performance: &#x27;Pointing Performance&#x27;,
    disturbance_environment: &#x27;Disturbance Environment&#x27;,
    momentum_and_rates: &#x27;Momentum and Rates&#x27;,
    pass_selection: &#x27;Pass Selection&#x27;
  };
  const cats = [...new Set(kpis.map((k) =&gt; k.category))];
  container.innerHTML = cats.map((cat) =&gt; {
    const rows = kpis.filter((k) =&gt; k.category === cat).map((k) =&gt; {
      let cls = &#x27;neutral&#x27;;
      if (k.meets_requirement === true) cls = &#x27;ok&#x27;; else if (k.meets_requirement === false) cls = &#x27;bad&#x27;;
      let valueText = (k.value === null || k.value === undefined) ? &#x27;—&#x27; : (typeof k.value === &#x27;number&#x27; ? fmtNum(k.value) : String(k.value));
      if (k.unit &amp;&amp; k.unit !== &#x27;-&#x27; &amp;&amp; valueText !== &#x27;—&#x27;) valueText += &#x27; &#x27; + k.unit;
      let thr = &#x27;&#x27;;
      if (k.threshold_ok !== null &amp;&amp; k.threshold_ok !== undefined &amp;&amp; k.threshold_bad !== null &amp;&amp; k.threshold_bad !== undefined) {
        thr = `&lt;span class=&quot;kpi-threshold&quot;&gt;thresholds: ok ${fmtNum(k.threshold_ok)} · bad ${fmtNum(k.threshold_bad)}&lt;/span&gt;`;
      }
      return `&lt;div class=&quot;data-row&quot;&gt;&lt;span class=&quot;data-label&quot;&gt;${escapeHtml(k.id)} · ${escapeHtml(k.name)}&lt;/span&gt;&lt;span class=&quot;data-value ${cls}&quot;&gt;${escapeHtml(valueText)}${thr}&lt;/span&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;);
    return `&lt;div class=&quot;kpi-category&quot;&gt;&lt;h4&gt;${escapeHtml(catLabels[cat] || cat)}&lt;/h4&gt;${rows}&lt;/div&gt;`;
  }).join(&#x27;&#x27;);
}

async function loadDefaultRelativeData() {
  try {
    const parentData = getParentAttitudeData();
    if (parentData) {
      state.data = JSON.parse(JSON.stringify(parentData));
      state.fileStatus.data.loaded = true;
      state.fileStatus.data.path = &#x27;RUN_XXXXX/modules_output/END-003/results_attitude_propagator/attitude_propagation_plots_data.js&#x27;;
    } else if (window.attitudePropagationData) {
      state.data = JSON.parse(JSON.stringify(window.attitudePropagationData));
      state.fileStatus.data.loaded = true;
      state.fileStatus.data.path = AUTO_DATA_DIR + DATA_JS;
    } else {
      let text = null;
      try { text = await fetchText(AUTO_DATA_DIR + DATA_JS); }
      catch (_) { text = await fetchText(ABSOLUTE_DATA_DIR + DATA_JS); }
      state.data = parseDataJs(text);
      state.fileStatus.data.loaded = true;
      state.fileStatus.data.path = AUTO_DATA_DIR + DATA_JS;
    }
    if (state.data?.input) state.input = state.data.input;
  } catch (error) {
    console.warn(&#x27;Dashboard data auto-load failed:&#x27;, error);
  }
  try {
    try { state.input = await fetchJson(AUTO_INPUT_DIR + INPUT_JSON); }
    catch (_) { state.input = await fetchJson(ABSOLUTE_INPUT_DIR + INPUT_JSON); }
    state.fileStatus.input.loaded = true;
  } catch (error) {
    if (state.data?.input) state.fileStatus.input.loaded = true;
    console.warn(&#x27;Input auto-load failed:&#x27;, error);
  }
  await loadDefaultPngs();
  updateFileAccessPanel();
  drawDashboard();
}
async function loadDefaultPngs() {
  const names = readPath(state.data, &#x27;png_outputs&#x27;, [&#x27;01_telemetry.png&#x27;,&#x27;02_tracking.png&#x27;,&#x27;03_angular_momentum.png&#x27;,&#x27;04_ground_track.png&#x27;,&#x27;05_orbit_3d_ecef.png&#x27;,&#x27;06_orbit_3d_eci.png&#x27;]);
  names.forEach((name) =&gt; state.pngFiles.set(name, AUTO_DATA_DIR + name));
  /* Local browsers often block fetch/HEAD on file:// URLs, while &lt;img&gt; can still render
     relative PNG files correctly. Therefore the gallery is populated optimistically. */
  state.fileStatus.png.loaded = state.pngFiles.size &gt; 0;
  state.fileStatus.png.count = state.pngFiles.size;
  state.fileStatus.png.path = AUTO_DATA_DIR + &#x27;01_telemetry.png … 06_orbit_3d_eci.png&#x27;;
}

async function loadFromStarRoot() {
  if (!(&#x27;showDirectoryPicker&#x27; in window)) {
    $(&#x27;data-folder-input&#x27;).click();
    return;
  }
  try {
    const root = await window.showDirectoryPicker({ mode: &#x27;read&#x27;, id: &#x27;star-root-attitude&#x27;, startIn: &#x27;desktop&#x27; });
    const inputHandle = await root.getDirectoryHandle(&#x27;Input&#x27;);
    const outputHandle = await root.getDirectoryHandle(&#x27;Output&#x27;);
    const resultsHandle = await outputHandle.getDirectoryHandle(&#x27;results_attitude_propagator&#x27;);
    await loadInputFromFiles(await collectFilesFromDirectoryHandle(inputHandle, `${root.name}/Input/`), `${root.name}/Input`);
    await loadDataFromFiles(await collectFilesFromDirectoryHandle(resultsHandle, `${root.name}/Output/results_attitude_propagator/`), `${root.name}/Output/results_attitude_propagator`);
    updateFileAccessPanel();
    drawDashboard();
  } catch (error) {
    if (error?.name !== &#x27;AbortError&#x27;) console.warn(&#x27;RUN folder loading failed:&#x27;, error);
  }
}


function getParentAttitudeData() {
  try {
    if (window.parent &amp;&amp; window.parent !== window &amp;&amp; window.parent.attitudePropagationData) return window.parent.attitudePropagationData;
  } catch (_) {}
  return null;
}
window.receiveAttitudeDataFromParent = function(data, sourceLabel = &#x27;Selected RUN folder&#x27;) {
  try {
    state.data = JSON.parse(JSON.stringify(data || {}));
    if (state.data &amp;&amp; state.data.input &amp;&amp; !state.input) state.input = state.data.input;
    state.fileStatus.data.loaded = Boolean(state.data);
    state.fileStatus.data.path = `${sourceLabel}/attitude_propagation_plots_data.js`;
    if (state.data &amp;&amp; state.data.input) {
      state.fileStatus.input.loaded = true;
      state.fileStatus.input.path = `${sourceLabel}: embedded input block`;
    }
    updateFileAccessPanel();
    drawDashboard();
    return true;
  } catch (error) {
    console.warn(&#x27;Unable to receive attitude data from the parent dashboard:&#x27;, error);
    return false;
  }
};

      loadPngFromFiles(resultFiles, labels.results || &#x27;Selected RUN attitude results folder&#x27;);
      await loadKpiFromFiles(resultFiles, labels.results || &#x27;Selected RUN attitude results folder&#x27;);
      await loadPassesFromFiles(resultFiles);
    }
    if (inputFiles.length) {
      await loadInputFromFiles(inputFiles, labels.input || &#x27;Selected RUN END-003 folder&#x27;);

function baseLayout(titleY, showLegend = true) {
  const c = colors();
  return {
    autosize:true,
    paper_bgcolor:c.panel,
    plot_bgcolor:c.plotBg,
    font:{color:c.text,family:&#x27;Space Mono, monospace&#x27;,size:10},
    margin:{t:16,b:36,l:54,r:10},
    xaxis:{title:&#x27;Time [h]&#x27;,gridcolor:c.border,zerolinecolor:c.border,automargin:true,autorange:true,fixedrange:false},
    yaxis:{title:titleY,gridcolor:c.border,zerolinecolor:c.border,automargin:true,autorange:true,fixedrange:false},
    showlegend:showLegend,
    legend:{
      orientation:&#x27;h&#x27;,
      x:0.01,
      y:0.99,
      xanchor:&#x27;left&#x27;,
      yanchor:&#x27;top&#x27;,
      font:{size:9},
      bgcolor:&#x27;rgba(9,10,13,.55)&#x27;,
      bordercolor:&#x27;rgba(114,125,151,.18)&#x27;,

      itemclick:&#x27;toggleothers&#x27;,

function lineTrace(name, x, y) {
  return { type:&#x27;scatter&#x27;, mode:&#x27;lines&#x27;, name, x, y, line:{width:2}, hovertemplate:`${name}&lt;br&gt;t=%{x:.3f} h&lt;br&gt;value=%{y:.6g}&lt;extra&gt;&lt;/extra&gt;` };
}
function linePlot(div, traces, yTitle, extra = {}) {
  const showLegend = Array.isArray(traces) &amp;&amp; traces.length &gt; 1;
  const base = baseLayout(yTitle, showLegend);
  const layout = { ...base, ...extra };
  layout.xaxis = { ...base.xaxis, ...(extra.xaxis || {}), autorange:true, fixedrange:false };
  layout.yaxis = { ...base.yaxis, ...(extra.yaxis || {}), autorange:true, fixedrange:false };
  const el = typeof div === &#x27;string&#x27; ? $(div) : div;
  Plotly.react(el, traces, layout, { responsive:true, displaylogo:false, scrollZoom:true, doubleClick:&#x27;autosize&#x27; })
    .then(() =&gt; Plotly.Plots.resize(el));
}
function drawTimeSeries() {
  const d = state.data;
  if (!d) return;
  const t = d.time_h || [];
  const w = d.angular_velocity_deg_s || [];
  const e = d.euler_angles_deg || [];
  const H = readPath(d, &#x27;angular_momentum.direction_eci&#x27;, []);

  linePlot(&#x27;plotAngularVelocity&#x27;, [0,1,2].map((i)=&gt;lineTrace([&#x27;w_x&#x27;,&#x27;w_y&#x27;,&#x27;w_z&#x27;][i],t,w.map(r=&gt;r?.[i]))), &#x27;Angular velocity [deg/s]&#x27;);
  linePlot(&#x27;plotEulerAngles&#x27;, [0,1,2].map((i)=&gt;lineTrace([&#x27;Z&#x27;,&#x27;Y&#x27;,&#x27;X&#x27;][i],t,e.map(r=&gt;r?.[i]))), &#x27;Euler angles [deg]&#x27;);

  const tor = d.torques || {};
  const torqueTraces = [
    lineTrace(&#x27;GG&#x27;, t, tor.gravity_gradient_Nm || []),
    lineTrace(&#x27;SRP&#x27;, t, tor.solar_radiation_pressure_Nm || []),
    lineTrace(&#x27;Drag&#x27;, t, tor.drag_Nm || [])
  ];
  linePlot(&#x27;plotTorquesLinear&#x27;, torqueTraces, &#x27;Torque [Nm]&#x27;);
  linePlot(&#x27;plotTorquesLog&#x27;, torqueTraces.map(tr =&gt; ({...tr, y:(tr.y || []).map(v=&gt;Math.max(Number(v)||0,1e-25))})), &#x27;Torque [Nm]&#x27;, { yaxis:{...baseLayout().yaxis,type:&#x27;log&#x27;,title:&#x27;Torque [Nm]&#x27;,range:[-15,-4]} });

  linePlot(&#x27;plotEnergy&#x27;, [lineTrace(&#x27;Rotational energy&#x27;, t, d.rotational_energy_J || [])], &#x27;Energy [J]&#x27;);
  linePlot(&#x27;plotAltitude&#x27;, [lineTrace(&#x27;Altitude&#x27;, t, d.altitude_km || [])], &#x27;Altitude [km]&#x27;);
  linePlot(&#x27;plotElevation&#x27;, [lineTrace(&#x27;Elevation&#x27;, t, d.elevation_deg || [])], &#x27;Elevation [deg]&#x27;);
  linePlot(&#x27;plotNadirOffset&#x27;, [lineTrace(&#x27;Nadir offset&#x27;, t, d.nadir_offset_deg || [])], &#x27;Nadir offset [deg]&#x27;);
  linePlot(&#x27;plotTargetOffset&#x27;, [lineTrace(&#x27;Target offset&#x27;, t, d.target_offset_deg || [])], &#x27;Target offset [deg]&#x27;);
  linePlot(&#x27;plotHMag&#x27;, [lineTrace(&#x27;|H|&#x27;, t, readPath(d,&#x27;angular_momentum.magnitude_Nms&#x27;,[]))], &#x27;|H| [Nms]&#x27;);
  linePlot(&#x27;plotHDir&#x27;, [0,1,2].map((i)=&gt;lineTrace([&#x27;H_x&#x27;,&#x27;H_y&#x27;,&#x27;H_z&#x27;][i],t,H.map(r=&gt;r?.[i]))), &#x27;Direction components&#x27;);
}

function latLonToXyz(lon, lat, r) {
  const lambda = lon * Math.PI / 180;
  const phi = lat * Math.PI / 180;
  const c = Math.cos(phi);
  return [r * c * Math.cos(lambda), r * c * Math.sin(lambda), r * Math.sin(phi)];
}
function asArray(value) {
  if (Array.isArray(value)) return value;
  if (value &amp;&amp; typeof value === &#x27;object&#x27;) return [value];
  return [];
}
function validVec3(row) {

}
function vecColumn(rows, index) {
  return rows.filter(validVec3).map(row =&gt; Number(row[index]));
}

const EARTH_MAP=EARTH_MAP_ROWS.map(row=&gt;Array.from(row,ch=&gt;Number(ch)));
function sampleEarthMap(lat,lon){const rows=EARTH_MAP.length,cols=EARTH_MAP[0].length;const normalizedLon=((lon+180)%360+360)%360;const u=normalizedLon/360*(cols-1);const v=(90-lat)/180*(rows-1);const i0=Math.max(0,Math.min(rows-1,Math.round(v)));const j0=Math.max(0,Math.min(cols-1,Math.round(u)));return EARTH_MAP[i0][j0];}
function earthSurface(r){const rows=EARTH_SURFACE_ROWS,cols=EARTH_SURFACE_COLS,x=[],y=[],z=[],surfacecolor=[];for(let i=0;i&lt;rows;i++){const lat=90-180*i/(rows-1),xr=[],yr=[],zr=[],cr=[];for(let j=0;j&lt;cols;j++){const lon=-180+360*j/(cols-1),p=latLonToXyz(lon,lat,r);xr.push(p[0]);yr.push(p[1]);zr.push(p[2]);cr.push(sampleEarthMap(lat,lon));}x.push(xr);y.push(yr);z.push(zr);surfacecolor.push(cr);}return{type:&#x27;surface&#x27;,x,y,z,surfacecolor,cmin:0,cmax:2,colorscale:[[0,&#x27;#0b1b2f&#x27;],[.49,&#x27;#0b1b2f&#x27;],[.50,&#x27;#314229&#x27;],[.74,&#x27;#314229&#x27;],[.75,&#x27;#dce8ef&#x27;],[1,&#x27;#ffffff&#x27;]],showscale:false,opacity:1,hoverinfo:&#x27;skip&#x27;,lighting:{ambient:.9,diffuse:.65,specular:.05,roughness:.92},name:&#x27;High-resolution Earth land-ocean map&#x27;};}

function drawOrbit3D(div, frame) {
  const el = $(div);
  const d = state.data;
  const fallbackName = frame === &#x27;ECI&#x27; ? &#x27;06_orbit_3d_eci.png&#x27; : &#x27;05_orbit_3d_ecef.png&#x27;;
  if (!el) return;
  if (!d) {
    const url = state.pngFiles.get(fallbackName);
    el.innerHTML = url ? `&lt;div class=&quot;plot-fallback-wrap&quot;&gt;&lt;img class=&quot;plot-fallback-image&quot; src=&quot;${url}&quot; alt=&quot;${fallbackName}&quot;&gt;&lt;/div&gt;` : &#x27;&#x27;;
    return;
  }

  try {
    const c = colors();
    const site = d.site || {};
    const R = 6371;
    const fullRaw = frame === &#x27;ECI&#x27; ? readPath(d,&#x27;orbit.r_eci_km&#x27;,[]) : readPath(d,&#x27;orbit.r_ecef_km&#x27;,[]);
    const groundRaw = readPath(d,&#x27;orbit.r_ground_ecef_km&#x27;,[]);
    const full = asArray(fullRaw).filter(validVec3);
    const ground = asArray(groundRaw).filter(validVec3);

    if (!full.length) {
      el.innerHTML = &#x27;&lt;div class=&quot;empty-cell&quot;&gt;3D orbit vectors not available in attitude_propagation_plots_data.js.&lt;/div&gt;&#x27;;
      return;
    }

    const traces = [earthSurface(R)];
    traces[0].showlegend = false;

    traces.push({
      type:&#x27;scatter3d&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Orbit&#x27;,
      x:vecColumn(full,0), y:vecColumn(full,1), z:vecColumn(full,2),
      line:{color:c.muted,width:3}, hoverinfo:&#x27;skip&#x27;
    });

    if (frame === &#x27;ECEF&#x27; &amp;&amp; ground.length) {
      traces.push({
        type:&#x27;scatter3d&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Ground track&#x27;,
        x:vecColumn(ground,0), y:vecColumn(ground,1), z:vecColumn(ground,2),
        line:{color:c.accent2,width:2,dash:&#x27;dot&#x27;}, hoverinfo:&#x27;skip&#x27;
      });
    }

    asArray(readPath(d,&#x27;orbit.coverage&#x27;,[])).forEach((seg,i)=&gt;{
      const arrRaw = frame === &#x27;ECI&#x27; ? seg.r_eci_km : seg.r_ecef_km;
      const arr = asArray(arrRaw).filter(validVec3);
      if (arr.length) {
        traces.push({
          type:&#x27;scatter3d&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Coverage&#x27;, showlegend:i===0,
          x:vecColumn(arr,0), y:vecColumn(arr,1), z:vecColumn(arr,2),
          line:{color:c.accent,width:6}, hoverinfo:&#x27;skip&#x27;
        });
      }
      const gArr = asArray(seg.r_ground_ecef_km).filter(validVec3);
      if (frame === &#x27;ECEF&#x27; &amp;&amp; gArr.length) {
        traces.push({
          type:&#x27;scatter3d&#x27;, mode:&#x27;lines&#x27;, name:&#x27;Coverage ground&#x27;, showlegend:i===0,
          x:vecColumn(gArr,0), y:vecColumn(gArr,1), z:vecColumn(gArr,2),
          line:{color:&#x27;#ffb84d&#x27;,width:5}, hoverinfo:&#x27;skip&#x27;
        });
      }
    });

    const gs = Array.isArray(site.r_ecef_km) ? site.r_ecef_km : [];
    if (gs.length === 3) {
      traces.push({
        type:&#x27;scatter3d&#x27;, mode:&#x27;markers+text&#x27;, name:&#x27;Ground station&#x27;,
        x:[Number(gs[0])], y:[Number(gs[1])], z:[Number(gs[2])],
        text:[&#x27;GS&#x27;], marker:{size:5,color:&#x27;#ff5c7a&#x27;,symbol:&#x27;diamond&#x27;},
        textposition:&#x27;top center&#x27;, textfont:{color:&#x27;#ff5c7a&#x27;,family:&#x27;Space Mono&#x27;}
      });
    }

    const axis = {
      gridcolor:c.border, zerolinecolor:c.border, showbackground:false,
      autorange:true, fixedrange:false,
      tickfont:{color:c.muted,size:9}, titlefont:{color:c.text,size:10}
    };
    const layout = {
      autosize:true,
      paper_bgcolor:c.panel,
      plot_bgcolor:c.plotBg,
      font:{color:c.text,family:&#x27;Space Mono, monospace&#x27;,size:10},
      margin:{t:4,b:4,l:4,r:4},
      showlegend:true,
      legend:{orientation:&#x27;h&#x27;,x:0.01,y:0.99,xanchor:&#x27;left&#x27;,yanchor:&#x27;top&#x27;,font:{size:9},bgcolor:&#x27;rgba(9,10,13,.55)&#x27;,bordercolor:&#x27;rgba(114,125,151,.18)&#x27;,borderwidth:1},
      scene:{
        aspectmode:&#x27;cube&#x27;,
        camera:{eye:{x:1.35,y:1.35,z:1.04}},
        xaxis:{...axis,title:&#x27;X [km]&#x27;},
        yaxis:{...axis,title:&#x27;Y [km]&#x27;},
        zaxis:{...axis,title:&#x27;Z [km]&#x27;}
      }
    };

    Plotly.react(el, traces, layout, {responsive:true,displaylogo:false,scrollZoom:true,doubleClick:&#x27;autosize&#x27;})
      .then(() =&gt; Plotly.Plots.resize(el));
  } catch (error) {
    console.error(`Unable to render ${frame} 3D orbit:`, error);
    const url = state.pngFiles.get(fallbackName);
    el.innerHTML = url ? `&lt;div class=&quot;plot-fallback-wrap&quot;&gt;&lt;img class=&quot;plot-fallback-image&quot; src=&quot;${url}&quot; alt=&quot;${fallbackName}&quot;&gt;&lt;/div&gt;` : `&lt;div class=&quot;empty-cell&quot;&gt;3D render error: ${escapeHtml(error.message || error)}&lt;/div&gt;`;
  }
}

function populatePngGallery() {
  const gallery = $(&#x27;png-gallery&#x27;);
  if (!state.pngFiles.size) {
    gallery.innerHTML = &#x27;&lt;div class=&quot;empty-cell&quot;&gt;No PNG files loaded.&lt;/div&gt;&#x27;;
    return;
  }
  gallery.innerHTML = Array.from(state.pngFiles.entries()).map(([name,url]) =&gt; `&lt;div class=&quot;gallery-item&quot;&gt;&lt;img src=&quot;${url}&quot; alt=&quot;${escapeHtml(name)}&quot; data-name=&quot;${escapeHtml(name)}&quot;&gt;&lt;div class=&quot;gallery-caption&quot;&gt;${escapeHtml(name)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  gallery.querySelectorAll(&#x27;img&#x27;).forEach(img =&gt; img.addEventListener(&#x27;click&#x27;, () =&gt; openImageModal(img.src, img.dataset.name || img.alt || &#x27;MATLAB figure&#x27;)));
}

function showInteractiveDataMissingMessage() {
  const message = &#x27;&#x27;;
  const ids = [&#x27;plotAngularVelocity&#x27;,&#x27;plotEulerAngles&#x27;,&#x27;plotTorquesLinear&#x27;,&#x27;plotTorquesLog&#x27;,&#x27;plotEnergy&#x27;,&#x27;plotAltitude&#x27;,&#x27;plotElevation&#x27;,&#x27;plotNadirOffset&#x27;,&#x27;plotTargetOffset&#x27;,&#x27;plotHMag&#x27;,&#x27;plotHDir&#x27;,&#x27;plotGroundTrack&#x27;,&#x27;plotOrbitECI&#x27;,&#x27;plotOrbitECEF&#x27;];
  ids.forEach((id) =&gt; {

    el.innerHTML = `&lt;div class=&quot;empty-cell&quot;&gt;${message}&lt;/div&gt;`;
  });
}

function drawDashboard() {
  populateInputsPanel();
  populateSummary();
  populatePngGallery();
  populateKpiTable();

  if (!state.data) {
    showInteractiveDataMissingMessage();
    return;
  }

  drawTimeSeries();
  drawGroundTrack();
  drawOrbit3D(&#x27;plotOrbitECI&#x27;,&#x27;ECI&#x27;);
  drawOrbit3D(&#x27;plotOrbitECEF&#x27;,&#x27;ECEF&#x27;);
}


function openImageModal(src, caption = &#x27;&#x27;) {
  const modal = $(&#x27;image-modal&#x27;);
  const img = $(&#x27;image-modal-img&#x27;);
  const cap = $(&#x27;image-modal-caption&#x27;);
  if (!modal || !img) return;
  img.src = src;
  img.alt = caption || &#x27;MATLAB figure preview&#x27;;
  if (cap) cap.textContent = caption || &#x27;&#x27;;
  modal.classList.remove(&#x27;hidden&#x27;);
  modal.setAttribute(&#x27;aria-hidden&#x27;,&#x27;false&#x27;);
}
function closeImageModal() {

  const img = $(&#x27;image-modal-img&#x27;);
  if (!modal || !img) return;
  modal.classList.add(&#x27;hidden&#x27;);
  modal.setAttribute(&#x27;aria-hidden&#x27;,&#x27;true&#x27;);
  img.src = &#x27;&#x27;;
}

function bindEvents() {
  $(&#x27;theme-switch&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; setTheme(e.target.checked ? &#x27;light&#x27; : &#x27;dark&#x27;));
  $(&#x27;star-root-button&#x27;).addEventListener(&#x27;click&#x27;, loadFromStarRoot);

  $(&#x27;input-folder-input&#x27;).addEventListener(&#x27;change&#x27;, async (e)=&gt;{await loadSelectedFolder(&#x27;input&#x27;, e.target.files, &#x27;Selected input folder&#x27;); e.target.value=&#x27;&#x27;;});
  window.addEventListener(&#x27;resize&#x27;,()=&gt;[&#x27;plotAngularVelocity&#x27;,&#x27;plotEulerAngles&#x27;,&#x27;plotTorquesLinear&#x27;,&#x27;plotTorquesLog&#x27;,&#x27;plotEnergy&#x27;,&#x27;plotAltitude&#x27;,&#x27;plotElevation&#x27;,&#x27;plotNadirOffset&#x27;,&#x27;plotTargetOffset&#x27;,&#x27;plotHMag&#x27;,&#x27;plotHDir&#x27;,&#x27;plotGroundTrack&#x27;,&#x27;plotOrbitECI&#x27;,&#x27;plotOrbitECEF&#x27;].forEach(id=&gt;{const el=$(id);if(el?.data)Plotly.Plots.resize(el);}));

&lt;div class=&quot;page&quot;&gt;

  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;Collision Avoidance · Space Safety&lt;/h2&gt;
      &lt;div class=&quot;sub&quot; id=&quot;source-label&quot;&gt;END-016 · close approaches between the satellites of the END-001 constellation · orbital lifetime and post-mission disposal&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;span class=&quot;status-pill&quot;&gt;&lt;span id=&quot;status-dot&quot; class=&quot;status-dot&quot;&gt;&lt;/span&gt;&lt;span id=&quot;load-status&quot;&gt;No data loaded&lt;/span&gt;&lt;/span&gt;
      &lt;button id=&quot;manual-load&quot; class=&quot;primary-action&quot; type=&quot;button&quot;&gt;Select END-016 Folder&lt;/button&gt;

  &lt;div id=&quot;banner&quot; class=&quot;banner&quot; hidden&gt;&lt;/div&gt;
  &lt;div id=&quot;config&quot; class=&quot;chips&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;kpis&quot; class=&quot;kpis&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Closest approach between satellites&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Minimum distance of every pair over the window [km] · red = below the screening distance&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotPairs&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Distance over time&lt;/h3&gt;&lt;span class=&quot;hint&quot; id=&quot;hist-hint&quot;&gt;Closest pair · dashed = screening distance&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotHistory&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Orbital decay after the mission&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Mean altitude under drag (NRLMSISE-00) · dashed = disposal deadlines&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotDecay&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Disposal delta-v&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Perigee-lowering burn that brings the lifetime within each rule [m/s]&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotDv&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
  &lt;/div&gt;

  &lt;details class=&quot;tables&quot; id=&quot;tables-details&quot;&gt;
    &lt;summary&gt;Table view · close approaches, lifetime and disposal, model summary&lt;/summary&gt;
    &lt;div id=&quot;tables&quot;&gt;&lt;/div&gt;
  &lt;/details&gt;

&lt;script&gt;
(() =&gt; {
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
const SLOTS = [&#x27;--s1&#x27;,&#x27;--s2&#x27;,&#x27;--s3&#x27;,&#x27;--s4&#x27;,&#x27;--s5&#x27;,&#x27;--s6&#x27;,&#x27;--s7&#x27;,&#x27;--s8&#x27;];
const state = { summary:null, runInfo:null, labels:{} };

/* ---------- helpers ---------- */
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(v){ return String(v ?? &#x27;&#x27;).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;); }
function num(v){ if (v === null || v === undefined || v === &#x27;&#x27;) return NaN; if (v === &#x27;Inf&#x27; || v === Infinity) return Infinity; const x = Number(v); return Number.isFinite(x) ? x : NaN; }
function fmt(v, d = 1){ const x = num(v); return x === Infinity ? &#x27;&gt; 200&#x27; : (Number.isFinite(x) ? x.toFixed(d) : &#x27;—&#x27;); }
function fmtE(v){ const x = num(v); return Number.isFinite(x) ? (x === 0 ? &#x27;0&#x27; : x.toExponential(1)) : &#x27;—&#x27;; }
function colors(){
  return { text:css(&#x27;--text&#x27;), strong:css(&#x27;--text-strong&#x27;), muted:css(&#x27;--muted&#x27;), muted2:css(&#x27;--muted-2&#x27;), panelStrong:css(&#x27;--panel-strong&#x27;),
    border:css(&#x27;--border&#x27;), grid:css(&#x27;--border-soft&#x27;), thr:css(&#x27;--thr&#x27;), good:css(&#x27;--st-good&#x27;), critical:css(&#x27;--st-critical&#x27;), slots:SLOTS.map(css) };
}
function baseLayout(c, extra){
  return Object.assign({ paper_bgcolor:&#x27;rgba(0,0,0,0)&#x27;, plot_bgcolor:&#x27;rgba(0,0,0,0)&#x27;,
    font:{ family:&quot;&#x27;Space Mono&#x27;, ui-monospace, monospace&quot;, size:11, color:c.text }, margin:{ l:64, r:18, t:10, b:46 },
    hoverlabel:{ bgcolor:c.panelStrong, bordercolor:c.border, font:{ color:c.text, family:&quot;&#x27;Space Mono&#x27;, monospace&quot;, size:11 } },
    legend:{ orientation:&#x27;h&#x27;, x:0, y:1.16, font:{ size:11, color:c.text } } }, extra || {});
}
function axis(c, extra){ return Object.assign({ gridcolor:c.grid, zerolinecolor:c.grid, linecolor:c.border, tickcolor:c.border, tickfont:{ color:c.muted2, size:11 }, titlefont:{ color:c.muted2, size:11 } }, extra || {}); }
const PLOT_CFG = { responsive:true, displaylogo:false, displayModeBar:false };
function draw(id, traces, layout){ const el = $(id); if (!el || !window.Plotly) return; el.querySelectorAll(&#x27;.empty&#x27;).forEach(n =&gt; n.remove()); Plotly.react(el, traces, layout, PLOT_CFG); }
function empty(id, message){ const el = $(id); if (!el) return; if (window.Plotly) { try { Plotly.purge(el); } catch (_) {} } el.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${esc(message)}&lt;/div&gt;`; }
function asArray(x){ return Array.isArray(x) ? x : (x == null ? [] : [x]); }
function solarName(f){ const v = num(f); if (v &lt;= 90) return `low activity (F10.7 ${v})`; if (v &gt;= 180) return `high activity (F10.7 ${v})`; return `mean activity (F10.7 ${v})`; }
function kpi(label, value, unit, note, flag){
  return `&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;k-label&quot;&gt;${esc(label)}&lt;/div&gt;&lt;div class=&quot;k-value&quot;&gt;${value}&lt;span class=&quot;k-unit&quot;&gt;${esc(unit)}&lt;/span&gt;&lt;/div&gt;${note ? `&lt;div class=&quot;k-note&quot;&gt;${esc(note)}&lt;/div&gt;` : &#x27;&#x27;}${flag ? `&lt;div class=&quot;k-flag ${flag.cls}&quot;&gt;${flag.icon} ${esc(flag.text)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;`;
}

/* ---------- rendering ---------- */
function renderBanner(){
  const b = $(&#x27;banner&#x27;), s = state.summary, info = state.runInfo;
  if (!s &amp;&amp; !info) { b.hidden = true; return; }
  let cls = &#x27;good&#x27;, icon = &#x27;✓&#x27;, head = &#x27;&lt;b&gt;No safety issue found&lt;/b&gt;&#x27;;
  const items = [];
  if (info &amp;&amp; info.status &amp;&amp; info.status !== &#x27;completed&#x27;) {
    cls = info.status === &#x27;failed&#x27; ? &#x27;critical&#x27; : &#x27;warning&#x27;; icon = info.status === &#x27;failed&#x27; ? &#x27;✕&#x27; : &#x27;!&#x27;;
    head = `&lt;b&gt;END-016 ${esc(info.status)}&lt;/b&gt; — ${esc(info.evidence_text || &#x27;&#x27;)}`;
  } else if (s) {
    const k = s.kpis || {}, cfg = s.config || {};
    const rules = asArray(cfg.disposal_rules_years);
    if (num(k.n_events_below_screening) &gt; 0) items.push(`${k.n_events_below_screening} close approach(es) below ${fmt(cfg.screening_km, 0)} km between satellites of the constellation`);
    if (num(k.n_events_above_pc_threshold) &gt; 0) items.push(`${k.n_events_above_pc_threshold} with Pc above ${fmtE(cfg.pc_threshold)}`);
    for (const r of rules) {
      const ok = k[`complies_${r}y_rule_mean_activity`];
      if (ok === false) items.push(`${r}-year disposal rule not met at mean solar activity: disposal delta-v ${fmt(k[`disposal_dv_m_s_${r}y_rule_mean_activity`])} m/s`);
    }
    if (k.orbit_maintenance_needed) items.push(&#x27;the orbit decays before the end of the mission: orbit maintenance needed&#x27;);
    if (items.length) { cls = &#x27;warning&#x27;; icon = &#x27;!&#x27;; head = &#x27;&lt;b&gt;Space-safety findings&lt;/b&gt;&#x27;; }
    if (info &amp;&amp; info.evidence_text) head += ` — ${esc(info.evidence_text)}`;
  }
  const notes = (info &amp;&amp; info.notes) || [];
  b.className = `banner ${cls}`; b.hidden = false;
  b.innerHTML = `&lt;span class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;${icon}&lt;/span&gt;&lt;div&gt;${head}${items.length ? `&lt;ul&gt;${items.map(i =&gt; `&lt;li&gt;${esc(i)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;` : &#x27;&#x27;}${notes.length ? `&lt;div style=&quot;margin-top:6px;color:var(--muted-2);font-size:11px&quot;&gt;${notes.map(esc).join(&#x27; · &#x27;)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;`;
}
function renderConfig(){
  const info = state.runInfo, s = state.summary, el = $(&#x27;config&#x27;);
  const cfg = (s &amp;&amp; s.config) || (info &amp;&amp; info.config) || null;
  if (!cfg) { el.innerHTML = &#x27;&#x27;; return; }
  const prov = (info &amp;&amp; info.provenance) || {};
  const chips = [
    [&#x27;Mass&#x27;, `${fmt(cfg.mass_kg, 1)} kg`, prov[&#x27;spacecraft.mass_kg&#x27;]],
    [&#x27;Drag area · Cd&#x27;, `${fmt(cfg.drag_area_m2, 3)} m² · ${fmt(cfg.cd, 2)}`, prov[&#x27;spacecraft.drag_area_m2&#x27;]],
    [&#x27;Hard-body radius&#x27;, `${fmt(cfg.hard_body_radius_m, 2)} m`, prov.hard_body_radius_m],
    [&#x27;Position 1σ (R, T, N)&#x27;, `${asArray(cfg.position_sigma_rtn_m).map(x =&gt; fmt(x, 0)).join(&#x27; · &#x27;)} m`, prov.position_sigma_rtn_m],
    [&#x27;Screening distance&#x27;, `${fmt(cfg.screening_km, 0)} km`, prov.screening_km],
    [&#x27;Pc threshold&#x27;, fmtE(cfg.pc_threshold), prov.pc_threshold],
    [&#x27;Mission lifetime&#x27;, Number.isFinite(num(cfg.mission_lifetime_years)) ? `${fmt(cfg.mission_lifetime_years, 0)} y` : &#x27;not stated&#x27;, prov.mission_lifetime_years],
    [&#x27;Disposal rules&#x27;, asArray(cfg.disposal_rules_years).map(r =&gt; `${r} y`).join(&#x27; · &#x27;), prov.disposal_rules_years],
    [&#x27;Solar activity F10.7&#x27;, asArray(cfg.solar_f107).join(&#x27; · &#x27;), prov.solar_f107],
  ];
  el.innerHTML = chips.map(([l, v, p]) =&gt; `&lt;div class=&quot;chip&quot;&gt;&lt;div class=&quot;c-label&quot;&gt;${esc(l)}&lt;/div&gt;&lt;div class=&quot;c-value&quot;&gt;${esc(v)}&lt;/div&gt;&lt;div class=&quot;c-src&quot;&gt;${esc(p || &#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
}
function renderKpis(){
  const s = state.summary; if (!s) { $(&#x27;kpis&#x27;).innerHTML = &#x27;&#x27;; return; }
  const k = s.kpis || {}, cfg = s.config || {}, win = s.window || {};
  const rules = asArray(cfg.disposal_rules_years);
  const cards = [];
  if (num(k.n_pairs) &gt; 0) {
    const sep = num(k.min_separation_km), scr = num(cfg.screening_km);
    cards.push(kpi(&#x27;Minimum separation&#x27;, fmt(sep, sep &lt; 10 ? 3 : 0), &#x27;km&#x27;, `${k.min_separation_pair} · ${String(k.min_separation_tca_utc || &#x27;&#x27;).replace(&#x27;T&#x27;, &#x27; &#x27;).slice(0, 19)} UTC`,
      sep &lt; scr ? { cls:&#x27;critical&#x27;, icon:&#x27;✕&#x27;, text:`below the ${fmt(scr, 0)} km screening distance` } : { cls:&#x27;good&#x27;, icon:&#x27;✓&#x27;, text:`above the ${fmt(scr, 0)} km screening distance` }));
    cards.push(kpi(&#x27;Close approaches&#x27;, String(k.n_events_below_screening ?? 0), &#x27;&#x27;, `below ${fmt(scr, 0)} km in ${fmt(win.hours, 0)} h · ${fmt(k.events_per_day, 1)} per day · ${k.n_events_below_1km ?? 0} below 1 km`));
    cards.push(kpi(&#x27;Highest Pc&#x27;, fmtE(k.max_pc), &#x27;&#x27;, `declared uncertainty · worst case over any uncertainty ${fmtE(k.max_pc_max)}`,
      num(k.max_pc) &gt; num(cfg.pc_threshold) ? { cls:&#x27;critical&#x27;, icon:&#x27;✕&#x27;, text:`above ${fmtE(cfg.pc_threshold)}` } : { cls:&#x27;good&#x27;, icon:&#x27;✓&#x27;, text:`below ${fmtE(cfg.pc_threshold)}` }));
  } else {

async function loadFiles(files, labels){

      if (/^space_safety_summary\.json$/i.test(f.name)) data.summary = JSON.parse(await f.text());
      else if (/^collision_run_info\.json$/i.test(f.name)) data.runInfo = JSON.parse(await f.text());

  setLoaded(Boolean(data.summary), `${data.runInfo &amp;&amp; data.runInfo.status ? data.runInfo.status + &#x27; · &#x27; : &#x27;&#x27;}${n} satellite(s)`);

async function collect(handle, prefix = &#x27;&#x27;){

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{border:1px solid var(--border);border-radius:16px;padding:12px 14px;background:var(--panel);min-width:0}
.kpi .k-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .k-value{font-family:&#x27;Syne&#x27;,Inter,system-ui,sans-serif;font-size:26px;font-weight:700;color:var(--text-strong);line-height:1.15;margin-top:4px}
.kpi .k-unit{font-size:12px;color:var(--muted-2);font-weight:400;margin-left:4px}
.kpi .k-note{color:var(--muted-2);font-size:11px;margin-top:4px}
.kpi .k-flag{display:inline-flex;align-items:center;gap:6px;font-size:11px;margin-top:6px}
.kpi .k-flag.good{color:var(--st-good)}.kpi .k-flag.critical{color:var(--st-critical)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr))}
.card{border:1px solid var(--border);background:color-mix(in srgb,var(--panel) 95%,transparent);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.card.wide{grid-column:1/-1}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel-strong);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-header h3{margin:0;color:var(--text-strong);font-family:&#x27;Syne&#x27;,Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.card-header .hint{color:var(--muted);font-size:11px}
.card-body{padding:10px 12px 12px}
.plot{width:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:6px 8px 0;color:var(--text);font-size:11px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--muted)}
.legend i.tint-ecl{background:var(--ecl-tint)}.legend i.tint-sar{background:var(--sar-tint)}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
details.tables{border:1px solid var(--border);border-radius:18px;background:var(--panel);overflow:hidden}
details.tables&gt;summary{cursor:pointer;padding:12px 16px;font-family:&#x27;Syne&#x27;,Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--text-strong);background:var(--panel-strong)}
.table-wrap{overflow:auto;max-height:420px;border-top:1px solid var(--border-soft)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--border-soft);padding:6px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{position:sticky;top:0;background:var(--panel-strong);color:var(--muted-2);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
td.flag{color:var(--st-critical);font-weight:700}
.table-title{padding:10px 14px 4px;color:var(--muted-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
pre.json{margin:0;padding:12px 14px;max-height:420px;overflow:auto;font-size:11px;color:var(--text);border-top:1px solid var(--border-soft)}

&lt;script src=&quot;https://cdn.plot.ly/plotly-2.24.1.min.js&quot;&gt;&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;page&quot;&gt;
  &lt;input id=&quot;thermalFolderInput&quot; class=&quot;hidden-file-input&quot; type=&quot;file&quot; webkitdirectory directory multiple /&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;Components Thermal Analysis&lt;/h2&gt;
      &lt;div class=&quot;sub&quot; id=&quot;source-label&quot;&gt;END-018 · CubeSat lumped-parameter thermal model (1U-12U) · temperatures along the END-001 orbit and the END-003 imaging passes&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;span class=&quot;status-pill&quot;&gt;&lt;span id=&quot;status-dot&quot; class=&quot;status-dot&quot;&gt;&lt;/span&gt;&lt;span id=&quot;load-status&quot;&gt;No data loaded&lt;/span&gt;&lt;/span&gt;
      &lt;button id=&quot;manual-load&quot; class=&quot;primary-action&quot; type=&quot;button&quot;&gt;Select END-018 Folder&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;banner&quot; class=&quot;banner&quot; hidden&gt;&lt;/div&gt;
  &lt;div id=&quot;config&quot; class=&quot;chips&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;topbar&quot; id=&quot;sat-bar&quot; hidden&gt;
    &lt;div class=&quot;controls&quot;&gt;
      &lt;span class=&quot;ctl-label&quot;&gt;Satellite&lt;/span&gt;
      &lt;div class=&quot;seg&quot; id=&quot;sat-seg&quot; role=&quot;tablist&quot; aria-label=&quot;Satellite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;controls&quot;&gt;&lt;span class=&quot;ctl-label&quot; id=&quot;span-label&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;kpis&quot; class=&quot;kpis&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;article class=&quot;card wide&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;External surfaces over time&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Faces and solar panels [°C] · shaded = eclipse&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotExternal&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;tint-ecl&quot;&gt;&lt;/i&gt;Eclipse&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card wide&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Internal nodes over time&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Central body, battery and SAR payload [°C] · shaded = SAR on · dashed = node limits (model summary; battery 25 °C)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotInternal&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i class=&quot;tint-sar&quot;&gt;&lt;/i&gt;SAR on&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;tint-ecl&quot;&gt;&lt;/i&gt;Eclipse&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Temperature range per node&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;Minimum to maximum over the analysis · dot = mean&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot;&gt;&lt;div id=&quot;plotRange&quot; class=&quot;plot&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
    &lt;article class=&quot;card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;&lt;h3&gt;Constellation&lt;/h3&gt;&lt;span class=&quot;hint&quot;&gt;thermal_constellation_output.csv · one row per satellite&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;card-body&quot; id=&quot;constellation&quot;&gt;&lt;div class=&quot;empty&quot;&gt;No constellation file loaded.&lt;/div&gt;&lt;/div&gt;
    &lt;/article&gt;
  &lt;/div&gt;

  &lt;details class=&quot;tables&quot; id=&quot;tables-details&quot;&gt;
    &lt;summary&gt;Table view · node statistics and model summary&lt;/summary&gt;
    &lt;div id=&quot;tables&quot;&gt;&lt;/div&gt;
  &lt;/details&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
const BATTERY_LIMIT_C = 25;    // battery limit of the model (module report, integration test case)
const SLOTS = [&#x27;--s1&#x27;,&#x27;--s2&#x27;,&#x27;--s3&#x27;,&#x27;--s4&#x27;,&#x27;--s5&#x27;,&#x27;--s6&#x27;,&#x27;--s7&#x27;,&#x27;--s8&#x27;];
const state = { runInfo:null, sats:{}, constellation:null, current:null, labels:{} };

/* ---------- helpers ---------- */
function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(v){ return String(v ?? &#x27;&#x27;).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;); }
function fmt(v, d = 1){ return Number.isFinite(Number(v)) ? Number(v).toFixed(d) : &#x27;—&#x27;; }
function colors(){
  return { text:css(&#x27;--text&#x27;), strong:css(&#x27;--text-strong&#x27;), muted:css(&#x27;--muted&#x27;), muted2:css(&#x27;--muted-2&#x27;), panelStrong:css(&#x27;--panel-strong&#x27;),
    border:css(&#x27;--border&#x27;), grid:css(&#x27;--border-soft&#x27;), ecl:css(&#x27;--ecl-tint&#x27;), sar:css(&#x27;--sar-tint&#x27;), critical:css(&#x27;--st-critical&#x27;), slots:SLOTS.map(css) };
}
function baseLayout(c, extra){
  return Object.assign({ paper_bgcolor:&#x27;rgba(0,0,0,0)&#x27;, plot_bgcolor:&#x27;rgba(0,0,0,0)&#x27;,
    font:{ family:&quot;&#x27;Space Mono&#x27;, ui-monospace, monospace&quot;, size:11, color:c.text }, margin:{ l:60, r:18, t:10, b:44 },
    hoverlabel:{ bgcolor:c.panelStrong, bordercolor:c.border, font:{ color:c.text, family:&quot;&#x27;Space Mono&#x27;, monospace&quot;, size:11 } },
    legend:{ orientation:&#x27;h&#x27;, x:0, y:1.14, font:{ size:11, color:c.text } } }, extra || {});
}
function axis(c, extra){
  return Object.assign({ gridcolor:c.grid, zerolinecolor:c.grid, linecolor:c.border, tickcolor:c.border, tickfont:{ color:c.muted2, size:11 }, titlefont:{ color:c.muted2, size:11 } }, extra || {});
}
const PLOT_CFG = { responsive:true, displaylogo:false, displayModeBar:false };
function draw(id, traces, layout){ const el = $(id); if (!el || !window.Plotly) return; el.querySelectorAll(&#x27;.empty&#x27;).forEach(n =&gt; n.remove()); Plotly.react(el, traces, layout, PLOT_CFG); }
function empty(id, message){ const el = $(id); if (!el) return; if (window.Plotly) { try { Plotly.purge(el); } catch (_) {} } el.innerHTML = `&lt;div class=&quot;empty&quot;&gt;${esc(message)}&lt;/div&gt;`; }

/* ---------- parsing ---------- */
function parseCsv(text){
  const lines = String(text || &#x27;&#x27;).replace(/^﻿/, &#x27;&#x27;).split(/\r?\n/).filter(l =&gt; l.trim().length);
  if (!lines.length) return { header:[], rows:[] };
  const split = l =&gt; { const out = []; let cur = &#x27;&#x27;, q = false; for (const ch of l) { if (ch === &#x27;&quot;&#x27;) q = !q; else if (ch === &#x27;,&#x27; &amp;&amp; !q) { out.push(cur); cur = &#x27;&#x27;; } else cur += ch; } out.push(cur); return out.map(s =&gt; s.trim()); };
  const header = split(lines[0]);
  return { header, rows: lines.slice(1).map(split) };
}
function nodeGroup(name){ return /ctr|central|bat|sar|payload|internal/i.test(name) ? &#x27;internal&#x27; : &#x27;external&#x27;; }
function nodeLabel(name){
  const n = name.replace(/^t_/i, &#x27;&#x27;);
  const map = { CTR:&#x27;Central body&#x27;, BAT:&#x27;Battery&#x27;, SAR:&#x27;SAR payload&#x27; };
  let m;
  if ((m = n.match(/^(?:_+|x_)([XYZ])$/i))) return `Face ${m[1].toUpperCase()}`;     // T__X in the CSV, x_X in the summary
  if ((m = n.match(/^PANdep(\d+)$/i))) return `Deployable panel ${m[1]}`;
  return map[n.toUpperCase()] || n;
}
/* node -&gt; limit [°C] from the summary (&quot;limits&quot;: {&quot;BAT&quot;:25,...}); the battery falls back to 25 °C */
function nodeLimits(summary){
  const out = {};
  const lim = summary &amp;&amp; summary.limits;
  if (lim &amp;&amp; typeof lim === &#x27;object&#x27;) for (const [k, v] of Object.entries(lim)) if (Number.isFinite(Number(v))) out[k.toUpperCase()] = Number(v);
  if (out.BAT === undefined) out.BAT = BATTERY_LIMIT_C;
  return out;
}
function limitOf(node, limits){ const k = node.key.replace(/^t_/i, &#x27;&#x27;).toUpperCase(); return limits[k]; }
function buildSeries(csvText){
  const { header, rows } = parseCsv(csvText);
  const ti = header.findIndex(h =&gt; /time|utc|epoch/i.test(h));
  const ei = header.findIndex(h =&gt; /^eclipse$/i.test(h));
  const si = header.findIndex(h =&gt; /^sar_on$/i.test(h));
  const nodes = header.map((h, i) =&gt; ({ h, i })).filter(o =&gt; /^t_/i.test(o.h));
  if (!nodes.length) return null;
  const t = rows.map(r =&gt; ti &gt;= 0 ? r[ti] : null);
  const s = { header, time:t, eclipse: ei &gt;= 0 ? rows.map(r =&gt; Number(r[ei]) &gt; 0 ? 1 : 0) : null, sarOn: si &gt;= 0 ? rows.map(r =&gt; Number(r[si]) &gt; 0 ? 1 : 0) : null, nodes:[] };
  for (const { h, i } of nodes) {
    const v = rows.map(r =&gt; Number(r[i]));
    const ok = v.filter(Number.isFinite);
    s.nodes.push({ key:h, label:nodeLabel(h), group:nodeGroup(h), values:v,
      min: ok.length ? Math.min(...ok) : NaN, max: ok.length ? Math.max(...ok) : NaN, mean: ok.length ? ok.reduce((a, b) =&gt; a + b, 0) / ok.length : NaN });
  }
  return s;
}
function runs(flags, time){
  const out = []; if (!flags || !time) return out;
  let start = null;
  for (let k = 0; k &lt; flags.length; k++) {
    if (flags[k] &amp;&amp; start === null) start = k;
    if ((!flags[k] || k === flags.length - 1) &amp;&amp; start !== null) { out.push([time[start], time[flags[k] ? k : k - 1]]); start = null; }
  }
  return out;
}
function stride(n){ return Math.max(1, Math.ceil(n / 3000)); }
function thin(arr, k){ if (!arr) return arr; if (k === 1) return arr; const out = []; for (let i = 0; i &lt; arr.length; i += k) out.push(arr[i]); return out; }
function findViolations(summary){
  const out = [];
  const walk = (obj, path) =&gt; {
    if (obj === null || obj === undefined) return;
    if (typeof obj === &#x27;object&#x27;) { for (const [k, v] of Object.entries(obj)) walk(v, path ? `${path}.${k}` : k); return; }
    if (/viol|exceed|limit|flag/i.test(path)) out.push({ path, value: obj, active: obj === true || obj === 1 || /^(true|yes|1)$/i.test(String(obj)) });
  };
  if (summary &amp;&amp; summary.violations !== undefined) walk(summary.violations, &#x27;violations&#x27;);
  else walk(summary, &#x27;&#x27;);
  return out;
}

/* ---------- rendering ---------- */
function renderBanner(){
  const b = $(&#x27;banner&#x27;); const info = state.runInfo;
  const sat = state.current &amp;&amp; state.sats[state.current];
  const items = [];
  let cls = &#x27;good&#x27;, icon = &#x27;✓&#x27;, head = &#x27;&#x27;;
  if (info &amp;&amp; info.status &amp;&amp; info.status !== &#x27;completed&#x27;) {
    cls = info.status === &#x27;failed&#x27; ? &#x27;critical&#x27; : &#x27;warning&#x27;; icon = info.status === &#x27;failed&#x27; ? &#x27;✕&#x27; : &#x27;!&#x27;;
    head = `&lt;b&gt;END-018 ${esc(info.status)}&lt;/b&gt; — ${esc(info.evidence_text || &#x27;&#x27;)}`;
  } else {
    const viol = [];
    for (const id of Object.keys(state.sats).sort()) {
      const s = state.sats[id];
      const limits = nodeLimits(s.summary), parts = [];
      for (const n of (s.series &amp;&amp; s.series.nodes) || []) {
        const lim = limitOf(n, limits);
        if (Number.isFinite(lim) &amp;&amp; n.max &gt; lim) parts.push(`${n.label} ${fmt(n.max)} &gt; ${fmt(lim, 0)} °C`);
      }
      // flags the model sets without a time series loaded, or for a node the series does not carry
      for (const v of s.violations || []) {
        const node = (v.path.match(/^violations\.([A-Za-z]+)_/) || [])[1];
        if (v.active &amp;&amp; !(node &amp;&amp; s.series &amp;&amp; s.series.nodes.some(n =&gt; n.key.replace(/^t_/i, &#x27;&#x27;).toUpperCase() === node.toUpperCase())))
          parts.push(v.path.replace(/^violations\./, &#x27;&#x27;));
      }
      if (parts.length) viol.push(`${id}: ${parts.join(&#x27;, &#x27;)}`);
    }
    if (viol.length) { cls = &#x27;critical&#x27;; icon = &#x27;!&#x27;; head = `&lt;b&gt;Operational limits exceeded&lt;/b&gt;`; items.push(...viol); }
    else head = &#x27;&lt;b&gt;No limit exceeded&lt;/b&gt;&#x27;;
    if (info &amp;&amp; info.evidence_text) head += ` — ${esc(info.evidence_text)}`;
  }
  const notes = (info &amp;&amp; info.notes) || [];
  b.className = `banner ${cls}`; b.hidden = false;
  b.innerHTML = `&lt;span class=&quot;icon&quot; aria-hidden=&quot;true&quot;&gt;${icon}&lt;/span&gt;&lt;div&gt;${head}${items.length ? `&lt;ul&gt;${items.map(i =&gt; `&lt;li&gt;${esc(i)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;` : &#x27;&#x27;}${notes.length ? `&lt;div style=&quot;margin-top:6px;color:var(--muted-2);font-size:11px&quot;&gt;${notes.map(esc).join(&#x27; · &#x27;)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;`;
}
function renderConfig(){
  const info = state.runInfo; const el = $(&#x27;config&#x27;);
  const cfg = (info &amp;&amp; info.config) || (state.current &amp;&amp; state.sats[state.current] &amp;&amp; state.sats[state.current].summary &amp;&amp; (state.sats[state.current].summary.config || state.sats[state.current].summary.configuration)) || null;
  if (!cfg) { el.innerHTML = &#x27;&#x27;; return; }
  const prov = (info &amp;&amp; info.provenance) || {};
  const labels = { form_factor:&#x27;CubeSat class&#x27;, panels:&#x27;Solar panels&#x27;, n_internal_nodes:&#x27;Internal nodes&#x27;, sar_power_W:&#x27;SAR power [W]&#x27;, sar_source:&#x27;SAR switched on&#x27;, sar_duty:&#x27;SAR duty&#x27; };
  el.innerHTML = Object.entries(cfg).filter(([k]) =&gt; !/dir$/.test(k)).map(([k, v]) =&gt;
    `&lt;div class=&quot;chip&quot;&gt;&lt;div class=&quot;c-label&quot;&gt;${esc(labels[k] || k)}&lt;/div&gt;&lt;div class=&quot;c-value&quot;&gt;${esc(v)}&lt;/div&gt;&lt;div class=&quot;c-src&quot;&gt;${esc(prov[k] || &#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
}
function renderSatBar(){
  const ids = Object.keys(state.sats).sort();
  $(&#x27;sat-bar&#x27;).hidden = !ids.length;
  $(&#x27;sat-seg&#x27;).innerHTML = ids.map(id =&gt; `&lt;button type=&quot;button&quot; class=&quot;${id === state.current ? &#x27;active&#x27; : &#x27;&#x27;}&quot; data-sat=&quot;${esc(id)}&quot;&gt;${esc(id)}&lt;/button&gt;`).join(&#x27;&#x27;);
  $(&#x27;sat-seg&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(btn =&gt; btn.onclick = () =&gt; { state.current = btn.dataset.sat; renderAll(); });
  const s = state.current &amp;&amp; state.sats[state.current] &amp;&amp; state.sats[state.current].series;
  $(&#x27;span-label&#x27;).textContent = s &amp;&amp; s.time.length ? `${s.time[0]} → ${s.time[s.time.length - 1]} · ${s.time.length} samples` : &#x27;&#x27;;
}
function kpi(label, value, unit, note, flag){
  return `&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;k-label&quot;&gt;${esc(label)}&lt;/div&gt;&lt;div class=&quot;k-value&quot;&gt;${value}&lt;span class=&quot;k-unit&quot;&gt;${esc(unit)}&lt;/span&gt;&lt;/div&gt;${note ? `&lt;div class=&quot;k-note&quot;&gt;${esc(note)}&lt;/div&gt;` : &#x27;&#x27;}${flag ? `&lt;div class=&quot;k-flag ${flag.cls}&quot;&gt;${flag.icon} ${esc(flag.text)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;`;
}
function renderKpis(){
  const sat = state.current &amp;&amp; state.sats[state.current]; const s = sat &amp;&amp; sat.series;
  if (!s) { $(&#x27;kpis&#x27;).innerHTML = &#x27;&#x27;; return; }
  const ext = s.nodes.filter(n =&gt; n.group === &#x27;external&#x27;), int = s.nodes.filter(n =&gt; n.group === &#x27;internal&#x27;);
  const extMax = ext.reduce((a, n) =&gt; n.max &gt; a.max ? n : a, { max:-Infinity }), extMin = ext.reduce((a, n) =&gt; n.min &lt; a.min ? n : a, { min:Infinity });
  const by = re =&gt; s.nodes.find(n =&gt; re.test(n.key));
  const ctr = by(/ctr|central/i), bat = by(/bat/i), sar = by(/sar/i);
  const frac = f =&gt; f ? 100 * f.reduce((a, b) =&gt; a + b, 0) / f.length : NaN;
  const limits = nodeLimits(sat.summary);
  const flag = n =&gt; { const lim = limitOf(n, limits); return Number.isFinite(lim)
    ? (n.max &gt; lim ? { cls:&#x27;critical&#x27;, icon:&#x27;✕&#x27;, text:`above the ${fmt(lim, 0)} °C limit` } : { cls:&#x27;good&#x27;, icon:&#x27;✓&#x27;, text:`within the ${fmt(lim, 0)} °C limit` }) : null; };
  const sm = sat.summary || {};
  const cells = sm.solar_panels, sarPass = sm.peaks &amp;&amp; sm.peaks.SAR_max_C_pass_realattitude;
  const cards = [];
  if (Number.isFinite(extMax.max)) cards.push(kpi(&#x27;Hottest surface&#x27;, fmt(extMax.max), &#x27;°C&#x27;, extMax.label));
  if (Number.isFinite(extMin.min)) cards.push(kpi(&#x27;Coldest surface&#x27;, fmt(extMin.min), &#x27;°C&#x27;, extMin.label));

(() =&gt; {
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
const NA = &#x27;Not publicly available&#x27;;
const NAD = &#x27;Not available in the database&#x27;;
const HUE = {structure:[220,12],obc:[165,60],eps:[34,85],battery:[8,75],solar_panel:[215,70],comms:[195,75],antenna:[150,55],adcs:[280,55],magnetorquer:[300,50],reaction_wheel:[255,55],star_tracker:[330,60],sun_sensor:[45,30],gps:[95,52],gnss_antenna:[120,40],propulsion:[18,82],payload_imager:[52,85],payload_optical:[75,70]};

const esc = v =&gt; String(v ?? &#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const sci = (v, d = 3) =&gt; { if (v == null) return NA; if (v === 0) return &#x27;0&#x27;; const e = Math.floor(Math.log10(Math.abs(v))); const m = v / Math.pow(10, e); const sup = String(e).replace(/-/g, &#x27;⁻&#x27;).replace(/\d/g, x =&gt; &#x27;⁰¹²³⁴⁵⁶⁷⁸⁹&#x27;[x]); return `${m.toFixed(d)}×10${sup}`; };
const f = (v, d = 3) =&gt; v == null ? NA : (+v.toFixed(d)).toString();
const clamp = (v, lo, hi) =&gt; Math.max(lo, Math.min(hi, v));
const store = {get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}}};
const S = {mode:&#x27;viewer&#x27;, base:&#x27;&#x27;, result:null, sel:null, params:{form_factor_u: 6}, imgs:{}};

/* ---------------- transport: HTTP server, pywebview (STAR) or view-only ---------------- */
function findPywebview() {
  for (const w of [window, window.parent, window.parent &amp;&amp; window.parent.parent, window.top]) {
    try { if (w &amp;&amp; w.pywebview &amp;&amp; w.pywebview.api &amp;&amp; w.pywebview.api.component_selector_select) return w.pywebview.api; } catch (_) {}
  }
  return null;
}
const API = {
  async detect() {
    if (window.componentSelectorData &amp;&amp; !location.protocol.startsWith(&#x27;http&#x27;)) { S.mode = &#x27;viewer&#x27;; return; }
    if (location.protocol.startsWith(&#x27;http&#x27;)) {
      try { const r = await fetch(&#x27;api/health&#x27;, {cache:&#x27;no-store&#x27;}); if (r.ok) { S.mode = &#x27;http&#x27;; S.base = &#x27;&#x27;; return; } } catch (_) {}
    }
    if (window.componentSelectorData) { S.mode = &#x27;viewer&#x27;; return; }
    for (let i = 0; i &lt; 6; i++) { if (findPywebview()) { S.mode = &#x27;star&#x27;; return; } await new Promise(r =&gt; setTimeout(r, 250)); }
    S.mode = &#x27;viewer&#x27;;
  },
  async select(params) {
    if (S.mode === &#x27;http&#x27;) { const r = await fetch(&#x27;api/select&#x27;, {method:&#x27;POST&#x27;, headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;}, body:JSON.stringify(params)}); return r.json(); }
    if (S.mode === &#x27;star&#x27;) return findPywebview().component_selector_select({...params, with_images:true});
    throw new Error(&#x27;Recomputing needs the server or STAR.&#x27;);
  },
  async fromRequirements() {
    if (S.mode === &#x27;star&#x27;) { try { return await findPywebview().component_selector_from_requirements(); } catch (_) {} }
    return null;
  },
  async design() {   // inside STAR: the design for the mission of the current run (requirements, END-001 orbits, END-016 delta-v)
    const api = S.mode === &#x27;star&#x27; &amp;&amp; findPywebview();
    return api &amp;&amp; api.component_selector_design ? api.component_selector_design({with_images: true}) : null;
  }
};

/* ---------------- small drawings of each SUBSYSTEM (not of the chosen product) ---------------- */
const rotate = (p, yaw, pitch) =&gt; {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), x = p[0] * cy - p[1] * sy, y = p[0] * sy + p[1] * cy, z = p[2];
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  return [x, y * cp - z * sp, y * sp + z * cp];   // [screen x, depth (larger = farther), screen up]
};
const vnorm = v =&gt; { const n = Math.hypot(...v) || 1; return v.map(x =&gt; x / n); };
const vcross = (a, b) =&gt; [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vadd = (a, b, k = 1) =&gt; [a[0] + k * b[0], a[1] + k * b[1], a[2] + k * b[2]];
function facesOf(pr) {   // convex polygons with a normal each; primitives: box {c,s} and cylinder/frustum {c,ax|dir,r,r2,L}
  const [cx, cy, cz] = pr.c, out = [];
  if (pr.k === &#x27;box&#x27;) {
    const [sx, sy, sz] = pr.s, h = [sx / 2, sy / 2, sz / 2], V = (a, b, c) =&gt; [cx + a * h[0], cy + b * h[1], cz + c * h[2]], quad = (pts, n) =&gt; out.push({pts, n});
    quad([V(-1,-1,-1), V(-1,-1,1), V(-1,1,1), V(-1,1,-1)], [-1,0,0]); quad([V(1,-1,-1), V(1,1,-1), V(1,1,1), V(1,-1,1)], [1,0,0]);
    quad([V(-1,-1,-1), V(1,-1,-1), V(1,-1,1), V(-1,-1,1)], [0,-1,0]); quad([V(-1,1,-1), V(-1,1,1), V(1,1,1), V(1,1,-1)], [0,1,0]);
    quad([V(-1,-1,-1), V(-1,1,-1), V(1,1,-1), V(1,-1,-1)], [0,0,-1]); quad([V(-1,-1,1), V(1,-1,1), V(1,1,1), V(-1,1,1)], [0,0,1]);
    return out;
  }
  const n = pr.n || 16, L = pr.L, r1 = pr.r, r2 = pr.r2 ?? pr.r, ax = pr.ax || &#x27;z&#x27;;
  let B = null;
  if (pr.dir) { const w = vnorm(pr.dir), a = Math.abs(w[2]) &lt; 0.9 ? [0, 0, 1] : [1, 0, 0], u = vnorm(vcross(a, w)); B = {u, v: vcross(w, u), w}; }
  const P = (th, t, r) =&gt; {
    const u = r * Math.cos(th), v = r * Math.sin(th), a = t * L;
    if (B) return [cx + B.u[0] * u + B.v[0] * v + B.w[0] * a, cy + B.u[1] * u + B.v[1] * v + B.w[1] * a, cz + B.u[2] * u + B.v[2] * v + B.w[2] * a];
    return ax === &#x27;z&#x27; ? [cx + u, cy + v, cz + a] : ax === &#x27;x&#x27; ? [cx + a, cy + u, cz + v] : [cx + u, cy + a, cz + v];
  };
  const N = (th, along) =&gt; { const u = Math.cos(th), v = Math.sin(th); if (B) return [B.u[0]*u + B.v[0]*v + B.w[0]*along, B.u[1]*u + B.v[1]*v + B.w[1]*along, B.u[2]*u + B.v[2]*v + B.w[2]*along]; return ax === &#x27;z&#x27; ? [u, v, along] : ax === &#x27;x&#x27; ? [along, u, v] : [u, along, v]; };
  const slope = (r1 - r2) / (L || 1);
  for (let i = 0; i &lt; n; i++) { const a0 = 2 * Math.PI * i / n, a1 = 2 * Math.PI * (i + 1) / n; out.push({pts: [P(a0, -0.5, r1), P(a1, -0.5, r1), P(a1, 0.5, r2), P(a0, 0.5, r2)], n: N((a0 + a1) / 2, slope)}); }
  const cap = (t, r, sign) =&gt; { const pts = []; for (let i = 0; i &lt; n; i++) pts.push(P(2 * Math.PI * i / n, t, r)); out.push({pts, n: B ? B.w.map(x =&gt; x * sign) : ax === &#x27;z&#x27; ? [0, 0, sign] : ax === &#x27;x&#x27; ? [sign, 0, 0] : [0, sign, 0]}); };
  cap(-0.5, r1, -1); cap(0.5, r2, 1);
  return out;
}
const B_ = (c, s, shade = 0) =&gt; ({k: &#x27;box&#x27;, c, s, shade});
const Cz = (c, r, L, shade = 0, r2) =&gt; ({k: &#x27;cyl&#x27;, c, ax: &#x27;z&#x27;, r, r2, L, n: 14, shade});
const Rod = (a, dir, L, r, shade = 14) =&gt; ({k: &#x27;cyl&#x27;, c: vadd(a, vnorm(dir), L / 2), dir: vnorm(dir), r, L, n: 6, shade});
function iconPrims(id) {
  const board = (z = -0.1, w = 1.3, d = 0.95) =&gt; B_([0, 0, z], [w, d, 0.06]);

    case &#x27;antenna&#x27;: { const o = [B_([0, 0, -0.3], [0.95, 0.95, 0.06], 4), B_([0, 0, -0.26], [0.45, 0.45, 0.03], 16)]; for (const [a, b] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) o.push(Rod([a * 0.4, b * 0.4, -0.27], [a * 0.7, b * 0.7, 1], 1.0, 0.025)); return o; }
    case &#x27;adcs&#x27;: return [B_([0, 0, -0.5], [1.5, 1.5, 0.05], -8), B_([0, 0, -0.15], [1.0, 1.0, 0.5], 4), Cz([0, 0, 0.18], 0.36, 0.1, 10), B_([0, 0, 0.3], [0.3, 0.3, 0.1], 14)];
    case &#x27;magnetorquer&#x27;: return [B_([0, 0, -0.5], [1.5, 1.5, 0.05], -8), B_([0, 0.2, -0.3], [1.3, 0.14, 0.14], 8), B_([0.2, -0.3, -0.3], [0.14, 1.0, 0.14], 8), Cz([0, 0, -0.45], 0.55, 0.06, 12)];
    case &#x27;reaction_wheel&#x27;: return [B_([0, 0, -0.45], [1.2, 1.2, 0.08], -8), Cz([0, 0, -0.1], 0.58, 0.5, 0), Cz([0, 0, 0.17], 0.42, 0.06, 10), Cz([0, 0, 0.22], 0.1, 0.06, 18)];

  }).join(&#x27;&#x27;);
  const L = {}; for (const c of (r.library &amp;&amp; r.library.classes) || []) L[c.id] = c;
  const sizeTxt = p =&gt; p.ext &amp;&amp; !p.size_published
    ? (p.published_mm &amp;&amp; p.published_mm.length ? `${p.published_mm.map(v =&gt; f(v, 1)).join(&#x27; × &#x27;)} mm · thickness: ${NA}` : `Size: ${NA}`)
    : p.size.map(v =&gt; f(v, 1)).sort((a, b) =&gt; b - a).join(&#x27; × &#x27;) + &#x27; mm&#x27; + (p.aperture === &#x27;-Z&#x27; ? &#x27; · looks out of −Z (nadir), nothing in front&#x27; : &#x27;&#x27;);
  const acr = sid =&gt; esc((L[sid] || {}).acronym || sid);
  const leg = parts.map(p =&gt; `&lt;div class=&quot;it ${sel === p.id ? &#x27;sel&#x27; : &#x27;&#x27;}&quot; data-id=&quot;${esc(p.id)}&quot; title=&quot;${esc(p.name)}&quot;&gt;&lt;b class=&quot;sw&quot; style=&quot;background:${catColor(p.subsystem)}&quot;&gt;&lt;/b&gt;&lt;span class=&quot;ac&quot;&gt;${acr(p.subsystem)}${p.shape &amp;&amp; p.shape.basis === &#x27;subsystem&#x27; ? &#x27;&lt;sup title=&quot;Shape chosen from the subsystem: no usable product image&quot;&gt;*&lt;/sup&gt;&#x27; : &#x27;&#x27;}&lt;/span&gt;&lt;span class=&quot;nm&quot;&gt;${esc(p.name)}&lt;/span&gt;&lt;span class=&quot;sz&quot;&gt;${esc(sizeTxt(p))}${p.ext ? &#x27; · external&#x27; : &#x27;&#x27;}${p.outside ? &#x27; · &lt;b class=&quot;out&quot;&gt;outside the envelope&lt;/b&gt;&#x27; : &#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)
    + notDrawn.map(p =&gt; `&lt;div class=&quot;it nd ${sel === p.id ? &#x27;sel&#x27; : &#x27;&#x27;}&quot; data-id=&quot;${esc(p.id)}&quot; title=&quot;${esc(p.name)}: no published size, not drawn&quot;&gt;&lt;b class=&quot;sw&quot; style=&quot;border-color:${catColor(p.subsystem)}&quot;&gt;&lt;/b&gt;&lt;span class=&quot;ac&quot;&gt;${acr(p.subsystem)}&lt;/span&gt;&lt;span class=&quot;nm&quot;&gt;${esc(p.name)}${p.quantity &gt; 1 ? ` × ${p.quantity}` : &#x27;&#x27;}&lt;/span&gt;&lt;span class=&quot;sz&quot;&gt;Size: ${NA} · not drawn&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)
    + (free.length ? `&lt;div class=&quot;it fr&quot; title=&quot;Space left below the stack in the columns of the class&quot;&gt;&lt;b class=&quot;sw&quot;&gt;&lt;/b&gt;&lt;span class=&quot;ac&quot;&gt;FREE&lt;/span&gt;&lt;span class=&quot;nm&quot;&gt;Free space&lt;/span&gt;&lt;span class=&quot;sz&quot;&gt;${f(PV.free_volume_l, 2)} L · dashed&lt;/span&gt;&lt;/div&gt;` : &#x27;&#x27;);

  $(&#x27;pl&#x27;).innerHTML = `${banner}&lt;div class=&quot;plwrap&quot;&gt;&lt;div class=&quot;plview&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;plreset&quot; id=&quot;pl-reset&quot; title=&quot;Back to the initial view&quot;&gt;Reset view&lt;/button&gt;&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;Isometric view of the chosen components inside the ${r.cubesat.class_u}U CubeSat&quot;&gt;&lt;title&gt;${r.cubesat.class_u}U CubeSat, components placed inside${proof ? &#x27;&#x27; : &#x27; (preview)&#x27;}&lt;/title&gt;${back}${behind}${body}${front}&lt;/svg&gt;&lt;/div&gt;&lt;div class=&quot;pleg&quot;&gt;${leg}&lt;/div&gt;&lt;/div&gt;

// drag to rotate (yaw around the long axis of the drawing, pitch up and down); a drag does not select the part under the pointer
let plDrag = null, plDragged = false, plFrame = 0;

$(&#x27;pl&#x27;).addEventListener(&#x27;pointerdown&#x27;, e =&gt; {
  if (!e.target.closest(&#x27;svg&#x27;) || e.button !== 0) return;

window.addEventListener(&#x27;pointermove&#x27;, e =&gt; {
