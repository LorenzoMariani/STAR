$(&#x27;pl&#x27;).onclick = e =&gt; {
  if (e.target.closest(&#x27;#pl-reset&#x27;)) { VIEW.yaw = VIEW0.yaw; VIEW.pitch = VIEW0.pitch; plRedraw(); return; }
  if (plDragged) { plDragged = false; return; }
  const el = e.target.closest(&#x27;[data-id]&#x27;); if (el &amp;&amp; el.dataset.id) select(el.dataset.id);
};

/* ---------------- component drawer (read only) ---------------- */
function renderDrawer() {
  const p = S.sel; if (!p) { dsRelease(); $(&#x27;d-body&#x27;).innerHTML = &#x27;&#x27;; return; }
  $(&#x27;d-title&#x27;).textContent = `${p.vendor || &#x27;&#x27;} ${p.name}`;
  const im = p.image, so = p.source || {}, ds = p.datasheet, src = im &amp;&amp; (im.data_uri || (S.mode === &#x27;http&#x27; ? im.file : null));
  const specs = Object.entries(p.specs || {}).map(([k, v]) =&gt; `&lt;div class=&quot;k&quot;&gt;${esc(k)}&lt;/div&gt;&lt;div class=&quot;${v == null ? &#x27;na&#x27; : &#x27;&#x27;}&quot;&gt;${v == null ? NA : esc(typeof v === &#x27;object&#x27; ? JSON.stringify(v) : v)}&lt;/div&gt;`).join(&#x27;&#x27;);
  const imageBox = src ? `&lt;img class=&quot;big&quot; src=&quot;${src}&quot; alt=&quot;&quot;&gt;` : `&lt;div class=&quot;box&quot;&gt;${im ? &#x27;Image not shown in this view&#x27; : &#x27;Image: &#x27; + NAD}&lt;/div&gt;`;
  $(&#x27;d-body&#x27;).innerHTML = `&lt;div class=&quot;sec dual&quot;&gt;
      &lt;div&gt;&lt;h4&gt;Image&lt;/h4&gt;${imageBox}
        &lt;div style=&quot;margin-top:6px&quot;&gt;&lt;span class=&quot;badge&quot;&gt;${esc(labelOf(S.result.subsystems.find(s =&gt; s.selected &amp;&amp; s.selected.id === p.id).id))}&lt;/span&gt;&lt;span class=&quot;badge&quot;&gt;${so.verified ? &#x27;verified&#x27; : &#x27;not verified by a person&#x27;}&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;kvg&quot; style=&quot;margin-top:6px&quot;&gt;${p.rows.map(row =&gt; `&lt;div class=&quot;k&quot;&gt;${esc(row.label)}&lt;/div&gt;&lt;div class=&quot;${row.value == null ? &#x27;na&#x27; : &#x27;&#x27;}&quot;&gt;${row.value == null ? NA : esc(row.value) + (row.unit ? &#x27; &#x27; + esc(row.unit) : &#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;)}
          ${p.dimensions ? `&lt;div class=&quot;k&quot;&gt;Size source&lt;/div&gt;&lt;div title=&quot;${esc(p.dimensions.note)}&quot;&gt;${esc(p.dimensions.basis)}&lt;/div&gt;` : &#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;h4&gt;Datasheet${ds ? &#x27; · &#x27; + esc(ds.document || ds.file) + (ds.page ? &#x27; · p. &#x27; + ds.page : &#x27;&#x27;) : &#x27;&#x27;}&lt;/h4&gt;&lt;div class=&quot;dsview&quot; id=&quot;ds-view&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sec&quot;&gt;&lt;h3 style=&quot;margin:0 0 6px;font-size:11px;text-transform:uppercase&quot;&gt;Data source&lt;/h3&gt;
      &lt;div&gt;${esc(so.document || NAD)}${so.retrieved ? &#x27; · retrieved &#x27; + esc(so.retrieved) : &#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sec&quot;&gt;&lt;h3 style=&quot;margin:0 0 6px;font-size:11px;text-transform:uppercase&quot;&gt;All published specifications&lt;/h3&gt;&lt;div class=&quot;kvg&quot;&gt;${specs}&lt;/div&gt;&lt;/div&gt;
    ${p.notes ? `&lt;div class=&quot;sec&quot;&gt;&lt;h3 style=&quot;margin:0 0 6px;font-size:11px;text-transform:uppercase&quot;&gt;Catalogue notes (in Italian, as transcribed)&lt;/h3&gt;&lt;div class=&quot;hint&quot;&gt;${esc(p.notes)}&lt;/div&gt;&lt;/div&gt;` : &#x27;&#x27;}`;
  loadDatasheet(p);
}
let dsToken = 0, dsUrl = null;
function dsRelease() { dsToken++; if (dsUrl) { URL.revokeObjectURL(dsUrl); dsUrl = null; } }
async function loadDatasheet(p) {

  const page = ds.page ? &#x27;#page=&#x27; + ds.page : &#x27;&#x27;;
  try {
    if (S.mode === &#x27;http&#x27;) { box.innerHTML = `&lt;iframe title=&quot;Datasheet&quot; src=&quot;${esc(ds.file)}${page}&quot;&gt;&lt;/iframe&gt;`; return; }
    if (S.mode === &#x27;star&#x27;) {
      msg(&#x27;Loading datasheet…&#x27;);

$(&#x27;d-close&#x27;).onclick = () =&gt; { S.sel = null; render(); };

/* ---------------- compute ---------------- */
async function compute() {
  if (S.mode === &#x27;viewer&#x27;) return;
  try {   // the mission design when STAR has the requirements of a run, otherwise the selection for the class (all subsystems)
    const d = await API.design();
    S.result = d &amp;&amp; d.ok !== false ? d : await API.select({form_factor_u: S.params.form_factor_u});
  } catch (err) { S.result = {ok: false, error: String(err)}; }

}
function loadResult(payload) {

  if (payload.params) S.params = {...payload.params};
  render();
}

/* ---------------- STAR results-shell hooks (same pattern as the other END modules) ---------------- */
async function readRunFile(files, re) {
  const fl = Array.from(files || []).find(x =&gt; re.test(x.name)); if (!fl) return null;
  const txt = await fl.text();
  const m = /componentSelectorData\s*=\s*([\s\S]*?)\s*;?\s*$/.exec(txt);
  return JSON.parse(m &amp;&amp; /\.js$/i.test(fl.name) ? m[1] : txt);
}
window.receiveComponentSelectorFilesFromParent = async function (payload = {}) {
  try {
    const files = [...(payload.productFiles || []), ...(payload.resultFiles || [])];
    const data = await readRunFile(files, /component_selector_data\.js$/i) || await readRunFile(files, /component_selector_results\.json$/i);

window.receiveComponentSelectorDataFromParent = data =&gt; loadResult(data);
async function classFromStar() {

}
async function upgradeIfLive() {

  S.mode = &#x27;star&#x27;;
  await classFromStar();
  render(); compute();
  return true;
}
window.refreshComponentSelectorDashboard = () =&gt; { upgradeIfLive(); };
function setTheme(th) { document.documentElement.dataset.theme = th === &#x27;light&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;; store.set(&#x27;star-cs-theme&#x27;, th); }
window.setTheme = setTheme; window.applyTheme = setTheme;
for (const w of [window, window.parent, window.top]) { try { w.addEventListener(&#x27;pywebviewready&#x27;, upgradeIfLive); } catch (_) {} }
(function retryLive() { let n = 0; const timer = setInterval(async () =&gt; { if (await upgradeIfLive() || S.mode !== &#x27;viewer&#x27; || ++n &gt; 60) clearInterval(timer); }, 1000); })();

/* ---------------- boot ---------------- */
(async function boot() {
  setTheme(store.get(&#x27;star-unified-theme&#x27;) || store.get(&#x27;star-cs-theme&#x27;) || (document.documentElement.dataset.theme || &#x27;dark&#x27;));
  await API.detect();
  if (S.mode === &#x27;viewer&#x27; &amp;&amp; window.componentSelectorData) { loadResult(window.componentSelectorData); return; }
  const fromUrl = new URLSearchParams(location.search).get(&#x27;form_factor_u&#x27;);
  if (fromUrl) S.params.form_factor_u = +fromUrl;
  else if (S.mode === &#x27;star&#x27;) await classFromStar();
  render();
  if (S.mode !== &#x27;viewer&#x27;) compute();
})();
})();

      &lt;div class=&quot;card-body&quot;&gt;
        &lt;h3 class=&quot;section-title&quot;&gt;Expected artifact checks&lt;/h3&gt;
        &lt;div class=&quot;table-wrap&quot; style=&quot;margin-top:12px&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Artifact&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Files found&lt;/th&gt;&lt;th&gt;Expected location&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;checks-table&quot;&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot; class=&quot;empty&quot;&gt;No diagnostics available.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;h3 class=&quot;section-title&quot; style=&quot;margin-top:18px&quot;&gt;Execution state&lt;/h3&gt;
        &lt;div class=&quot;table-wrap&quot; style=&quot;margin-top:12px;max-height:260px&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Generated artifacts&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;modules-table&quot;&gt;&lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;empty&quot;&gt;No execution metadata loaded.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;h3 class=&quot;section-title&quot; style=&quot;margin-top:18px&quot;&gt;Issues and warnings&lt;/h3&gt;
        &lt;div class=&quot;issues-list&quot; id=&quot;issues-list&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div class=&quot;empty&quot;&gt;No checks have been executed yet.&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/main&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
&#x27;use strict&#x27;;
const $ = id =&gt; document.getElementById(id);
function esc(v){return String(v ?? &#x27;&#x27;).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;).replaceAll(&quot;&#x27;&quot;,&#x27;&amp;#039;&#x27;);}
function badge(status){const cls=status===&#x27;ok&#x27;?&#x27;ok&#x27;:status===&#x27;warning&#x27;?&#x27;warning&#x27;:&#x27;error&#x27;;const label=status===&#x27;ok&#x27;?&#x27;Available&#x27;:status===&#x27;warning&#x27;?&#x27;Partial&#x27;:&#x27;Missing&#x27;;return `&lt;span class=&quot;badge ${cls}&quot;&gt;${label}&lt;/span&gt;`;}
function dot(status){return `&lt;span class=&quot;status-dot ${status===&#x27;ok&#x27;?&#x27;loaded&#x27;:status===&#x27;warning&#x27;?&#x27;warning&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;`;}
function summaryCard(label,value,note){return `&lt;div class=&quot;summary-card&quot;&gt;&lt;div class=&quot;summary-label&quot;&gt;${esc(label)}&lt;/div&gt;&lt;div class=&quot;summary-value&quot;&gt;${esc(value)}&lt;/div&gt;&lt;div class=&quot;summary-note&quot;&gt;${esc(note)}&lt;/div&gt;&lt;/div&gt;`;}
function fileRow(title,status,path,count){return `&lt;div class=&quot;file-status-row&quot;&gt;${dot(status)}&lt;div&gt;&lt;div class=&quot;file-title&quot;&gt;${esc(title)} · ${status===&#x27;ok&#x27;?&#x27;Loaded&#x27;:status===&#x27;warning&#x27;?&#x27;Partial&#x27;:&#x27;Missing&#x27;}&lt;/div&gt;&lt;div class=&quot;file-path&quot;&gt;${esc(path)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;badge ${status===&#x27;ok&#x27;?&#x27;ok&#x27;:status===&#x27;warning&#x27;?&#x27;warning&#x27;:&#x27;error&#x27;}&quot;&gt;${esc(count)}&lt;/div&gt;&lt;/div&gt;`;}
function renderDiagnostics(data){
  data = data || { selected:false, checks:[], modules:[], issues:[] };
  $(&#x27;diagnostics-status&#x27;).textContent = data.selected ? &#x27;Loaded&#x27; : &#x27;Pending&#x27;;
  $(&#x27;run-name&#x27;).textContent = data.runName || &#x27;—&#x27;;
  const checks = data.checks || [];
  const ok = checks.filter(c =&gt; c.status === &#x27;ok&#x27;).length;
  const partial = checks.filter(c =&gt; c.status === &#x27;warning&#x27;).length;
  const missing = checks.filter(c =&gt; c.status === &#x27;error&#x27;).length;
  const totalFiles = checks.reduce((n,c)=&gt;n+(Number(c.count)||0),0);
  $(&#x27;summary-grid&#x27;).innerHTML = [
    summaryCard(&#x27;Selected run&#x27;, data.runName || &#x27;—&#x27;, data.selected ? &#x27;The dashboard is reading this RUN folder.&#x27; : &#x27;No RUN folder has been selected.&#x27;),
    summaryCard(&#x27;Artifact groups&#x27;, `${ok}/${checks.length || 0}`, &#x27;Expected output groups available.&#x27;),
    summaryCard(&#x27;Files detected&#x27;, totalFiles, &#x27;Files found in the expected module output folders.&#x27;),
    summaryCard(&#x27;Warnings&#x27;, partial + missing + (data.issues ? data.issues.filter(i =&gt; i.level !== &#x27;ok&#x27;).length : 0), &#x27;Missing or inconsistent items requiring review.&#x27;)
  ].join(&#x27;&#x27;);
  $(&#x27;loaded-files-panel&#x27;).innerHTML = checks.length ? checks.map(c =&gt; fileRow(`${c.module} · ${c.artifact}`, c.status, c.path, c.count || 0)).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;empty&quot;&gt;No artifact checks are available.&lt;/div&gt;&#x27;;
  $(&#x27;checks-table&#x27;).innerHTML = checks.length ? checks.map(c =&gt; `&lt;tr&gt;&lt;td&gt;${esc(c.module)}&lt;/td&gt;&lt;td&gt;${esc(c.artifact)}&lt;/td&gt;&lt;td&gt;${badge(c.status)}&lt;/td&gt;&lt;td&gt;${esc(c.count || 0)}&lt;div class=&quot;path&quot;&gt;${esc((c.examples||[]).join(&#x27;, &#x27;))}&lt;/div&gt;&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;${esc(c.path)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;5&quot; class=&quot;empty&quot;&gt;No diagnostics available.&lt;/td&gt;&lt;/tr&gt;&#x27;;
  const modules = data.modules || [];
  $(&#x27;modules-table&#x27;).innerHTML = modules.length ? modules.map(m =&gt; `&lt;tr&gt;&lt;td&gt;${esc(m.module)}&lt;/td&gt;&lt;td&gt;${esc(m.status || &#x27;unknown&#x27;)}&lt;/td&gt;&lt;td&gt;${esc(m.generatedArtifacts ?? &#x27;—&#x27;)}&lt;/td&gt;&lt;td class=&quot;path&quot;&gt;${esc(m.notes || &#x27;&#x27;)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;empty&quot;&gt;No execution metadata loaded.&lt;/td&gt;&lt;/tr&gt;&#x27;;
  const issues = data.issues || [];
  $(&#x27;issues-list&#x27;).innerHTML = issues.length ? issues.map(i =&gt; `&lt;div class=&quot;issue ${i.level === &#x27;error&#x27; ? &#x27;error&#x27; : i.level === &#x27;ok&#x27; ? &#x27;ok&#x27; : &#x27;&#x27;}&quot;&gt;&lt;strong&gt;${esc(i.title)}&lt;/strong&gt;&lt;div class=&quot;path&quot;&gt;${esc(i.message)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;issue ok&quot;&gt;&lt;strong&gt;No critical issue detected&lt;/strong&gt;&lt;div class=&quot;path&quot;&gt;All available checks are consistent with the selected RUN folder.&lt;/div&gt;&lt;/div&gt;&#x27;;
}
window.receiveDiagnosticsFromParent = renderDiagnostics;
window.refreshDiagnosticsDashboard = function(){ if (window.parent &amp;&amp; typeof window.parent.updateRunDiagnostics === &#x27;function&#x27;) window.parent.updateRunDiagnostics(); };
document.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; renderDiagnostics(null));
})();
&lt;/script&gt;
&lt;/body&gt;

<script>
'use strict';

let starRootHandle = null;
let currentRunHandle = null;
let currentRunName = null;
let starRunFiles = null;
let starRunSelectionMode = null;

const $ = (id) => document.getElementById(id);

/*
  STAR output layout currently used by the orchestrator:

  STAR/Output/RUN_XXXXX/modules_output/END-001/output_constellation_optimizer
  STAR/Output/RUN_XXXXX/modules_output/END-003/results_attitude_propagator
  STAR/Output/RUN_XXXXX/modules_output/END-004/output_power_budget
  STAR/Output/RUN_XXXXX/modules_output/END-004/results_power_budget
  STAR/Output/RUN_XXXXX/modules_output/END-007/results_synthetic_data_generation
  STAR/Output/RUN_XXXXX/modules_output/END-010/output_reflectance_determination
  STAR/Output/RUN_XXXXX/modules_output/END-010/results_reflectance_determination/Frames

  The selected directory is the RUN_XXXXX folder itself. This avoids reading stale files from the old flat STAR/Output/output_* and STAR/Output/results_* folders.
*/
const STAR_KIND_PATHS = {
  reflectance: {
    csv: ['modules_output', 'END-010', 'output_reflectance_determination'],
    frames: ['modules_output', 'END-010', 'results_reflectance_determination', 'Frames']
  },
  constellation: {
    plot: ['modules_output', 'END-001', 'results_constellation_optimizer'],
    input: ['modules_output', 'END-001'],
    satellites: ['modules_output', 'END-001', 'output_constellation_optimizer']
  },
  attitude: {
    data: ['modules_output', 'END-003', 'results_attitude_propagator'],
    input: ['modules_output', 'END-003'],
    png: ['modules_output', 'END-003', 'results_attitude_propagator']
  },
  power: {
    all: ['modules_output', 'END-004'],
    product: ['modules_output', 'END-004', 'output_power_budget'],
    results: ['modules_output', 'END-004', 'results_power_budget']
  },
  synthetic: {
    png: ['modules_output', 'END-007', 'results_synthetic_data_generation']
  },
  collision: {
    all: ['modules_output', 'END-016'],
    product: ['modules_output', 'END-016', 'output_collision_avoidance'],
    results: ['modules_output', 'END-016', 'results_collision_avoidance']
  },
  thermal: {
    all: ['modules_output', 'END-018'],
    product: ['modules_output', 'END-018', 'output_components_thermal_analysis'],
    results: ['modules_output', 'END-018', 'results_components_thermal_analysis']
  },
  compsel: {
    all: ['modules_output', 'END-019'],
    product: ['modules_output', 'END-019', 'output_component_selector'],
    results: ['modules_output', 'END-019', 'results_component_selector']
  }
};

function setupTheme() {
  const saved = localStorage.getItem('star-unified-theme') || 'dark';
  const theme = saved === 'light' ? 'light' : 'dark';
  setTheme(theme, false);
}

function setTheme(theme, persist = true) {
  document.documentElement.dataset.theme = theme;
  if (persist) localStorage.setItem('star-unified-theme', theme);
  const themeSwitch = $('theme-switch');
  const themeLabel = $('theme-label');
  if (themeSwitch) themeSwitch.checked = theme === 'light';
  if (themeLabel) themeLabel.textContent = theme === 'light' ? 'Light' : 'Dark';
  propagateTheme(theme);
}

function propagateTheme(theme) {
  for (const frame of [$('frame-constellation'), $('frame-attitude'), $('frame-powerviz'), $('frame-synthetic'), $('frame-reflectance'), $('frame-collision'), $('frame-thermal'), $('frame-compsel'), $('frame-diagnostics')]) {
    try {
      const doc = frame.contentDocument;
      if (!doc) continue;
      doc.documentElement.dataset.theme = theme;

      const childSwitch = doc.getElementById('theme-switch');
      const childLabel = doc.getElementById('theme-label');
      if (childSwitch) childSwitch.checked = theme === 'light';
      if (childLabel) childLabel.textContent = theme === 'light' ? 'Light' : 'Dark';

      frame.contentWindow.dispatchEvent(new Event('resize'));
    } catch (error) {
      console.warn('Unable to propagate theme to a child frame:', error);
    }
  }
}

async function collectFilesFromDirectoryHandle(handle, pathPrefix = '') {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === 'file') {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${pathPrefix}${name}`;
      files.push(file);
    } else if (entry.kind === 'directory') {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${pathPrefix}${name}/`));
    }
  }
  return files;
}

function hasRunFolderSelection() {
  return Boolean(starRootHandle) || (Array.isArray(starRunFiles) && starRunFiles.length > 0);
}

function selectedRunName() {
  return currentRunName || (starRootHandle && starRootHandle.name) || 'Selected RUN folder';
}

function selectedPathLabel(pathParts) {
  return `${selectedRunName()}/${pathParts.join('/')}`;
}

function getRunRelativePath(file) {
  const raw = String(file.relativeDisplayPath || file.webkitRelativePath || file.name || '').replace(/\\/g, '/');
  const parts = raw.split('/').filter(Boolean);
  if (!parts.length) return raw;
  const anchors = ['modules_output', 'intermediate', 'planning', 'module_inputs', 'reports', 'logs', 'input'];
  let anchorIndex = -1;
  for (const anchor of anchors) {
    const idx = parts.findIndex(part => part === anchor);
    if (idx >= 0 && (anchorIndex < 0 || idx < anchorIndex)) anchorIndex = idx;
  }
  if (anchorIndex >= 0) return parts.slice(anchorIndex).join('/');
  if (/^RUN[_-]/i.test(parts[0]) && parts.length > 1) return parts.slice(1).join('/');
  return parts.join('/');
}

function inferRunNameFromFiles(files) {
  const first = Array.from(files || []).find(file => file && (file.webkitRelativePath || file.relativeDisplayPath));
  if (!first) return 'Selected RUN folder';
  const firstPart = String(first.webkitRelativePath || first.relativeDisplayPath || '').replace(/\\/g, '/').split('/').filter(Boolean)[0];
  return firstPart || 'Selected RUN folder';
}

function decorateRunFile(file, displayPath) {
  try { file.relativeDisplayPath = displayPath; } catch (_) {}
  return file;
}

function filesFromSelectedRunPath(pathParts) {
  if (!Array.isArray(starRunFiles)) return [];
  const target = pathParts.join('/').replace(/\/+/g, '/').replace(/\/$/, '');
  const prefix = `${target}/`;
  return starRunFiles
    .map(file => ({ file, rel: getRunRelativePath(file) }))
    .filter(item => item.rel === target || item.rel.startsWith(prefix))
    .map(item => decorateRunFile(item.file, `${selectedRunName()}/${item.rel}`));
}

function fileFromSelectedRunPath(pathParts) {
  if (!Array.isArray(starRunFiles)) return null;
  const target = pathParts.join('/').replace(/\/+/g, '/').replace(/^\//, '');
  const item = starRunFiles
    .map(file => ({ file, rel: getRunRelativePath(file) }))
    .find(candidate => candidate.rel === target);
  return item ? decorateRunFile(item.file, `${selectedRunName()}/${item.rel}`) : null;
}

async function collectFilesFromSelectedPath(pathParts) {
  if (Array.isArray(starRunFiles)) return filesFromSelectedRunPath(pathParts);
  if (!starRootHandle) return [];
  const handle = await resolveDirectoryHandle(starRootHandle, pathParts);
  return await collectFilesFromDirectoryHandle(handle, `${selectedPathLabel(pathParts)}/`);
}

async function selectRunFolderViaInput() {
  const input = $('star-root-folder-input');
  if (!input) throw new Error('The fallback RUN folder input is not available in the results interface.');
  return await new Promise((resolve, reject) => {
    const onChange = () => {
      const files = Array.from(input.files || []);
      input.value = '';
      if (!files.length) {
        reject(new DOMException('No RUN folder was selected.', 'AbortError'));
        return;
      }
      const hasModulesOutput = files.some(file => getRunRelativePath(file).startsWith('modules_output/'));
      if (!hasModulesOutput) {
        reject(new Error('The selected directory is not a valid STAR RUN folder because no modules_output directory was detected. Select RUN_XXXXX, not STAR and not Output.'));
        return;
      }
      starRunFiles = files;
      starRootHandle = null;
      currentRunHandle = null;
      currentRunName = inferRunNameFromFiles(files);
      starRunSelectionMode = 'file-list';
      updateRootStatus();
      resolve({ name: currentRunName, files: starRunFiles });
    };
    input.addEventListener('change', onChange, { once: true });
    input.click();
  });
}

async function listRunFolders(rootHandle) {
  if (!rootHandle) return [];
  if (/^RUN[_-]/i.test(rootHandle.name)) return [{ name: rootHandle.name, handle: rootHandle }];
  return [];
}

async function ensureCurrentRunFolder() {
  if (currentRunHandle) return currentRunHandle;
  if (hasRunFolderSelection()) {
    currentRunHandle = starRootHandle;
    currentRunName = starRootHandle.name;
    updateRootStatus();
    return currentRunHandle;
  }
  if (Array.isArray(starRunFiles) && starRunFiles.length > 0) {
    currentRunName = currentRunName || inferRunNameFromFiles(starRunFiles);
    updateRootStatus();
    return { name: currentRunName };
  }
  throw new Error('No RUN output folder has been selected.');
}

async function resolveDirectoryHandle(rootHandle, pathParts) {
  let current = rootHandle;
  for (const part of pathParts) {
    if (part === '$RUN') {
      current = await ensureCurrentRunFolder();
    } else {
      current = await current.getDirectoryHandle(part);
    }
  }
  return current;
}

async function ensureStarRootFolder() {
  if (hasRunFolderSelection()) {
    await ensureCurrentRunFolder();
    return starRootHandle || { name: selectedRunName() };
  }

  if ('showDirectoryPicker' in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode:'read', id:'star-run-folder', startIn:'desktop' });
      try {
        await handle.getDirectoryHandle('modules_output');
      } catch (error) {
        throw new Error('The selected directory is not a valid STAR RUN folder because it does not contain modules_output. Select RUN_XXXXX, not STAR and not Output.');
      }
      starRootHandle = handle;
      starRunFiles = null;
      currentRunHandle = handle;
      currentRunName = handle.name;
      starRunSelectionMode = 'directory-handle';
      updateRootStatus();
      return starRootHandle;
    } catch (error) {
      if (error && error.name === 'AbortError') throw error;
      console.warn('Directory-handle RUN selection failed. Falling back to the standard folder input:', error);
    }
  }

  return await selectRunFolderViaInput();
}

function updateRootStatus() {
  const dot = $('root-status-dot');
  const text = $('root-status-text');
  if (hasRunFolderSelection()) {
    dot.classList.add('loaded');
    const modeLabel = starRunSelectionMode === 'file-list' ? 'file-list selection' : 'directory access';
    text.textContent = `RUN folder selected: ${selectedRunName()} · ${modeLabel}`;
  } else {
    dot.classList.remove('loaded');
    text.textContent = 'RUN output folder not selected. Select a RUN_XXXXX folder to load modules_output.';
  }
}

async function pickFallbackDirectoryFromStar() {
  if (Array.isArray(starRunFiles)) {
    return { files: starRunFiles.map(file => decorateRunFile(file, `${selectedRunName()}/${getRunRelativePath(file)}`)), label: selectedRunName() };
  }
  const options = { mode:'read', id:'star-child-folder' };
  if (starRootHandle) options.startIn = starRootHandle;
  const handle = await window.showDirectoryPicker(options);
  const files = await collectFilesFromDirectoryHandle(handle, `${handle.name}/`);
  return { files, label: handle.name };
}

window.STAR_PICK_DIRECTORY = async function(moduleName, kind) {
  try {
    await ensureStarRootFolder();
    const targetPath = STAR_KIND_PATHS[moduleName]?.[kind];

    if (targetPath) {
      if (Array.isArray(starRunFiles)) {
        const files = filesFromSelectedRunPath(targetPath);
        if (files.length) return { files, label: selectedPathLabel(targetPath) };
        console.warn('The expected RUN subdirectory was not found in the selected file-list. Opening the fallback selection.');
      } else {
        try {
          const targetHandle = await resolveDirectoryHandle(starRootHandle, targetPath);
          const files = await collectFilesFromDirectoryHandle(targetHandle, `${selectedPathLabel(targetPath)}/`);
          return { files, label: selectedPathLabel(targetPath) };
        } catch (error) {
          console.warn('The expected RUN subdirectory was not found. Opening a manual folder picker from the selected RUN folder:', error);
        }
      }
    }

    return await pickFallbackDirectoryFromStar();
  } catch (error) {
    if (error && error.name === 'AbortError') return null;
    console.warn('RUN directory selection failed:', error);
    return null;
  }
};

async function readTextFileFromPath(rootHandle, pathParts) {
  if (Array.isArray(starRunFiles)) {
    const file = fileFromSelectedRunPath(pathParts);
    if (!file) throw new Error(`File not found in selected RUN folder: ${pathParts.join('/')}`);
    return await file.text();
  }
  const dirParts = pathParts.slice(0, -1);
  const fileName = pathParts[pathParts.length - 1];
  const dirHandle = await resolveDirectoryHandle(rootHandle, dirParts);
  const fileHandle = await dirHandle.getFileHandle(fileName);
  const file = await fileHandle.getFile();
  return await file.text();
}

function parseAttitudeDataJs(text) {
  const match = String(text || '').trim().match(/(?:window\.)?attitudePropagationData\s*=\s*([\s\S]*?)\s*;?\s*$/);
  if (!match) throw new Error('attitudePropagationData not found in attitude_propagation_plots_data.js');
  return JSON.parse(match[1]);
}

function deliverAttitudeDataToFrame(sourceLabel = null) {
  const frame = $('frame-attitude');
  if (!frame || !window.attitudePropagationData) return false;
  try {
    if (frame.contentWindow && typeof frame.contentWindow.receiveAttitudeDataFromParent === 'function') {
      frame.contentWindow.receiveAttitudeDataFromParent(
        window.attitudePropagationData,
        sourceLabel || `${currentRunName || 'RUN_XXXXX'}/modules_output/END-003/results_attitude_propagator`
      );
      return true;
    }
  } catch (error) {
    console.warn('Unable to deliver attitude data to child frame:', error);
  }
  return false;
}

async function loadAttitudeDataFromStarRoot() {
  if (!hasRunFolderSelection()) return false;
  const frame = $('frame-attitude');
  try {
    const resultsPath = ['modules_output','END-003','results_attitude_propagator'];
    const inputPath = ['modules_output','END-003'];
    const resultsLabel = selectedPathLabel(resultsPath);
    const inputLabel = selectedPathLabel(inputPath);
    const resultFiles = await collectFilesFromSelectedPath(resultsPath);
    let inputFiles = [];
    try {
      inputFiles = await collectFilesFromSelectedPath(inputPath);
    } catch (inputError) {
      console.warn('Unable to load END-003 runtime input files from the selected RUN folder:', inputError);
    }

    const jsFile = resultFiles.find(file => String(file.name).toLowerCase() === 'attitude_propagation_plots_data.js');
    if (jsFile) {
      const text = await jsFile.text();
      window.attitudePropagationData = parseAttitudeDataJs(text);
    }

    if (frame && frame.contentWindow && typeof frame.contentWindow.receiveAttitudeFilesFromParent === 'function') {
      await frame.contentWindow.receiveAttitudeFilesFromParent(
        { resultFiles, inputFiles },
        { results: resultsLabel, input: inputLabel }
      );
      return true;
    }

    if (window.attitudePropagationData) {
      return deliverAttitudeDataToFrame(resultsLabel);
    }
    return false;
  } catch (error) {
    console.warn('Unable to load END-003 attitude data from the selected RUN folder:', error);
    return false;
  }
}

function deliverSyntheticFilesToFrame(files, sourceLabel = null) {
  const frame = $('frame-synthetic');
  if (!frame || !files) return false;
  try {
    if (frame.contentWindow && typeof frame.contentWindow.receiveSyntheticFilesFromParent === 'function') {
      frame.contentWindow.receiveSyntheticFilesFromParent(
        files,
        sourceLabel || `${currentRunName || 'RUN_XXXXX'}/modules_output/END-007/results_synthetic_data_generation`
      );
      return true;
    }
  } catch (error) {
    console.warn('Unable to deliver synthetic data files to child frame:', error);
  }

async function getDirectoryHandleIfExists(rootHandle, pathParts) {
  try {
    return await resolveDirectoryHandle(rootHandle, pathParts);
  } catch (_) {
    return null;
  }
}

async function getFilesIfDirectoryExists(rootHandle, pathParts) {
  if (Array.isArray(starRunFiles)) return filesFromSelectedRunPath(pathParts);
  const dir = await getDirectoryHandleIfExists(rootHandle, pathParts);
  if (!dir) return [];
  return await collectFilesFromDirectoryHandle(dir, `${selectedPathLabel(pathParts)}/`);
}

function countMatchingFiles(files, matcher) {
  const matched = Array.from(files || []).filter(file => matcher(file.name, file));
  return {
    count: matched.length,
    examples: matched.slice(0, 5).map(file => file.name)
  };
}

async function readJsonFileFromPathIfExists(rootHandle, pathParts) {
  try {
    const text = await readTextFileFromPath(rootHandle, pathParts);
    return JSON.parse(text);
  } catch (_) {
    return null;
  }
}

function moduleDisplayName(moduleId) {
  const names = {
    'END-001': 'Constellation Optimizer',
    'END-003': 'Attitude Propagation',
    'END-004': 'Power Budget',
    'END-006': 'Scenario Generation',
    'END-007': 'Synthetic Data Generation',
    'END-010': 'Reflectance Determination',
    'END-016': 'Collision Avoidance',
    'END-018': 'Components Thermal Analysis',
    'END-019': 'Satellite Design Component Selector'
  };
  return names[moduleId] || moduleId;
}

async function buildRunDiagnostics() {
  if (!hasRunFolderSelection()) {
    return { selected: false, runName: null, checks: [], modules: [], issues: [{ level: 'warning', title: 'No RUN folder selected', message: 'Select a RUN_XXXXX folder to inspect module outputs.' }] };
  }

  const checksConfig = [
    { module:'END-001', artifact:'Constellation plot data', path:['modules_output','END-001','results_constellation_optimizer'], matcher:name=>/^constellation_plots_data\.js$/i.test(name) },
    { module:'END-001', artifact:'Satellite detail JSON files', path:['modules_output','END-001','output_constellation_optimizer'], matcher:name=>/^satellite_\d+\.json$/i.test(name) },
    { module:'END-001', artifact:'Constellation figures', path:['modules_output','END-001','results_constellation_optimizer'], matcher:name=>/\.(png|jpg|jpeg|html)$/i.test(name) },
    { module:'END-003', artifact:'Attitude dashboard data', path:['modules_output','END-003','results_attitude_propagator'], matcher:name=>/^attitude_propagation_plots_data\.(js|json)$/i.test(name) },
    { module:'END-003', artifact:'Attitude CSV outputs', path:['modules_output','END-003','output_attitude_propagation'], matcher:name=>/\.csv$/i.test(name) },
    { module:'END-003', artifact:'Selected passes (satellite, date, start/end)', path:['modules_output','END-003','results_attitude_propagator'], matcher:name=>/^selected_passes\.json$/i.test(name) },
    { module:'END-003', artifact:'Attitude figures', path:['modules_output','END-003','results_attitude_propagator'], matcher:name=>/\.(png|jpg|jpeg)$/i.test(name) },
    { module:'END-004', artifact:'Power-budget product tables', path:['modules_output','END-004','output_power_budget'], matcher:name=>/^power_budget_(sheet1|foglio1|summary|subsystems)\.(csv|json)$/i.test(name) },
    { module:'END-004', artifact:'Power-budget frontend data', path:['modules_output','END-004','results_power_budget'], matcher:name=>/^power_budget_tables\.js$/i.test(name) },
    { module:'END-004', artifact:'Power-budget figures', path:['modules_output','END-004','results_power_budget'], matcher:name=>/\.(png|jpg|jpeg)$/i.test(name) },
    { module:'END-007', artifact:'Synthetic frames', path:['modules_output','END-007','results_synthetic_data_generation'], matcher:name=>/\.(png|jpg|jpeg|webp)$/i.test(name) },
    { module:'END-010', artifact:'Reflectance flux CSV', path:['modules_output','END-010','output_reflectance_determination'], matcher:name=>/^flux\.csv$/i.test(name) },
    { module:'END-010', artifact:'Reflectance frames', path:['modules_output','END-010','results_reflectance_determination','Frames'], matcher:name=>/\.(png|jpg|jpeg|webp)$/i.test(name) },
    { module:'END-010', artifact:'Reflectance plots', path:['modules_output','END-010','results_reflectance_determination'], matcher:name=>/\.(png|jpg|jpeg|html)$/i.test(name) },
    { module:'END-016', artifact:'Space-safety summary and close approaches', path:['modules_output','END-016','output_collision_avoidance'], matcher:name=>/^(space_safety_summary\.json|intra_close_approaches\.csv|intra_pair_min_distance\.csv|disposal_lifetime\.csv)$/i },
    { module:'END-016', artifact:'Collision-avoidance run information', path:['modules_output','END-016','results_collision_avoidance'], matcher:name=>/^collision_run_info\.json$/i },
    { module:'END-018', artifact:'Thermal time series and summaries', path:['modules_output','END-018','output_components_thermal_analysis'], matcher:name=>/^(output_thermal_.+\.csv|thermal_summary_.+\.json|thermal_constellation_output\.csv)$/i },
    { module:'END-018', artifact:'Thermal run information', path:['modules_output','END-018','results_components_thermal_analysis'], matcher:name=>/^thermal_run_info\.json$/i },
    { module:'END-019', artifact:'Component-selector results', path:['modules_output','END-019','output_component_selector'], matcher:name=>/^component_selector_(results\.json|bom\.csv|power_handoff\.json)$/i.test(name) },
    { module:'END-019', artifact:'Component-selector frontend data and report', path:['modules_output','END-019','results_component_selector'], matcher:name=>/^component_selector_(data\.js|report\.html)$/i.test(name) }
  ];

  const checks = [];
  for (const cfg of checksConfig) {
    const files = await getFilesIfDirectoryExists(starRootHandle, cfg.path);
    const matched = countMatchingFiles(files, cfg.matcher);
    const exists = files.length > 0;
    checks.push({
      module: cfg.module,
      artifact: cfg.artifact,
      path: selectedPathLabel(cfg.path),
      count: matched.count,
      examples: matched.examples,
      status: matched.count > 0 ? 'ok' : exists ? 'warning' : 'error'
    });
  }

  const modules = [];
  const execution = await readJsonFileFromPathIfExists(starRootHandle, ['intermediate','execution_results.json']);
  const stepList = Array.isArray(execution?.execution_results)
    ? execution.execution_results
    : Array.isArray(execution?.steps)
      ? execution.steps
      : Array.isArray(execution?.workflow_steps)
        ? execution.workflow_steps
        : Array.isArray(execution?.modules)
          ? execution.modules
          : [];
  for (const step of stepList) {
    const moduleId = step.module_id || step.end_id || step.id || step.module || 'UNKNOWN';
    const status = step.status || step.execution_status || step.result_status || 'unknown';
    const artifacts = step.generated_artifacts;
    const generated = Array.isArray(artifacts)
      ? artifacts.length
      : typeof artifacts === 'string'
        ? artifacts.split(';').map(item => item.trim()).filter(Boolean).length
        : step.generated_artifacts_count ?? step.generatedArtifacts ?? '—';
    modules.push({ module: `${moduleId} · ${moduleDisplayName(moduleId)}`, status, generatedArtifacts: generated, notes: step.error || step.message || step.output_dir || step.module_input_file || '' });
  }

  for (const moduleId of ['END-001','END-003','END-004','END-007','END-010','END-016','END-018','END-019']) {
    const processJsonName = moduleId.toLowerCase().replace('-', '') + '_process_result.json';
    const process = await readJsonFileFromPathIfExists(starRootHandle, ['modules_output', moduleId, processJsonName]);
    if (process) {
      modules.push({ module: `${moduleId} · process result`, status: process.status || process.returncode || 'recorded', generatedArtifacts: Array.isArray(process.generated_artifacts) ? process.generated_artifacts.length : '—', notes: process.output_dir || process.message || '' });
    }
  }

  const issues = [];
  for (const check of checks) {
    if (check.status === 'error') {
      issues.push({ level:'error', title:`Missing ${check.module} artifact group`, message:`No expected files were found in ${check.path}.` });
    } else if (check.status === 'warning') {
      issues.push({ level:'warning', title:`Partial ${check.module} artifact group`, message:`The directory exists, but the expected artifact type was not detected in ${check.path}.` });
    }
  }

  const end010Process = await readJsonFileFromPathIfExists(starRootHandle, ['modules_output','END-010','end010_process_result.json']);
  const processText = JSON.stringify(end010Process || {});
  if (end010Process && currentRunName && !processText.includes(currentRunName)) {
    issues.push({ level:'warning', title:'END-010 run identifier mismatch', message:'The END-010 process metadata does not reference the currently selected RUN folder. Verify that the reflectance outputs were generated by this run and were not copied from an earlier execution.' });
  }

  if (!issues.length) {
    issues.push({ level:'ok', title:'No critical output issue detected', message:'The expected artifact groups are available in the selected RUN folder.' });
  }

  return { selected:true, runName: selectedRunName(), checks, modules, issues };
}

async function updateRunDiagnostics() {
  const frame = $('frame-diagnostics');
  if (!frame) return false;
  try {
    const diagnostics = await buildRunDiagnostics();
    if (frame.contentWindow && typeof frame.contentWindow.receiveDiagnosticsFromParent === 'function') {
      frame.contentWindow.receiveDiagnosticsFromParent(diagnostics);
      return true;
    }
  } catch (error) {
    console.warn('Unable to update run diagnostics:', error);
  }
  return false;
}
window.updateRunDiagnostics = updateRunDiagnostics;

function scheduleAttitudeDataDelivery() {
  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (window.attitudePropagationData && deliverAttitudeDataToFrame()) clearInterval(timer);
    if (tries > 30) clearInterval(timer);
  }, 200);
}

function switchTab(tabName) {
  for (const button of document.querySelectorAll('.tab-button')) {
    button.classList.toggle('active', button.dataset.tab === tabName);
  }

  const frameByTab = {
    constellation: $('frame-constellation'),
    attitude: $('frame-attitude'),
    powerviz: $('frame-powerviz'),
    synthetic: $('frame-synthetic'),
    reflectance: $('frame-reflectance'),
    collision: $('frame-collision'),
    thermal: $('frame-thermal'),
    compsel: $('frame-compsel'),
    diagnostics: $('frame-diagnostics')
  };

  Object.entries(frameByTab).forEach(([name, frame]) => {
    frame.classList.toggle('active', name === tabName);
  });

  setTimeout(() => {
    const activeFrame = frameByTab[tabName] || $('frame-constellation');
    (async () => {
      try {
        if (tabName === 'constellation' && hasRunFolderSelection()) {
          await loadConstellationFromStarRoot();
        }
        if (tabName === 'attitude') {
          if (!window.attitudePropagationData && hasRunFolderSelection()) await loadAttitudeDataFromStarRoot();
          if (window.attitudePropagationData) deliverAttitudeDataToFrame();
        }
        if (tabName === 'powerviz' && hasRunFolderSelection()) {
          await loadPowerInsightsFromStarRoot();
        }
        if (tabName === 'synthetic' && hasRunFolderSelection()) {
          await loadSyntheticImagesFromStarRoot();
        }
        if (tabName === 'reflectance' && hasRunFolderSelection()) {
          await loadReflectanceFromStarRoot();
        }
        if (tabName === 'collision' && hasRunFolderSelection()) {
          await loadCollisionAvoidanceFromStarRoot();
        }
        if (tabName === 'thermal' && hasRunFolderSelection()) {
          await loadThermalAnalysisFromStarRoot();
        }
        if (tabName === 'compsel' && hasRunFolderSelection()) {
          await loadComponentSelectorFromStarRoot();
        }
        if (tabName === 'diagnostics') {
          await updateRunDiagnostics();
        }
        activeFrame.contentWindow.dispatchEvent(new Event('resize'));
        if (typeof activeFrame.contentWindow.refreshCollisionDashboard === 'function') activeFrame.contentWindow.refreshCollisionDashboard();
        if (typeof activeFrame.contentWindow.refreshThermalDashboard === 'function') activeFrame.contentWindow.refreshThermalDashboard();
        if (typeof activeFrame.contentWindow.refreshComponentSelectorDashboard === 'function') activeFrame.contentWindow.refreshComponentSelectorDashboard();
        if (typeof activeFrame.contentWindow.refreshConstellationDashboard === 'function') activeFrame.contentWindow.refreshConstellationDashboard();
        if (typeof activeFrame.contentWindow.refreshAttitudeDashboard === 'function') activeFrame.contentWindow.refreshAttitudeDashboard();
        if (typeof activeFrame.contentWindow.refreshPowerInsightsDashboard === 'function') activeFrame.contentWindow.refreshPowerInsightsDashboard();
        if (typeof activeFrame.contentWindow.refreshSyntheticDashboard === 'function') activeFrame.contentWindow.refreshSyntheticDashboard();
        if (typeof activeFrame.contentWindow.refreshReflectanceDashboard === 'function') activeFrame.contentWindow.refreshReflectanceDashboard();
        if (typeof activeFrame.contentWindow.refreshDiagnosticsDashboard === 'function') activeFrame.contentWindow.refreshDiagnosticsDashboard();
        if (activeFrame.contentWindow.Plotly) {
          const ids = ['plotWeights','plotGround','plot3D','plot3DECEF','plotAngularVelocity','plotEulerAngles','plotTorquesLinear','plotTorquesLog','plotEnergy','plotAltitude','plotElevation','plotNadirOffset','plotTargetOffset','plotHMag','plotHDir','plotGroundTrack','plotOrbitECI','plotOrbitECEF'];
          ids.forEach(id => { const el = activeFrame.contentDocument.getElementById(id); if (el && el.data) activeFrame.contentWindow.Plotly.Plots.resize(el); });
        }
      } catch (error) { console.warn('Unable to refresh active child frame:', error); }
    })();
  }, 160);
}

function bindEvents() {
  const themeSwitch = $('theme-switch');
  if (themeSwitch) themeSwitch.addEventListener('change', event => setTheme(event.target.checked ? 'light' : 'dark'));
  $('star-root-button').addEventListener('click', async () => {
    try {
      await ensureStarRootFolder();
      await loadConstellationFromStarRoot();
      await loadAttitudeDataFromStarRoot();
      await loadPowerInsightsFromStarRoot();
      await loadSyntheticImagesFromStarRoot();
      await loadReflectanceFromStarRoot();
      await loadCollisionAvoidanceFromStarRoot();
      await loadThermalAnalysisFromStarRoot();
      await loadComponentSelectorFromStarRoot();
      await updateRunDiagnostics();
      deliverAttitudeDataToFrame();
    } catch (error) {
      console.warn(error);
      updateRootStatus();
    }
  });

  for (const button of document.querySelectorAll('.tab-button')) {
    button.addEventListener('click', () => switchTab(button.dataset.tab));
  }

  for (const frame of [$('frame-constellation'), $('frame-attitude'), $('frame-powerviz'), $('frame-synthetic'), $('frame-reflectance'), $('frame-collision'), $('frame-thermal'), $('frame-compsel'), $('frame-diagnostics')]) {
    frame.addEventListener('load', () => {
      if (frame.id === 'frame-collision' && hasRunFolderSelection()) {
        loadCollisionAvoidanceFromStarRoot();
      }
      if (frame.id === 'frame-thermal' && hasRunFolderSelection()) {
        loadThermalAnalysisFromStarRoot();
      }
      if (frame.id === 'frame-compsel' && hasRunFolderSelection()) {
        loadComponentSelectorFromStarRoot();
      }
      propagateTheme(document.documentElement.dataset.theme || 'dark');
      if (frame.id === 'frame-attitude') {
        if (window.attitudePropagationData) deliverAttitudeDataToFrame();
        else if (hasRunFolderSelection()) loadAttitudeDataFromStarRoot();
      }
      if (frame.id === 'frame-constellation' && hasRunFolderSelection()) {
        loadConstellationFromStarRoot();
      }
      if (frame.id === 'frame-powerviz' && hasRunFolderSelection()) {
        loadPowerInsightsFromStarRoot();
      }
      if (frame.id === 'frame-synthetic' && hasRunFolderSelection()) {
        loadSyntheticImagesFromStarRoot();
      }
      if (frame.id === 'frame-reflectance' && hasRunFolderSelection()) {
        loadReflectanceFromStarRoot();
      }
      if (frame.id === 'frame-diagnostics') {
        updateRunDiagnostics();
      }
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setupTheme();
  bindEvents();
  updateRootStatus();
  scheduleAttitudeDataDelivery();
});
window.addEventListener('star-attitude-data-ready', () => {
  deliverAttitudeDataToFrame();
});
</script>
