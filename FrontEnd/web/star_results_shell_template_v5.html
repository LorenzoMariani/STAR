<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STAR — Results FrontEnd</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap');

:root{
  --bg:#090a0d;
  --panel:#11141c;
  --panel-strong:#151925;
  --panel-muted:#0d1017;
  --border:#232838;
  --border-soft:rgba(114,125,151,.22);
  --text:#d7dde9;
  --text-strong:#ffffff;
  --muted:#7d879a;
  --muted-2:#9aa3b4;
  --accent:#e8ff47;
  --accent-2:#4dffc3;
  --danger:#ff5c7a;
  --success:#61f6a8;
  --plot-bg:#090a0d;
  --shadow:0 24px 80px rgba(0,0,0,.32);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f5f8;
  --panel:#ffffff;
  --panel-strong:#f8fafc;
  --panel-muted:#eef2f7;
  --border:#d9e0eb;
  --border-soft:rgba(45,55,72,.13);
  --text:#222b3b;
  --text-strong:#070b12;
  --muted:#667085;
  --muted-2:#475467;
  --accent:#667c00;
  --accent-2:#007a66;
  --danger:#bd2450;
  --success:#047857;
  --plot-bg:#ffffff;
  --shadow:0 18px 60px rgba(31,41,55,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at top left,rgba(77,255,195,.10),transparent 32rem),
    radial-gradient(circle at top right,rgba(232,255,71,.08),transparent 36rem),
    var(--bg);
  color:var(--text);
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:13px;
  line-height:1.5;
}
button{font:inherit;border:1px solid var(--border);background:var(--panel-strong);color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .16s ease,border-color .16s ease,background .16s ease}
button:hover{transform:translateY(-1px);border-color:var(--accent-2)}
.primary-action{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#07100d;font-weight:700}
.app-shell{width:min(1920px,100%);margin:0 auto;padding:18px}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:18px 20px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  box-shadow:var(--shadow);
  position:sticky;
  top:12px;
  z-index:50;
  backdrop-filter:blur(18px);
}
.header h1{
  margin:0;
  font-family:'Syne',Inter,system-ui,sans-serif;
  font-size:clamp(19px,2vw,28px);
  line-height:1.05;
  color:var(--text-strong);
  letter-spacing:-.03em;
  text-transform:uppercase;
}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.theme-toggle{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel-muted);
  color:var(--muted-2);
  user-select:none;
}
.switch{position:relative;width:48px;height:26px;display:inline-flex;align-items:center}
.switch input{opacity:0;width:0;height:0}
.slider-switch{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:.22s ease;box-shadow:inset 0 0 0 1px var(--border-soft)}
.slider-switch:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:var(--text-strong);transition:.22s ease}
.switch input:checked+.slider-switch{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.switch input:checked+.slider-switch:before{transform:translateX(22px);background:#07100d}
.tab-shell{
  margin-top:18px;
  border:1px solid var(--border);
  border-radius:22px;
  background:color-mix(in srgb,var(--panel) 95%,transparent);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.tab-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px;
  border-bottom:1px solid var(--border);
  background:var(--panel-strong);
  flex-wrap:wrap;
}
.tab-buttons{display:flex;gap:8px;flex-wrap:wrap}
.tab-button{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-width:190px;
  min-height:54px;
  font-family:'Syne',Inter,system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:11px;
  line-height:1.05;
  color:var(--muted-2);
  background:var(--panel-muted);
}
.tab-button .tab-code{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em}
.tab-button .tab-title{font-size:12px;font-weight:700;letter-spacing:.035em;margin-top:4px}
.tab-button.active{
  border-color:transparent;
  background:var(--accent-2);
  color:#07100d;
  font-weight:800;
}
.root-status{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:11px;
  flex-wrap:wrap;
}
.status-dot{width:10px;height:10px;border-radius:999px;background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.status-dot.loaded{background:var(--success);box-shadow:0 0 0 4px color-mix(in srgb,var(--success) 18%,transparent)}
.frame-wrap{height:calc(100vh - 162px);min-height:720px;background:var(--bg)}
.tab-frame{width:100%;height:100%;border:0;display:none;background:transparent}
.tab-frame.active{display:block}
.note{
  margin-top:12px;
  color:var(--muted);
  font-size:11px;
}
code{color:var(--accent-2)}
@media(max-width:980px){
  .header{align-items:flex-start;flex-direction:column;position:static}
  .header-actions{justify-content:flex-start;width:100%}
  .frame-wrap{height:78vh;min-height:650px}
}

.header-actions .theme-toggle{display:none!important;}

/* STAR v2 unified-results compact layout patch */
.header.results-header-removed{display:none!important;}
.app-shell{padding:8px 10px 10px!important;}
.tab-shell{margin-top:0!important;border-radius:16px!important;}
.tab-bar{padding:6px 8px!important;gap:8px!important;align-items:center!important;}
.tab-buttons{gap:6px!important;align-items:center!important;flex-wrap:wrap!important;}
.tab-button{
  min-width:auto!important;
  min-height:34px!important;
  height:34px!important;
  padding:5px 10px!important;
  flex-direction:row!important;
  align-items:center!important;
  gap:6px!important;
  border-radius:10px!important;
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace!important;
  letter-spacing:.01em!important;
  line-height:1!important;
}
.tab-button .tab-code{font-size:10px!important;line-height:1!important;letter-spacing:.01em!important;}
.tab-button .tab-title{font-size:10px!important;line-height:1!important;margin-top:0!important;letter-spacing:.01em!important;white-space:nowrap!important;}
.run-folder-action{
  min-height:34px!important;
  height:34px!important;
  padding:5px 12px!important;
  border-radius:10px!important;
  font-size:10px!important;
  line-height:1!important;
  white-space:nowrap!important;
  flex:0 0 auto!important;
}
.root-status{font-size:10px!important;line-height:1.2!important;gap:8px!important;}
.status-dot{width:8px!important;height:8px!important;}
.frame-wrap{height:calc(100vh - 64px)!important;min-height:660px!important;}
@media(max-width:980px){.frame-wrap{height:78vh!important;min-height:620px!important}.tab-button{height:32px!important;min-height:32px!important}.run-folder-action{height:32px!important;min-height:32px!important}}


/* ==================================================================
   STAR frontend v5 (2026-10-18): module tabs styled like the workflow tabs of the execution page (light-blue pills,
   selected one in blue), larger text; the content of the module tabs is shown 12% larger (RESULTS_CONTENT_ZOOM).
   ================================================================== */
.tab-bar{gap:8px!important;align-items:center!important}
.tab-buttons{gap:8px!important}
.tab-button{background:#dbeafe!important;color:#0f172a!important;border:1px solid rgba(47,140,255,.30)!important;border-radius:999px!important;
  padding:6px 13px!important;min-height:0!important;height:auto!important;font-family:Arial,sans-serif!important;font-size:13px!important;
  font-weight:700!important;text-transform:none!important;letter-spacing:0!important;box-shadow:none!important}
.tab-button:hover{background:#bfdbfe!important}
.tab-button .tab-code,.tab-button .tab-title{font-family:Arial,sans-serif!important;font-size:13px!important;text-transform:none!important;
  letter-spacing:0!important;color:inherit!important}
.tab-button .tab-code{font-weight:800!important;margin-right:6px!important}
.tab-button .tab-title{font-weight:600!important}
.tab-button.active{background:#1768d8!important;color:#ffffff!important;border-color:rgba(15,23,42,.16)!important}
#star-root-button{font-size:13px!important;padding:7px 15px!important;border-radius:999px!important}
#root-status-text{font-size:12.5px!important}
</style>

<script>
'use strict';

let starRootHandle = null;
let currentRunHandle = null;
let currentRunName = null;
let starRunFiles = null;
let starRunSelectionMode = null;

const $ = (id) => document.getElementById(id);

/*
  STAR output layout currently used by the orchestrator:

  STAR/Output/RUN_XXXXX/modules_output/END-001/output_constellation_optimizer
  STAR/Output/RUN_XXXXX/modules_output/END-003/results_attitude_propagator
  STAR/Output/RUN_XXXXX/modules_output/END-004/output_power_budget
  STAR/Output/RUN_XXXXX/modules_output/END-004/results_power_budget
  STAR/Output/RUN_XXXXX/modules_output/END-007/results_synthetic_data_generation
  STAR/Output/RUN_XXXXX/modules_output/END-010/output_reflectance_determination
  STAR/Output/RUN_XXXXX/modules_output/END-010/results_reflectance_determination/Frames

  The selected directory is the RUN_XXXXX folder itself. This avoids reading stale files from the old flat STAR/Output/output_* and STAR/Output/results_* folders.
*/
const STAR_KIND_PATHS = {
  reflectance: {
    csv: ['modules_output', 'END-010', 'output_reflectance_determination'],
    frames: ['modules_output', 'END-010', 'results_reflectance_determination', 'Frames']
  },
  constellation: {
    plot: ['modules_output', 'END-001', 'results_constellation_optimizer'],
    input: ['modules_output', 'END-001'],
    satellites: ['modules_output', 'END-001', 'output_constellation_optimizer']
  },
  attitude: {
    data: ['modules_output', 'END-003', 'results_attitude_propagator'],
    input: ['modules_output', 'END-003'],
    png: ['modules_output', 'END-003', 'results_attitude_propagator']
  },
  power: {
    all: ['modules_output', 'END-004'],
    product: ['modules_output', 'END-004', 'output_power_budget'],
    results: ['modules_output', 'END-004', 'results_power_budget']
  },
  synthetic: {
    png: ['modules_output', 'END-007', 'results_synthetic_data_generation']
  },
  collision: {
    all: ['modules_output', 'END-016'],
    product: ['modules_output', 'END-016', 'output_collision_avoidance'],
    results: ['modules_output', 'END-016', 'results_collision_avoidance']
  },
  thermal: {
    all: ['modules_output', 'END-019'],
    product: ['modules_output', 'END-019', 'output_components_thermal_analysis'],
    results: ['modules_output', 'END-019', 'results_components_thermal_analysis']
  },
  compsel: {
    all: ['modules_output', 'END-006'],
    product: ['modules_output', 'END-006', 'output_component_selector'],
    results: ['modules_output', 'END-006', 'results_component_selector']
  }
};

function setupTheme() {
  const saved = localStorage.getItem('star-unified-theme') || 'dark';
  const theme = saved === 'light' ? 'light' : 'dark';
  setTheme(theme, false);
}

function setTheme(theme, persist = true) {
  document.documentElement.dataset.theme = theme;
  if (persist) localStorage.setItem('star-unified-theme', theme);
  const themeSwitch = $('theme-switch');
  const themeLabel = $('theme-label');
  if (themeSwitch) themeSwitch.checked = theme === 'light';
  if (themeLabel) themeLabel.textContent = theme === 'light' ? 'Light' : 'Dark';
  propagateTheme(theme);
}

function propagateTheme(theme) {
  for (const frame of [$('frame-constellation'), $('frame-attitude'), $('frame-powerviz'), $('frame-synthetic'), $('frame-reflectance'), $('frame-collision'), $('frame-thermal'), $('frame-compsel'), $('frame-compliance'), $('frame-cefloop'), $('frame-diagnostics')]) {
    try {
      const doc = frame.contentDocument;
      if (!doc) continue;
      doc.documentElement.dataset.theme = theme;

      const childSwitch = doc.getElementById('theme-switch');
      const childLabel = doc.getElementById('theme-label');
      if (childSwitch) childSwitch.checked = theme === 'light';
      if (childLabel) childLabel.textContent = theme === 'light' ? 'Light' : 'Dark';

      frame.contentWindow.dispatchEvent(new Event('resize'));
    } catch (error) {
      console.warn('Unable to propagate theme to a child frame:', error);
    }
  }
}

async function collectFilesFromDirectoryHandle(handle, pathPrefix = '') {
  const files = [];
  for await (const [name, entry] of handle.entries()) {
    if (entry.kind === 'file') {
      const file = await entry.getFile();
      file.relativeDisplayPath = `${pathPrefix}${name}`;
      files.push(file);
    } else if (entry.kind === 'directory') {
      files.push(...await collectFilesFromDirectoryHandle(entry, `${pathPrefix}${name}/`));
    }
  }
  return files;
}

function hasRunFolderSelection() {
  return Boolean(starRootHandle) || (Array.isArray(starRunFiles) && starRunFiles.length > 0);
}

function selectedRunName() {
  return currentRunName || (starRootHandle && starRootHandle.name) || 'Selected RUN folder';
}

function selectedPathLabel(pathParts) {
  return `${selectedRunName()}/${pathParts.join('/')}`;
}

function getRunRelativePath(file) {
  if (file && file.runRelativePath) return file.runRelativePath;
  const raw = String(file.relativeDisplayPath || file.webkitRelativePath || file.name || '').replace(/\\/g, '/');
  const parts = raw.split('/').filter(Boolean);
  if (!parts.length) return raw;
  const anchors = ['modules_output', 'intermediate', 'planning', 'module_inputs', 'reports', 'logs', 'input'];
  let anchorIndex = -1;
  for (const anchor of anchors) {
    const idx = parts.findIndex(part => part === anchor);
    if (idx >= 0 && (anchorIndex < 0 || idx < anchorIndex)) anchorIndex = idx;
  }
  if (anchorIndex >= 0) return parts.slice(anchorIndex).join('/');
  if (/^RUN[_-]/i.test(parts[0]) && parts.length > 1) return parts.slice(1).join('/');
  return parts.join('/');
}

function inferRunNameFromFiles(files) {
  const first = Array.from(files || []).find(file => file && (file.webkitRelativePath || file.relativeDisplayPath));
  if (!first) return 'Selected RUN folder';
  const firstPart = String(first.webkitRelativePath || first.relativeDisplayPath || '').replace(/\\/g, '/').split('/').filter(Boolean)[0];
  return firstPart || 'Selected RUN folder';
}

function decorateRunFile(file, displayPath) {
  try { file.relativeDisplayPath = displayPath; } catch (_) {}
  return file;
}

function filesFromSelectedRunPath(pathParts) {
  if (!Array.isArray(starRunFiles)) return [];
  const target = pathParts.join('/').replace(/\/+/g, '/').replace(/\/$/, '');
  const prefix = `${target}/`;
  return starRunFiles
    .map(file => ({ file, rel: getRunRelativePath(file) }))
    .filter(item => item.rel === target || item.rel.startsWith(prefix))
    .map(item => decorateRunFile(item.file, `${selectedRunName()}/${item.rel}`));
}

function fileFromSelectedRunPath(pathParts) {
  if (!Array.isArray(starRunFiles)) return null;
  const target = pathParts.join('/').replace(/\/+/g, '/').replace(/^\//, '');
  const item = starRunFiles
    .map(file => ({ file, rel: getRunRelativePath(file) }))
    .find(candidate => candidate.rel === target);
  return item ? decorateRunFile(item.file, `${selectedRunName()}/${item.rel}`) : null;
}

async function collectFilesFromSelectedPath(pathParts) {
  if (Array.isArray(starRunFiles)) return filesFromSelectedRunPath(pathParts);
  if (!starRootHandle) return [];
  const handle = await resolveDirectoryHandle(starRootHandle, pathParts);
  return await collectFilesFromDirectoryHandle(handle, `${selectedPathLabel(pathParts)}/`);
}

async function selectRunFolderViaInput() {
  const input = $('star-root-folder-input');
  if (!input) throw new Error('The fallback RUN folder input is not available in the results interface.');
  return await new Promise((resolve, reject) => {
    const onChange = () => {
      const files = Array.from(input.files || []);
      input.value = '';
      if (!files.length) {
        reject(new DOMException('No RUN folder was selected.', 'AbortError'));
        return;
      }
      const hasModulesOutput = files.some(file => getRunRelativePath(file).startsWith('modules_output/'));
      if (!hasModulesOutput) {
        reject(new Error('The selected directory is not a valid STAR RUN folder because no modules_output directory was detected. Select RUN_XXXXX, not STAR and not Output.'));
        return;
      }
      starRunFiles = files;
      starRootHandle = null;
      currentRunHandle = null;
      currentRunName = inferRunNameFromFiles(files);
      starRunSelectionMode = 'file-list';
      updateRootStatus();
      resolve({ name: currentRunName, files: starRunFiles });
    };
    input.addEventListener('change', onChange, { once: true });
    input.click();
  });
}

async function listRunFolders(rootHandle) {
  if (!rootHandle) return [];
  if (/^RUN[_-]/i.test(rootHandle.name)) return [{ name: rootHandle.name, handle: rootHandle }];
  return [];
}

async function ensureCurrentRunFolder() {
  if (currentRunHandle) return currentRunHandle;
  if (starRootHandle) {             // directory access (a file-list selection has no handle: next branch)
    currentRunHandle = starRootHandle;
    currentRunName = starRootHandle.name;
    updateRootStatus();
    return currentRunHandle;
  }
  if (Array.isArray(starRunFiles) && starRunFiles.length > 0) {
    currentRunName = currentRunName || inferRunNameFromFiles(starRunFiles);
    updateRootStatus();
    return { name: currentRunName };
  }
  throw new Error('No RUN output folder has been selected.');
}

async function resolveDirectoryHandle(rootHandle, pathParts) {
  let current = rootHandle;
  for (const part of pathParts) {
    if (part === '$RUN') {
      current = await ensureCurrentRunFolder();
    } else {
      current = await current.getDirectoryHandle(part);
    }
  }
  return current;
}

// 2026-10-18: inside the STAR window the RUN folder is chosen with the native dialog of STAR, which opens in
// <STAR root>/Output (the browser folder picker cannot start in a given folder). STAR serves the chosen RUN read-only on
// 127.0.0.1: each file is a placeholder File (name, size, path relative to the RUN) whose content is fetched only when a
// tab reads it (text(), arrayBuffer()) or shows it (URL.createObjectURL gives its served URL). Outside STAR (a plain
// browser) the browser picker below is used.
let starServedRun = null;

function starPywebviewApi() {
  for (const w of [window, window.parent, window.parent && window.parent.parent, window.top]) {
    try { if (w && w.pywebview && w.pywebview.api && typeof w.pywebview.api.results_pick_run_folder === 'function') return w.pywebview.api; } catch (_) {}
  }
  return null;
}

function servedRunFile(baseUrl, runName, entry) {
  const file = new File([], entry.rel.split('/').pop());
  const url = baseUrl + entry.rel.split('/').map(encodeURIComponent).join('/');
  const get = () => fetch(url, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(`${r.status} ${entry.rel}`); return r; });
  Object.defineProperty(file, 'size', { value: Number(entry.size) || 0 });
  file.runRelativePath = entry.rel;
  file.relativeDisplayPath = `${runName}/${entry.rel}`;
  file.starUrl = url;
  file.text = () => get().then(r => r.text());
  file.arrayBuffer = () => get().then(r => r.arrayBuffer());
  return file;
}

function patchServedObjectUrls(win) {
  try {
    if (!win || !win.URL || win.URL.__starServedRunPatch) return;
    const create = win.URL.createObjectURL.bind(win.URL);
    const revoke = win.URL.revokeObjectURL.bind(win.URL);
    win.URL.createObjectURL = obj => (obj && obj.starUrl) ? obj.starUrl : create(obj);
    win.URL.revokeObjectURL = url => { if (String(url).startsWith('blob:')) revoke(url); };
    win.URL.__starServedRunPatch = true;
  } catch (error) {
    console.warn('Unable to patch the object URLs of a frame:', error);
  }
}

// v5: the content of every module tab is shown larger (the module pages are shared with frontend v4, so the zoom is
// applied from here, on each load of their frame)
const RESULTS_CONTENT_ZOOM = '1.12';
function applyResultsContentZoom(frame) {
  try {
    const doc = frame && frame.contentDocument;
    if (doc && doc.documentElement) doc.documentElement.style.zoom = RESULTS_CONTENT_ZOOM;
  } catch (error) {
    console.warn('Unable to zoom a result frame:', error);
  }
}

function patchAllServedObjectUrls() {
  patchServedObjectUrls(window);
  for (const frame of document.querySelectorAll('iframe.tab-frame')) patchServedObjectUrls(frame.contentWindow);
}

async function selectRunFolderViaStar(api) {
  const info = await api.results_pick_run_folder();
  if (!info || info.cancelled) throw new DOMException('No RUN folder was selected.', 'AbortError');
  if (!info.ok) throw new Error(info.error || 'The RUN folder could not be opened.');
  starServedRun = { name: info.name, path: info.path, relative: info.relative_to_star, baseUrl: info.base_url };
  starRunFiles = info.files.map(entry => servedRunFile(info.base_url, info.name, entry));
  starRootHandle = null;
  currentRunHandle = null;
  currentRunName = info.name;
  starRunSelectionMode = 'star-output';
  patchAllServedObjectUrls();
  updateRootStatus();
  return { name: currentRunName, files: starRunFiles };
}

async function ensureStarRootFolder(options = {}) {
  const starApi = starPywebviewApi();
  if (starApi && (options.choose || !hasRunFolderSelection())) {
    return await selectRunFolderViaStar(starApi);
  }
  if (hasRunFolderSelection()) {
    await ensureCurrentRunFolder();
    return starRootHandle || { name: selectedRunName() };
  }

  if ('showDirectoryPicker' in window) {
    try {
      const handle = await window.showDirectoryPicker({ mode:'read', id:'star-run-folder', startIn:'desktop' });
      try {
        await handle.getDirectoryHandle('modules_output');
      } catch (error) {
        throw new Error('The selected directory is not a valid STAR RUN folder because it does not contain modules_output. Select RUN_XXXXX, not STAR and not Output.');
      }
      starRootHandle = handle;
      starRunFiles = null;
      currentRunHandle = handle;
      currentRunName = handle.name;
      starRunSelectionMode = 'directory-handle';
      updateRootStatus();
      return starRootHandle;
    } catch (error) {
      if (error && error.name === 'AbortError') throw error;
      console.warn('Directory-handle RUN selection failed. Falling back to the standard folder input:', error);
    }
  }

  return await selectRunFolderViaInput();
}

function updateRootStatus() {
  const dot = $('root-status-dot');
  const text = $('root-status-text');
  if (hasRunFolderSelection()) {
    dot.classList.add('loaded');
    if (starRunSelectionMode === 'star-output' && starServedRun) {
      text.textContent = `RUN folder selected: ${starServedRun.relative} · press Select RUN Folder to choose another RUN or the same one to reload it`;
      return;
    }
    const modeLabel = starRunSelectionMode === 'file-list' ? 'file-list selection' : 'directory access';
    text.textContent = `RUN folder selected: ${selectedRunName()} · ${modeLabel} · press Select RUN Folder again to reload the outputs`;
  } else {
    dot.classList.remove('loaded');
    text.textContent = 'RUN output folder not selected. Select a RUN_XXXXX folder to load modules_output.';
  }
}

  }
  const options = { mode:'read', id:'star-child-folder' };
  if (starRootHandle) options.startIn = starRootHandle;
  const handle = await window.showDirectoryPicker(options);

window.STAR_PICK_DIRECTORY = async function(moduleName, kind) {
  try {
    await ensureStarRootFolder();
    const targetPath = STAR_KIND_PATHS[moduleName]?.[kind];

    if (targetPath) {
      if (Array.isArray(starRunFiles)) {
        const files = filesFromSelectedRunPath(targetPath);
        if (files.length) return { files, label: selectedPathLabel(targetPath) };
        console.warn('The expected RUN subdirectory was not found in the selected file-list. Opening the fallback selection.');
      } else {
        try {
          const targetHandle = await resolveDirectoryHandle(starRootHandle, targetPath);
          const files = await collectFilesFromDirectoryHandle(targetHandle, `${selectedPathLabel(targetPath)}/`);
          return { files, label: selectedPathLabel(targetPath) };
        } catch (error) {
          console.warn('The expected RUN subdirectory was not found. Opening a manual folder picker from the selected RUN folder:', error);
        }
      }
    }

    return await pickFallbackDirectoryFromStar();
  } catch (error) {
    if (error && error.name === 'AbortError') return null;
    console.warn('RUN directory selection failed:', error);
    return null;
  }
};

async function readTextFileFromPath(rootHandle, pathParts) {
  if (Array.isArray(starRunFiles)) {
    const file = fileFromSelectedRunPath(pathParts);
    if (!file) throw new Error(`File not found in selected RUN folder: ${pathParts.join('/')}`);
    return await file.text();
  }
  const dirParts = pathParts.slice(0, -1);
  const fileName = pathParts[pathParts.length - 1];
  const dirHandle = await resolveDirectoryHandle(rootHandle, dirParts);
  const fileHandle = await dirHandle.getFileHandle(fileName);

  return await file.text();
}

  };
}

    checks.push({
      module: cfg.module,
      artifact: cfg.artifact,
      path: selectedPathLabel(cfg.path),
      count: matched.count,
      examples: matched.examples,
      status: matched.count > 0 ? 'ok' : exists ? 'warning' : 'error'
    });
  }

  const modules = [];
  const execution = await readJsonFileFromPathIfExists(starRootHandle, ['intermediate','execution_results.json']);
  const stepList = Array.isArray(execution?.execution_results)
    ? execution.execution_results
    : Array.isArray(execution?.steps)
      ? execution.steps
      : Array.isArray(execution?.workflow_steps)
        ? execution.workflow_steps
        : Array.isArray(execution?.modules)
          ? execution.modules
          : [];
  for (const step of stepList) {
    const moduleId = step.module_id || step.end_id || step.id || step.module || 'UNKNOWN';
    const status = step.status || step.execution_status || step.result_status || 'unknown';
    const artifacts = step.generated_artifacts;
    const generated = Array.isArray(artifacts)
      ? artifacts.length
      : typeof artifacts === 'string'
        ? artifacts.split(';').map(item => item.trim()).filter(Boolean).length
        : step.generated_artifacts_count ?? step.generatedArtifacts ?? '—';
    modules.push({ module: `${moduleId} · ${moduleDisplayName(moduleId)}`, status, generatedArtifacts: generated, notes: (Array.isArray(step.fallbacks) && step.fallbacks.length ? `Fallback (${step.fallback_severity || 'minor'}): ${step.fallbacks.map(f => f.item).join(', ')}` : '') || step.skipped_because || step.error || step.message || step.output_dir || step.module_input_file || '' });
  }

  for (const moduleId of ['END-001','END-003','END-004','END-006','END-007','END-010','END-016','END-019']) {
    const processJsonName = moduleId.toLowerCase().replace('-', '') + '_process_result.json';
    const process = await readJsonFileFromPathIfExists(starRootHandle, ['modules_output', moduleId, processJsonName]);
    if (process) {
      modules.push({ module: `${moduleId} · process result`, status: process.status || process.returncode || 'recorded', generatedArtifacts: Array.isArray(process.generated_artifacts) ? process.generated_artifacts.length : '—', notes: process.output_dir || process.message || '' });
    }
  }

  const issues = [];
  for (const check of checks) {
    if (check.status === 'error') {
      issues.push({ level:'error', title:`Missing ${check.module} artifact group`, message:`No expected files were found in ${check.path}.` });
    } else if (check.status === 'warning') {
      issues.push({ level:'warning', title:`Partial ${check.module} artifact group`, message:`The directory exists, but the expected artifact type was not detected in ${check.path}.` });
    }
  }

  const end010Process = await readJsonFileFromPathIfExists(starRootHandle, ['modules_output','END-010','end010_process_result.json']);
  const processText = JSON.stringify(end010Process || {});
  if (end010Process && currentRunName && !processText.includes(currentRunName)) {
    issues.push({ level:'warning', title:'END-010 run identifier mismatch', message:'The END-010 process metadata does not reference the currently selected RUN folder. Verify that the reflectance outputs were generated by this run and were not copied from an earlier execution.' });
  }

  if (!issues.length) {
    issues.push({ level:'ok', title:'No critical output issue detected', message:'The expected artifact groups are available in the selected RUN folder.' });
  }

  return { selected:true, runName: selectedRunName(), checks, modules, issues };
}

async function updateRunDiagnostics() {
  const frame = $('frame-diagnostics');
  if (!frame) return false;
  try {
    const diagnostics = await buildRunDiagnostics();
    if (frame.contentWindow && typeof frame.contentWindow.receiveDiagnosticsFromParent === 'function') {
      frame.contentWindow.receiveDiagnosticsFromParent(diagnostics);
      return true;
    }
  } catch (error) {
    console.warn('Unable to update run diagnostics:', error);
  }
  return false;
}
window.updateRunDiagnostics = updateRunDiagnostics;

function scheduleAttitudeDataDelivery() {
  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (window.attitudePropagationData && deliverAttitudeDataToFrame()) clearInterval(timer);
    if (tries > 30) clearInterval(timer);
  }, 200);
}

// 2026-10-18: each tab reads its RUN data once, the first time it is shown (visible) after the RUN selection. Before,
// every click re-read the files and the module re-processed them (thousands of END-007 frames, ~13 MB of END-006 data)
// and selecting the RUN read every tab at once, freezing the window. Later clicks only show the tab, redrawn when its
// size changed while it was hidden (window resized). "Select RUN Folder" pressed again reads the data again (outputs of
// a run still in progress).
const TAB_FRAMES = {
  constellation: 'frame-constellation', attitude: 'frame-attitude', powerviz: 'frame-powerviz', synthetic: 'frame-synthetic',
  reflectance: 'frame-reflectance', collision: 'frame-collision', thermal: 'frame-thermal', compsel: 'frame-compsel',
  compliance: 'frame-compliance', cefloop: 'frame-cefloop', diagnostics: 'frame-diagnostics'
};
const TAB_LOADERS = {
  constellation: loadConstellationFromStarRoot,
  attitude: async () => {
    const ok = hasRunFolderSelection() ? await loadAttitudeDataFromStarRoot() : false;
    if (window.attitudePropagationData) deliverAttitudeDataToFrame();
    return ok || Boolean(window.attitudePropagationData);
  },
  powerviz: loadPowerInsightsFromStarRoot,
  synthetic: loadSyntheticImagesFromStarRoot,
  reflectance: loadReflectanceFromStarRoot,
  collision: loadCollisionAvoidanceFromStarRoot,
  thermal: loadThermalAnalysisFromStarRoot,
  compsel: loadComponentSelectorFromStarRoot,
  compliance: loadComplianceFromStarRoot,
  cefloop: loadCefLoopFromStarRoot,
  diagnostics: updateRunDiagnostics
};
// module redraws; refreshDiagnosticsDashboard is left out because it scans the RUN again (its loader already did)
const TAB_REFRESH_FUNCTIONS = ['refreshCollisionDashboard', 'refreshThermalDashboard', 'refreshComponentSelectorDashboard',
  'refreshConstellationDashboard', 'refreshAttitudeDashboard', 'refreshPowerInsightsDashboard', 'refreshSyntheticDashboard',
  'refreshReflectanceDashboard', 'refreshComplianceDashboard', 'refreshCefLoopDashboard'];
const tabLoads = {};    // tab -> { run, promise, size }: data read for the selected RUN, frame size at the last redraw

function activeTabName() {
  const button = document.querySelector('.tab-button.active');
  return button ? button.dataset.tab : 'constellation';
}

function runSelectionKey() {
  return hasRunFolderSelection() ? `${starRunSelectionMode}|${selectedRunName()}` : '';
}

function invalidateTabData(tabName = null) {
  for (const name of tabName ? [tabName] : Object.keys(tabLoads)) delete tabLoads[name];
}

// true when this call read the data; false when it was already read (or is being read) for the selected RUN, or there is
// nothing to read. A loader that fails is tried again at the next visit.
async function ensureTabLoaded(tabName) {
  const run = runSelectionKey();
  const existing = tabLoads[tabName];
  if (existing && existing.run === run) { await existing.promise; return false; }
  const loader = TAB_LOADERS[tabName];
  if (!loader || (!run && tabName !== 'diagnostics' && tabName !== 'attitude')) return false;
  const entry = { run, size: null };
  entry.promise = (async () => {
    let ok = false;
    try { ok = await loader(); } catch (error) { console.warn(`Unable to load the ${tabName} tab:`, error); }
    if (ok === false && tabLoads[tabName] === entry) delete tabLoads[tabName];
    return ok;
  })();
  tabLoads[tabName] = entry;
  await entry.promise;
  return true;
}

function redrawTab(frame) {
  const win = frame.contentWindow;
  if (!win) return;
  win.dispatchEvent(new Event('resize'));
  for (const name of TAB_REFRESH_FUNCTIONS) {
    if (typeof win[name] === 'function') win[name]();
  }
  if (win.Plotly) {
    const ids = ['plotWeights','plotGround','plot3D','plot3DECEF','plotAngularVelocity','plotEulerAngles','plotTorquesLinear','plotTorquesLog','plotEnergy','plotAltitude','plotElevation','plotNadirOffset','plotTargetOffset','plotHMag','plotHDir','plotGroundTrack','plotOrbitECI','plotOrbitECEF'];
    ids.forEach(id => { const el = frame.contentDocument.getElementById(id); if (el && el.data) win.Plotly.Plots.resize(el); });
  }
}

async function showTab(tabName) {
  const frame = $(TAB_FRAMES[tabName]) || $('frame-constellation');
  try {
    const fresh = await ensureTabLoaded(tabName);
    if (activeTabName() !== tabName) return;            // another tab was opened meanwhile: redrawn at its next visit
    const entry = tabLoads[tabName];
    const size = `${frame.clientWidth}x${frame.clientHeight}`;
    if (!fresh && entry && entry.size === size) return;  // already drawn at this size
    redrawTab(frame);
    if (entry) entry.size = size;
  } catch (error) { console.warn('Unable to refresh active child frame:', error); }
}

function switchTab(tabName) {
  for (const button of document.querySelectorAll('.tab-button')) {
    button.classList.toggle('active', button.dataset.tab === tabName);
  }
  Object.entries(TAB_FRAMES).forEach(([name, id]) => {
    $(id).classList.toggle('active', name === tabName);
  });
  setTimeout(() => showTab(tabName), 160);
}

function bindEvents() {
  const themeSwitch = $('theme-switch');
  if (themeSwitch) themeSwitch.addEventListener('change', event => setTheme(event.target.checked ? 'light' : 'dark'));
  $('star-root-button').addEventListener('click', async () => {
    try {
      await ensureStarRootFolder({ choose: true });
      invalidateTabData();              // every tab reads the RUN again: the shown one now, the others at their first visit
      await showTab(activeTabName());
    } catch (error) {
      console.warn(error);
      updateRootStatus();
      if (error && error.name !== 'AbortError') $('root-status-text').textContent = String(error.message || error);   // e.g. Output chosen instead of a RUN
    }
  });

  for (const button of document.querySelectorAll('.tab-button')) {
    button.addEventListener('click', () => switchTab(button.dataset.tab));
  }

  for (const [tabName, frameId] of Object.entries(TAB_FRAMES)) {
    applyResultsContentZoom($(frameId));
    $(frameId).addEventListener('load', () => {
      applyResultsContentZoom($(frameId));
      patchServedObjectUrls($(frameId).contentWindow);
      propagateTheme(document.documentElement.dataset.theme || 'dark');
      invalidateTabData(tabName);       // a (re)loaded frame holds no RUN data
      if (tabName === 'attitude' && window.attitudePropagationData && !hasRunFolderSelection()) deliverAttitudeDataToFrame();
      if (tabName === activeTabName()) showTab(tabName);
    });
  }
}

document.addEventListener('DOMContentLoaded', () => {
  setupTheme();
  bindEvents();
  updateRootStatus();
  scheduleAttitudeDataDelivery();
});
window.addEventListener('star-attitude-data-ready', () => {
  deliverAttitudeDataToFrame();
});
</script>
