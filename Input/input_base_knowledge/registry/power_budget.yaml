module_type: digital_twin_module
module_version: 0.1.0
module_id: END-004
module_name: Power Budget
owner: UNIRM1
responsible:
  leader: TBD
  co_leader: TBD
short_description: Preliminary electrical power budget and EPS feasibility assessment.
description: >
  END-004 Power Budget computes a spacecraft power and energy balance from
  subsystem power draws, sun/eclipse duty cycles, solar generation assumptions,
  battery capacity and operational mode allocation. The module is designed to
  consume the END-003 Attitude Propagation output CSV so that propagation time,
  orbit period and mission timing are traceable to the selected workflow.
aliases:
  - power budget
  - EPS power budget
  - electrical power budget
  - battery energy balance
  - solar array sizing
  - operational duty-cycle power analysis
capabilities:
  - Compute per-mode power consumption in sunlight and eclipse.
  - Compute per-orbit energy balance, power margin and battery depth of discharge.
  - Compute daily power balance from the number of idle, transmission and payload orbits.
  - Produce Excel-like tables equivalent to the reference power-budget workbook.
  - Use upstream END-003 orbit and attitude propagation products as timing inputs.
activation_rules:
  include_when_any_requirement_contains:
    - power
    - energy
    - EPS
    - electrical power
    - power budget
    - battery
    - depth of discharge
    - duty cycle
    - solar array
    - payload operation
    - transmission pass
  required_upstream_modules:
    - END-003
planning_guidance: >
  Select END-004 when the user asks for power feasibility, EPS sizing, battery
  depth-of-discharge, operational power margin, solar-generation feasibility or
  a tabular power-budget product. If END-003 is not already in the workflow,
  include END-003 before END-004 so the power budget receives orbit/attitude
  timing information. END-004 may also use END-001 indirectly when END-003 is
  generated from the constellation/orbit solution.
required_inputs:
  - name: attitude_propagation_csv
    data_type: file_path
    required: true
    produced_by: END-003
    unit: csv
    description: Timestamped attitude-propagation CSV generated by END-003.
    missing_information_reason: END-004 derives orbit period, pass duration and timing metadata from this file.
  - name: attitude_runtime_configuration
    data_type: file_path
    required: false
    produced_by: END-003
    unit: json
    description: END-003 runtime configuration JSON containing orbit and propagation metadata.
    assumption_allowed: true
    default_value: generated by END-003 when available
  - name: power_budget_configuration
    data_type: structured_json
    required: false
    unit: json
    description: Subsystem power values, duty cycles, battery capacity, solar generation and daily mode allocation.
    assumption_allowed: true
    default_value: input_power_budget.json
  - name: battery_capacity_Wh
    data_type: number
    required: false
    unit: Wh
    description: Battery capacity used for orbital depth-of-discharge computation.
    assumption_allowed: true
    default_value: 19
  - name: power_generated_per_orbit_Wh
    data_type: number
    required: false
    unit: Wh/orbit
    description: Energy generated by the solar array per orbit.
    assumption_allowed: true
    default_value: 3
  - name: daily_mode_allocation
    data_type: structured_json
    required: false
    unit: orbits/day
    description: Number of daily orbits assigned to idle, transmission and payload operational modes.
    assumption_allowed: true
    default_value:
      idle: 7
      tx_uhf: 0
      tx_sband: 0
      payload: 8
outputs:
  - name: power_budget_summary
    artifact_name: output_power_budget/power_budget_summary.csv
    data_type: csv
    description: Per-mode energy balance, margin and depth-of-discharge table.
  - name: power_budget_subsystems
    artifact_name: output_power_budget/power_budget_subsystems.csv
    data_type: csv
    description: Subsystem-level duty-cycle and energy consumption table.
  - name: power_budget_sheet1
    artifact_name: output_power_budget/power_budget_sheet1.csv
    data_type: csv
    description: Excel-like Sheet1 table layout.
  - name: power_budget_foglio1
    artifact_name: output_power_budget/power_budget_foglio1.csv
    data_type: csv
    description: Excel-like Foglio1 table layout.
  - name: power_budget_tables
    artifact_name: output_power_budget/power_budget_tables.xlsx
    data_type: xlsx
    description: Workbook with Sheet1 and Foglio1 tables when MATLAB writecell supports XLSX export.
  - name: power_budget_frontend_data
    artifact_name: results_power_budget/power_budget_tables.js
    data_type: javascript
    description: JavaScript payload consumed by STAR FrontEnd.
  - name: power_budget_figures
    artifact_name: results_power_budget/*.png
    data_type: image
    description: Diagnostic plots for mode balance, consumption split and orbital DoD.
execution:
  execution_mode: python_runner_matlab_batch
  runner_module: runners.end004_runner
  runner_function: run_end004
  upstream_dependencies:
    - END-003
  downstream_dependencies: []
  estimated_runtime: 30
interface_notes: >
  Duty cycles (2026-10-17) from END-001 operations_summary.json: payload on while the AOI is in the footprint,
  transmitters on during the ground-station contacts (sunlit and eclipse parts), receivers, computers, ADCS and GNSS always
  on, receiver entries dropped for transmit-only radios, published idle/transmit powers of the selected radios; orbits per
  day: payload = orbits with acquisitions, contact mode = orbits with a contact and no acquisition, idle = the rest. Beacon
  and heaters keep the template duty.
  Since 2026-10-17: orbit period from the END-001 altitude of the satellite END-003 selected and eclipse from the END-003 shadow
  fraction (KPI-14), orbits per day from the period (the template values are only a fallback); loads, battery and solar generation of
  the END-019 initial design (spacecraft_definition.json): the template entries of the subsystems it selected with their declared
  peak powers, generation = panel peak power x mean cosine of the Sun incidence on the panel faces in the END-003 attitude
  (attitude_summary.json "illumination") x sunlight time. Inputs the user gave or edited in STAR win; registry first guesses do not.
  The Python runner resolves the current RUN folder, finds the END-003
  output_attitude_propagation.csv file, writes end004_runtime_input.json and
  launches MATLAB in batch mode. Product files are written under
  modules_output/END-004/output_power_budget, while plots and frontend data are
  written under modules_output/END-004/results_power_budget.
