module_id: END-003
module_name: attitude propagation
module_type: digital_twin_module
module_version: "0.1.0"
owner: UNIRM1

responsible:
  leader: Lorenzo Mariani
  co_leader: Fabrizio Piergentili

source_documents:
  - STAR_IDD_END-003.md

description: >
  Propagate the spacecraft attitude kinematics and, when required, attitude
  dynamics along the orbits designed by END-001. In STAR (2026-10-17,
  star_attitude_propagation_star.m) the orbit is not propagated by END-003: it
  is read from the END-001 ephemerides (satellite_NN_ephemeris.csv, ECI state
  every 10 s), so every satellite is exactly the one END-001 designed. The module generates
  time-tagged orbital state vectors, attitude quaternions and pointing-error
  telemetry during selected visibility or tracking windows. These outputs
  provide downstream modules with the spacecraft-target geometry and attitude
  state information required for synthetic data generation, observation
  simulation and attitude visualization. When END-001 delivers a constellation,
  the module screens every satellite and selects (1) the satellite and the
  daylight pass in visibility of the target site used by END-007, and (2) a
  night pass, visible from a ground observer (e.g. the Matera telescope) with
  the satellite sunlit, used by END-010. Since 2026-10-17 both passes are chosen
  by END-001 (pass_selection.json: best daylight pass over the AOI, FIRST useful
  night pass from the observatory) and END-003 computes the attitude on them;
  the selected satellite, pass date and pass start/end times are written to
  selected_passes.json.

capabilities:
  - orbital_propagation
  - attitude_propagation
  - attitude_kinematics
  - attitude_dynamics
  - nadir_pointing_simulation
  - target_tracking
  - follow_site_pointing
  - environmental_disturbance_torque_modeling
  - gravity_gradient_torque_modeling
  - solar_radiation_pressure_torque_modeling
  - aerodynamic_drag_torque_modeling
  - visibility_filtering
  - ground_station_pass_selection
  - pointing_error_estimation
  - spacecraft_state_telemetry_generation
  - synthetic_data_geometry_support
  - attitude_visualization_support
  - constellation_pass_planning
  - daylight_imaging_pass_selection
  - night_pass_selection_for_light_curve
  - ccsds_aem_export
  - attitude_description_figures

domain_of_validity:
  mission_phase:
    - pre_phase_a
    - phase_a
    - design_trade_off
    - simulation_support
  mission_type:
    - earth_observation
    - remote_sensing
    - observation_planning
    - synthetic_data_generation
    - attitude_sensitivity_analysis
  fidelity_level: preliminary_to_intermediate
  notes: >
    The registry entry describes the interface contract required by STAR.
    The internal propagation algorithms and MATLAB implementation remain owned
    by the module provider. The module is especially relevant when downstream
    analyses require time-varying spacecraft attitude, quaternion profiles,
    line-of-sight geometry, pointing offsets or visibility-filtered trajectory
    data.

planning_guidance: >
  Select this module when the requested outputs or downstream modules require
  spacecraft attitude profiles, pointing-law simulation, target tracking,
  visibility-window telemetry, quaternion time histories or pointing-error
  assessment. For Earth observation workflows, this module is normally useful
  between orbit/constellation-level analysis and synthetic data generation when
  synthetic observations must reflect spacecraft attitude and sensor-target
  geometry. Do not select this module for a purely constellation-level revisit
  estimate unless attitude or pointing information is explicitly required.

required_inputs:
  - name: simulation_start_date
    kind: parameter
    data_type: string
    unit: UTC
    required: true
    default_value: null
    assumption_allowed: true
    description: >
      UTC start date of the propagation window, corresponding to
      cfg.sim_start_date in the module input JSON.
    missing_information_reason: >
      Required to define the temporal baseline of the orbital and attitude
      propagation.

  - name: simulation_duration_hours
    kind: parameter
    data_type: float
    unit: h
    required: true
    default_value: 48
    valid_range:
      min: 0.1
      max: 8760
    assumption_allowed: true
    description: >
      Duration of the propagation window, corresponding to cfg.sim_hours in the
      module input JSON. Limited to the span of the END-001 ephemerides
      (DownstreamSimHours of END-001, 48 h by default).
    missing_information_reason: >
      Required to define the time span over which visibility windows, attitude
      states and pointing errors are computed.

  - name: attitude_mode
    kind: parameter
    data_type: string
    unit: "-"
    required: true
    default_value: nadir
    allowed_values:
      - dynamics
      - nadir
      - follow_site
    assumption_allowed: true
    description: >
      Operational attitude configuration. The dynamics mode propagates Euler
      rotational dynamics and quaternion kinematics; nadir mode enforces ideal
      geocentric nadir alignment; follow_site mode uses nadir pointing with an
      automated maneuver toward the target site during visibility windows.
    missing_information_reason: >
      Required to determine whether the module should perform dynamic attitude
      propagation, ideal nadir pointing or target-tracking behaviour.

  - name: initial_attitude_state
    kind: parameter_group
    data_type: object
    unit: mixed
    required: false
    default_value:
      q0: [1.0, 0.0, 0.0, 0.0]
      w0_rad_s: [0.0, 0.0, 0.0]
    assumption_allowed: true
    fields:
      - q0
      - w0
    description: >
      Initial spacecraft attitude quaternion and angular velocity, corresponding
      to cfg.sat.q0 and cfg.sat.w0 in the module input JSON.
    missing_information_reason: >
      Required for dynamic attitude propagation and useful for reproducible
      attitude simulations.

  - name: spacecraft_physical_properties
    kind: parameter_group
    data_type: object
    unit: mixed
    required: false
    required_when: attitude_mode == dynamics
    default_value: null
    assumption_allowed: true
    fields:
      - m
      - A_ref
      - Cr
      - Cd
      - r_cp
      - Ix
      - Iy
      - Iz
    description: >
      Spacecraft mass properties, aerodynamic and radiation-pressure parameters,
      centre-of-pressure vector and principal inertia components, corresponding
      to cfg.sat in the module input JSON.
    missing_information_reason: >
      Required when environmental disturbance torques or full attitude dynamics
      are propagated.

  - name: environmental_flags
    kind: parameter_group
    data_type: object
    unit: "-"
    required: true
    default_value:
      gg: true
      srp: true
      drag: true
      pert: true
      j2: true
      j3: true
    assumption_allowed: true
    fields:
      - gg
      - srp
      - drag
      - pert
      - j2
      - j3
    description: >
      Environmental and perturbation flags controlling gravity-gradient torque,
      solar radiation pressure, aerodynamic drag and orbital perturbations up to
      J2/J3, corresponding to cfg.env.flags in the module input JSON. In STAR
      only gg, srp and drag are used (the orbit comes from END-001).
    missing_information_reason: >
      Required to define propagation fidelity and environmental disturbance
      modelling assumptions.

  - name: output_directory
    kind: execution_parameter
    data_type: string
    unit: "-"
    required: false
    default_value: simulation_outputs
    assumption_allowed: true
    description: >
      Destination folder where CSV telemetry and validation figures are written.
    missing_information_reason: >
      Required only for execution management; if not provided, the module uses
      its default output folder.

consumes:
- product: constellation_output
  required: true
  used_for: Keplerian elements and epoch of the satellites
- product: satellite_ephemerides
  required: true
  used_for: orbits of the satellites (END-003 does not propagate them)
- product: pass_selection
  required: true
  used_for: imaging pass and first night pass the attitude is computed on
- product: ground_stations
  required: false
  used_for: face illumination during the ground-station contacts
  fallback: no illumination in the contacts
- product: spacecraft_definition
  required: true
  used_for: mass, inertia, areas and attitude actuators of the satellite
produces:
- product: attitude_propagation_csv
  path: output_attitude_propagation/output_attitude_propagation.csv
  format: csv
  guaranteed: true
  description: timestamped position and attitude of the imaging pass (Unreal axes)
- product: attitude_propagation_eci
  path: results_attitude_propagator/output_attitude_propagation_ECI.csv
  format: csv
  guaranteed: true
  description: the same pass in ECI axes, quaternion body to ECI
- product: lightcurve_ephemeris
  path: output_attitude_propagation/output_attitude_propagation_lightcurve_ECI.csv
  format: csv
  guaranteed: false
  description: ECI position and nadir attitude during the night pass visible from the observer (only when the pass exists)
- product: selected_passes
  path: output_attitude_propagation/selected_passes.json
  format: json
  required_keys: [imaging_pass, lightcurve_pass]
  guaranteed: true
  description: satellite and pass selected for the imaging and the light curve
- product: selected_pass_summary
  path: output_attitude_propagation/selected_pass_summary.csv
  format: csv
  guaranteed: true
  description: flat table of the selected passes
- product: pass_candidates
  path: output_attitude_propagation/pass_candidates.csv
  format: csv
  guaranteed: false
  description: all the imaging pass candidates over the target site
- product: attitude_summary
  path: results_attitude_propagator/attitude_summary.json
  format: json
  required_keys: [kpis]
  guaranteed: true
  description: numbered KPI catalog and face illumination of the run
- product: attitude_orbit_window
  path: output_attitude_propagation/orbit_and_window.json
  format: json
  required_keys: [orbit, sim_hours, sim_start_date]
  guaranteed: true
  description: elements of the selected satellite, epoch, propagation window and target site
execution:
  estimated_runtime: 5
  execution_mode: sequential
  input_format: json
  input_filename: input_attitude_propagator.json
  runner_module: runners.end003_runner
  runner_function: run_end003
  software:
    operating_system:
      - Windows 10/11
      - Linux Ubuntu 20.04 LTS or higher
      - macOS
    execution_core: MATLAB R2021a or newer
    required_libraries:
      - Aerospace Toolbox
    hardware:
      processor: x86-64 or Apple Silicon, minimum 4 physical cores
      memory: 8 GB RAM minimum
      disk_space: less than 10 MB for local text telemetry logs

interface_notes: >
  END-003 provides attitude and spacecraft-state telemetry that can be consumed
  by END-007 Synthetic Data Generation to synthesize high-fidelity payload data
  with realistic time-varying line-of-sight and pointing information. It can
  also provide outputs to END-004 Attitude Visualization. If no valid visibility
  pass is found above the elevation threshold, the module may export the full
  orbital trajectory dataset to preserve downstream execution continuity.
