module_type: digital_twin_module
module_version: 1.0.0
module_id: END-019
module_name: Components Thermal Analysis
owner: UNIRM1
responsible:
  leader: TBD
  co_leader: TBD
short_description: Lumped-parameter thermal analysis of a CubeSat (1U, 3U, 6U, 12U) along its STAR orbit and imaging passes; temperatures of faces, solar panels and internal nodes with limit checks.
description: >
  END-019 computes the temperatures of a CubeSat over the propagated orbit: the six faces, the deployable solar panels and the
  internal nodes (central body, battery and, when the payload is a SAR, the SAR payload), and flags the operational limits
  that are exceeded (for example the battery above 25 degC). It is a lumped-parameter model exchanging heat with the orbital
  environment (solar flux, albedo, Earth infrared, eclipses) and deep space, calibrated on temperatures measured in orbit by a
  3U CubeSat (WildtrackCube / SIMBA). MATLAB sources in END019-ComponentsThermalAnalysis/src (MATLAB base only): it reads
  the END-001 orbits (satellite_XX.json) and the END-003 imaging passes and attitude, starts from the periodic thermal regime
  of the orbit, and the analysis lasts as long as the propagation it receives.
aliases:
  - thermal analysis
  - components thermal analysis
  - CubeSat thermal analysis
  - temperature analysis
  - thermal model
  - thermal limits
capabilities:
  - Compute the temperature over time of the six faces, the deployable solar panels and the internal nodes of a 1U, 3U, 6U or 12U CubeSat.
  - Model the heat of a SAR payload switched on during the END-003 imaging passes or with a fixed duty cycle.
  - Flag operational limits that are exceeded (battery limit 25 degC) per satellite.
  - Summarise every satellite of the constellation in one table (beta angle, number of passes, maximum temperatures).
domain_of_validity:
  mission_phase:
  - pre_phase_a
  - phase_a
  - design_trade_off
  mission_type:
  - cubesat
  fidelity_level: preliminary
  notes: >
    CubeSats of 1U, 3U, 6U and 12U only (satellites above 24 kg are out of scope). Calibrated on in-orbit data of a 3U
    CubeSat. The third internal node models a SAR payload: for other payloads only the central body and the battery are
    modelled. Needs the END-001 orbits and the END-003 passes and attitude of the same run.
activation_rules:
  include_when_any_requirement_contains:
    - thermal
    - temperature
    - overheating
    - thermal control
    - heat dissipation
  only_when_mission_contains:
    - cubesat
    - 1u
    - 3u
    - 6u
    - 12u
planning_guidance: >
  Select END-019 when the mission is a CubeSat (1U to 12U) and the request asks for its thermal behaviour, temperatures or
  thermal limits (battery, payload, solar panels). END-019 needs END-001 (orbits) and END-003 (imaging passes and attitude)
  upstream in the same workflow. Do not select it for satellites above 24 kg.
required_inputs:
  - name: form_factor
    data_type: string
    required: true
    unit: U
    allowed_values: [1U, 3U, 6U, 12U]
    description: CubeSat class. It sets the geometry, the thermal masses and the surfaces of the model.
    missing_information_reason: The temperatures depend on the size of the CubeSat.
    assumption_allowed: true
    default_value: 3U
  - name: panels
    data_type: string
    required: false
    allowed_values: [body, deployable, both]
    description: Solar panels mounted on the body, deployable, or both.
    assumption_allowed: true
    default_value: both
  - name: sar_power_W
    data_type: number
    required: false
    unit: W
    description: Power dissipated by the SAR payload when it is on (used only when the payload is a SAR).
    assumption_allowed: true
  - name: sar_source
    data_type: string
    required: false
    allowed_values: [passes, duty]
    description: SAR switched on during the END-003 imaging passes, or with a fixed duty cycle.
    assumption_allowed: true
    default_value: passes
  - name: sar_duty
    data_type: number
    required: false
    unit: fraction of orbit
    description: Fraction of the orbit with the SAR on (only with sar_source = duty).
    assumption_allowed: true
consumes:
- product: satellite_orbits
  required: true
  used_for: orbit of every satellite (beta angle, eclipses, altitude)
- product: selected_pass_summary
  required: true
  used_for: imaging passes the SAR is switched on
- product: attitude_propagation_csv
  required: true
  used_for: attitude of the pass (conjugate of the ECI file)
- product: attitude_propagation_eci
  required: false
  used_for: attitude of the pass, quaternion body to ECI
  fallback: the conjugate of the Unreal-axes file
- product: spacecraft_definition
  required: true
  used_for: CubeSat class, envelope, mass, solar faces and battery temperature limits of the thermal model
- product: eclipse_summary
  required: true
  used_for: beta range of the mission life (the hot case is the beta with the hottest battery) and beta of the cold case (longest eclipse), per satellite
- product: power_design_cases
  required: false
  used_for: internal dissipation (nominal for the window, hot = payload and transmitters, cold = idle)
  fallback: the model's constant internal powers (7 W), completed with a critical fallback
produces:
- product: kpis_end019
  path: kpis.json
  format: json
  required_keys: [kpis]
  guaranteed: true
  description: common KPI list of END-019 (star_kpis format, one file per run)
- product: thermal_time_series
  path: output_components_thermal_analysis/output_thermal_SAT-*.csv
  format: csv
  guaranteed: true
  description: temperature of every face, panel and internal node over time, per satellite
- product: thermal_summary
  path: output_components_thermal_analysis/thermal_summary_SAT-*.json
  format: json
  guaranteed: true
  description: minimum, maximum and mean temperatures and limit violations, per satellite
- product: thermal_constellation_output
  path: output_components_thermal_analysis/thermal_constellation_output.csv
  format: csv
  guaranteed: true
  description: one row per satellite (class, beta angle, passes, maximum temperatures, battery minimum and the hot / cold design cases with limit flags)
- product: thermal_run_info
  path: results_components_thermal_analysis/thermal_run_info.json
  format: json
  guaranteed: true
  description: configuration and provenance for the results tab
execution:
  execution_mode: python_runner_matlab_batch
  runner_module: runners.end019_runner
  runner_function: run_end019
  estimated_runtime: 2
interface_notes: >
  Since 2026-10-17 the CubeSat class is the one of the END-006 initial design of the run (spacecraft_definition.json), shared by all
  modules; only a class the user approved explicitly wins, a class written in the requirements is reported.
  The Python runner checks that the mission is a CubeSat, builds input_termico.json from the requirements and the approved
  inputs (what the mission does not state is left to the model's defaults), copies the END-001 and END-003 products of the run
  into one folder (the pass attitude as END-003's output_attitude_propagation_ECI.csv, quaternion body to ECI), runs
  star_thermal_main of END019-ComponentsThermalAnalysis/src with matlab -batch (MATLAB_EXECUTABLE, STAR_END019_MATLAB_SOURCE;
  STAR_END019_EXECUTABLE runs the compiled black box of the delivered version instead, which needs the MATLAB Runtime R2026a)
  and writes the products under modules_output/END-019/output_components_thermal_analysis and thermal_run_info.json under
  modules_output/END-019/results_components_thermal_analysis.
