module_type: digital_twin_module
module_version: 1.0.0
module_id: END-018
module_name: Components Thermal Analysis
owner: UNIRM1
responsible:
  leader: TBD
  co_leader: TBD
short_description: Lumped-parameter thermal analysis of a CubeSat (1U, 3U, 6U, 12U) along its STAR orbit and imaging passes; temperatures of faces, solar panels and internal nodes with limit checks.
description: >
  END-018 computes the temperatures of a CubeSat over the propagated orbit: the six faces, the deployable solar panels and the
  internal nodes (central body, battery and, when the payload is a SAR, the SAR payload), and flags the operational limits
  that are exceeded (for example the battery above 25 degC). It is a lumped-parameter model exchanging heat with the orbital
  environment (solar flux, albedo, Earth infrared, eclipses) and deep space, calibrated on temperatures measured in orbit by a
  3U CubeSat (WildtrackCube / SIMBA). MATLAB sources in END018-ComponentsThermalAnalysis/src (MATLAB base only): it reads
  the END-001 orbits (satellite_XX.json) and the END-003 imaging passes and attitude, starts from the periodic thermal regime
  of the orbit, and the analysis lasts as long as the propagation it receives.
aliases:
  - thermal analysis
  - components thermal analysis
  - CubeSat thermal analysis
  - temperature analysis
  - thermal model
  - thermal limits
capabilities:
  - Compute the temperature over time of the six faces, the deployable solar panels and the internal nodes of a 1U, 3U, 6U or 12U CubeSat.
  - Model the heat of a SAR payload switched on during the END-003 imaging passes or with a fixed duty cycle.
  - Flag operational limits that are exceeded (battery limit 25 degC) per satellite.
  - Summarise every satellite of the constellation in one table (beta angle, number of passes, maximum temperatures).
domain_of_validity:
  mission_phase:
  - pre_phase_a
  - phase_a
  - design_trade_off
  mission_type:
  - cubesat
  fidelity_level: preliminary
  notes: >
    CubeSats of 1U, 3U, 6U and 12U only (satellites above 24 kg are out of scope). Calibrated on in-orbit data of a 3U
    CubeSat. The third internal node models a SAR payload: for other payloads only the central body and the battery are
    modelled. Needs the END-001 orbits and the END-003 passes and attitude of the same run.
activation_rules:
  include_when_any_requirement_contains:
    - thermal
    - temperature
    - overheating
    - thermal control
    - heat dissipation
  only_when_mission_contains:
    - cubesat
    - 1u
    - 3u
    - 6u
    - 12u
  required_upstream_modules:
    - END-001
    - END-003
  optional_upstream_modules: []
planning_guidance: >
  Select END-018 when the mission is a CubeSat (1U to 12U) and the request asks for its thermal behaviour, temperatures or
  thermal limits (battery, payload, solar panels). END-018 needs END-001 (orbits) and END-003 (imaging passes and attitude)
  upstream in the same workflow. Do not select it for satellites above 24 kg.
required_inputs:
  - name: satellite_orbits
    data_type: file_path
    required: true
    produced_by: END-001
    unit: json
    description: Orbit of every satellite (satellite_XX.json in output_constellation_optimizer) generated by END-001.
    missing_information_reason: The thermal environment (beta angle, eclipses, altitude) and the analysis time span come from the orbit.
  - name: imaging_passes_and_attitude
    data_type: file_path
    required: true
    produced_by: END-003
    unit: csv
    description: selected_pass_summary.csv and output_attitude_propagation.csv in output_attitude_propagation, generated by END-003.
    missing_information_reason: The SAR payload is switched on during the imaging passes, refined with the propagated position and attitude.
  - name: form_factor
    data_type: string
    required: true
    unit: U
    allowed_values: [1U, 3U, 6U, 12U]
    description: CubeSat class. It sets the geometry, the thermal masses and the surfaces of the model.
    missing_information_reason: The temperatures depend on the size of the CubeSat.
    assumption_allowed: true
    default_value: 3U
  - name: panels
    data_type: string
    required: false
    allowed_values: [body, deployable, both]
    description: Solar panels mounted on the body, deployable, or both.
    assumption_allowed: true
    default_value: both
  - name: sar_power_W
    data_type: number
    required: false
    unit: W
    description: Power dissipated by the SAR payload when it is on (used only when the payload is a SAR).
    assumption_allowed: true
  - name: sar_source
    data_type: string
    required: false
    allowed_values: [passes, duty]
    description: SAR switched on during the END-003 imaging passes, or with a fixed duty cycle.
    assumption_allowed: true
    default_value: passes
  - name: sar_duty
    data_type: number
    required: false
    unit: fraction of orbit
    description: Fraction of the orbit with the SAR on (only with sar_source = duty).
    assumption_allowed: true
outputs:
  - name: thermal_time_series
    artifact_name: output_components_thermal_analysis/output_thermal_SAT-XX.csv
    data_type: csv
    description: Per satellite, temperature of every face, panel and internal node over time [degC], with SAR on and eclipse flags.
  - name: thermal_summary
    artifact_name: output_components_thermal_analysis/thermal_summary_SAT-XX.json
    data_type: json
    description: Per satellite, configuration, orbit, minimum / maximum / mean of every node, solar panels, peaks and limit violations.
  - name: thermal_constellation_output
    artifact_name: output_components_thermal_analysis/thermal_constellation_output.csv
    data_type: csv
    description: One row per satellite (form factor, beta angle, number of passes, maximum temperatures, battery limit flag).
  - name: thermal_run_info
    artifact_name: results_components_thermal_analysis/thermal_run_info.json
    data_type: json
    description: Configuration passed to the model and where each value came from, domain checks and status, for the STAR FrontEnd results tab.
execution:
  execution_mode: python_runner_matlab_batch
  runner_module: runners.end018_runner
  runner_function: run_end018
  upstream_dependencies:
  - END-001
  - END-003
  downstream_dependencies: []
  estimated_runtime: 2
interface_notes: >
  The Python runner checks that the mission is a CubeSat, builds input_termico.json from the requirements and the approved
  inputs (what the mission does not state is left to the model's defaults), copies the END-001 and END-003 products of the run
  into one folder (the pass attitude as END-003's output_attitude_propagation_ECI.csv, quaternion body to ECI), runs
  star_thermal_main of END018-ComponentsThermalAnalysis/src with matlab -batch (MATLAB_EXECUTABLE, STAR_END018_MATLAB_SOURCE;
  STAR_END018_EXECUTABLE runs the compiled black box of the delivered version instead, which needs the MATLAB Runtime R2026a)
  and writes the products under modules_output/END-018/output_components_thermal_analysis and thermal_run_info.json under
  modules_output/END-018/results_components_thermal_analysis.
