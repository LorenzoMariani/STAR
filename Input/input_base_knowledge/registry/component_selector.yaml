module_type: digital_twin_module
module_version: 0.2.0
module_id: END-006   # END-019 until 2026-10-18 (renumbered when END-006 Scenario Generation was merged into END-007)
module_name: Satellite Design Component Selector
owner: UNIRM1
responsible:
  leader: TBD
  co_leader: TBD
short_description: Designs the CubeSat the mission needs - only the subsystems the requirements ask for, in the smallest class (1U, 3U, 6U, 12U) that carries them, with real components checked against the mission requirements; the other subsystems listed apart.
description: >
  END-006 designs a CubeSat from a catalogue of real products built from public vendor datasheets (232 components, every
  value with its source). The design holds the bus (structure, on-board computer, EPS, battery, solar cells, a radio and an
  antenna per band named in the requirements) and only the subsystems the requirements ask for (integrated ADCS unit,
  GNSS, propulsion when manoeuvres are asked or END-016 of the run needs a disposal delta-v, imaging payload, optical
  terminal; separate wheels, magnetorquers, star trackers and sun sensors only when named). It searches the smallest class
  (1U, 3U, 6U, 12U) whose components fit together within the CubeSat Design Specification Rev. 14.1 mass and envelope, and
  checks the mission requirements with the published data (GSD and swath at the orbit altitude, pointing accuracy, bands,
  delta-v, mass): a requirement no component of the database meets is reported as not satisfied. The subsystems the mission
  does not need are listed apart. A value that the vendor does not publish is reported as "Not publicly available" and is
  never estimated.
aliases:
  - component selector
  - satellite design
  - CubeSat design
  - subsystem selection
  - bill of materials
  - CubeSat components
capabilities:
  - Decide which subsystems the mission needs from the requirements, citing the requirement of each.
  - Find the smallest CubeSat class (1U, 3U, 6U, 12U) that carries them (mass, volume, stack and envelope fit).
  - Check GSD and swath at the orbit altitude, pointing accuracy, radio bands, thruster delta-v and satellite mass with the published data, and report the requirements no component of the database meets.
  - List the subsystems the mission does not need apart, with the best component that would fit.
  - Produce a bill of materials, a power hand-off with declared values only, and a component gallery with datasheets.
domain_of_validity:
  mission_phase:
  - pre_phase_a
  - phase_a
  - design_trade_off
  mission_type:
  - cubesat
  fidelity_level: preliminary
  notes: >
    CubeSat classes 1U, 3U, 6U and 12U (mass up to 24 kg). Only mass and volume are checked: there is no power balance, no
    electrical or interface compatibility check, no pointing, link or thermal analysis. Component volume is the product of the
    published length, width and height (bounding box). Larger satellites are out of scope: reference platforms (Tyvak, Terran Orbital).
activation_rules:
  include_when_any_requirement_contains:
    - cubesat
    - satellite design
    - component selection
    - select the components
    - bill of materials
    - form factor
    - 1u
    - 3u
    - 6u
    - 12u
    - subsystem
    - adcs
    - magnetorquer
    - reaction wheel
    - star tracker
    - propulsion
    - payload accommodation
planning_guidance: >
  Select END-006 when the mission request asks to design or size a small satellite or CubeSat, to choose its components or
  subsystems, or to check which commercial components can be put inside a 1U, 3U, 6U or 12U CubeSat. END-006 needs no upstream
  module. If the requirements state a satellite mass above 24 kg, do not select END-006: the reference platforms (Tyvak,
  Terran Orbital) are proposed in the module output instead.
required_inputs:
  - name: form_factor_u
    data_type: number
    required: false
    unit: U
    allowed_values: [1, 3, 6, 12]
    description: Optional CubeSat class in units (1U, 3U, 6U or 12U) chosen by the user. When it is empty END-006 uses the smallest class that carries the subsystems the mission needs; a class written in the requirements is only reported.
    assumption_allowed: false
always_in_workflow: true
phases:
  initial:
    produces:
    - product: kpis_end006_initial
      path: kpis_initial.json
      format: json
      required_keys: [kpis]
      guaranteed: true
      description: common KPI list of the END-006 initial design (star_kpis format)
    - product: spacecraft_definition
      path: output_component_selector/spacecraft_definition.json
      format: json
      required_keys: [mass_kg, class_u]
      guaranteed: true
      description: the satellite of the initial design (class, mass, inertia, areas, Cd/Cr, panels, battery, powers, radios)
    - product: component_selector_results_initial
      path: output_component_selector/component_selector_results_initial.json
      format: json
      description: components of the initial design
    - product: component_selector_bom_initial
      path: output_component_selector/component_selector_bom_initial.csv
      format: csv
      description: bill of materials of the initial design
    - product: component_selector_power_handoff_initial
      path: output_component_selector/component_selector_power_handoff_initial.json
      format: json
      description: declared powers of the initial design
    - product: component_selector_requirements_mapping_initial
      path: output_component_selector/component_selector_requirements_mapping_initial.json
      format: json
      description: parameters extracted from the requirements (initial design)
  final:
    consumes:
    - product: spacecraft_definition
      required: false
      used_for: initial design the final design is compared with
      fallback: no comparison
    - product: satellite_orbits
      required: false
      used_for: altitude for the GSD and swath of the imagers
      fallback: altitude of the requirements
    - product: power_budget_summary
      required: false
      used_for: energy per orbit for the battery capacity
      fallback: battery of the initial design
    - product: space_safety_summary
      required: false
      used_for: disposal delta-v for the propulsion
      fallback: no disposal delta-v
    - product: kpis_end003
      required: false
      used_for: END-003 peak wheel momentum and control torque for the wheel sizing at 50 % utilisation (IF-003-006)
      fallback: wheels declared by the vendor for the class
    - product: kpis_end019
      required: false
      used_for: END-019 battery temperatures and cold-case heater sizing for the battery heater (IF-019-006)
      fallback: no battery heater, battery temperature not checked
    produces:
    - product: kpis_end006
      path: kpis.json
      format: json
      required_keys: [kpis]
      guaranteed: true
      description: common KPI list of the END-006 final design (star_kpis format)
    - product: spacecraft_definition_final
      path: output_component_selector/spacecraft_definition_final.json
      format: json
      required_keys: [mass_kg, class_u]
      guaranteed: true
      feeds_back_to: spacecraft_definition   # CEF loop (phase F): promoted over spacecraft_definition before the next iteration
      description: the satellite of the final design and its changes with respect to the initial one
    - product: component_selector_results
      path: output_component_selector/component_selector_results.json
      format: json
      guaranteed: true
      description: selected component for every subsystem, totals against the class limits and parameters used
    - product: component_selector_bom
      path: output_component_selector/component_selector_bom.csv
      format: csv
      guaranteed: true
      description: bill of materials with masses, volumes, declared powers and datasheet links
    - product: design_requests
      path: output_component_selector/design_requests.json
      format: json
      required_keys: [requests]
      guaranteed: true
      description: ledger of the requests END-019 (heater), END-003 (wheels), END-004 (battery) and END-016 (propulsion) make to the final design and the response to each (applied, not_needed, not_satisfiable)
    - product: component_selector_requirements_mapping
      path: output_component_selector/component_selector_requirements_mapping.json
      format: json
      guaranteed: true
      description: parameters extracted from the requirements with the supporting sentence
    - product: component_selector_power_handoff
      path: output_component_selector/component_selector_power_handoff.json
      format: json
      guaranteed: true
      description: maximum powers declared by the vendors for the selected components
    - product: component_selector_frontend_data
      path: results_component_selector/component_selector_data.js
      format: javascript
      guaranteed: true
      description: JavaScript payload of the STAR results tab
    - product: component_selector_report
      path: results_component_selector/component_selector_report.html
      format: html
      guaranteed: true
      description: self-contained report with the component cards, indicators and budgets
execution:
  execution_mode: python_runner
  runner_module: runners.end006_runner
  runner_function: run_end006
  estimated_runtime: 2
interface_notes: >
  Two runs per STAR workflow (2026-10-17): the orchestrator runs END-006 first, as step 0, for the INITIAL design (requirements
  only): it writes output_component_selector/spacecraft_definition.json (class, envelope, mass, uniform-box inertia, face and mean
  projected areas, Cd/Cr, solar panels and the body faces they cover, battery, declared powers), the satellite END-001, END-003,
  END-004, END-010, END-016 and END-019 use, plus the *_initial products. The END-006 step of the workflow, the last one, is the
  FINAL design made with their results (END-001 altitude, END-004 energy, END-016 delta-v); it writes the usual products,
  spacecraft_definition_final.json and the changes with respect to the initial design (the modules are not re-run).
  The Python runner reads the module input JSON written by the orchestrator (requirements and resolved inputs) and, when they
  are in the same run, the END-001 orbits (altitude for the GSD and swath of the imagers), the END-004 power budget (energy per orbit
  for the battery capacity) and the END-016 space-safety summary
  (disposal delta-v). It designs the CubeSat for the mission (star_selector.mission: subsystems the mission needs, smallest
  class, requirements checked, other subsystems apart) and writes the products under modules_output/END-006/output_component_selector
  and the frontend files under modules_output/END-006/results_component_selector. The runner needs the star_component_selector
  package; it is found automatically in STAR/END006-ComponentSelector or through the STAR_COMPONENT_SELECTOR_ROOT variable.
