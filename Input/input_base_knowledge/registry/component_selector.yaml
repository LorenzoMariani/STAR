module_type: digital_twin_module
module_version: 0.2.0
module_id: END-019
module_name: Satellite Design Component Selector
owner: UNIRM1
responsible:
  leader: TBD
  co_leader: TBD
short_description: Designs the CubeSat the mission needs - only the subsystems the requirements ask for, in the smallest class (1U, 3U, 6U, 12U) that carries them, with real components checked against the mission requirements; the other subsystems listed apart.
description: >
  END-019 designs a CubeSat from a catalogue of real products built from public vendor datasheets (232 components, every
  value with its source). The design holds the bus (structure, on-board computer, EPS, battery, solar cells, a radio and an
  antenna per band named in the requirements) and only the subsystems the requirements ask for (integrated ADCS unit,
  GNSS, propulsion when manoeuvres are asked or END-016 of the run needs a disposal delta-v, imaging payload, optical
  terminal; separate wheels, magnetorquers, star trackers and sun sensors only when named). It searches the smallest class
  (1U, 3U, 6U, 12U) whose components fit together within the CubeSat Design Specification Rev. 14.1 mass and envelope, and
  checks the mission requirements with the published data (GSD and swath at the orbit altitude, pointing accuracy, bands,
  delta-v, mass): a requirement no component of the database meets is reported as not satisfied. The subsystems the mission
  does not need are listed apart. A value that the vendor does not publish is reported as "Not publicly available" and is
  never estimated.
aliases:
  - component selector
  - satellite design
  - CubeSat design
  - subsystem selection
  - bill of materials
  - CubeSat components
capabilities:
  - Decide which subsystems the mission needs from the requirements, citing the requirement of each.
  - Find the smallest CubeSat class (1U, 3U, 6U, 12U) that carries them (mass, volume, stack and envelope fit).
  - Check GSD and swath at the orbit altitude, pointing accuracy, radio bands, thruster delta-v and satellite mass with the published data, and report the requirements no component of the database meets.
  - List the subsystems the mission does not need apart, with the best component that would fit.
  - Produce a bill of materials, a power hand-off with declared values only, and a component gallery with datasheets.
domain_of_validity:
  mission_phase:
  - pre_phase_a
  - phase_a
  - design_trade_off
  mission_type:
  - cubesat
  fidelity_level: preliminary
  notes: >
    CubeSat classes 1U, 3U, 6U and 12U (mass up to 24 kg). Only mass and volume are checked: there is no power balance, no
    electrical or interface compatibility check, no pointing, link or thermal analysis. Component volume is the product of the
    published length, width and height (bounding box). Larger satellites are out of scope: reference platforms (Tyvak, Terran Orbital).
activation_rules:
  include_when_any_requirement_contains:
    - cubesat
    - satellite design
    - component selection
    - select the components
    - bill of materials
    - form factor
    - 1u
    - 3u
    - 6u
    - 12u
    - subsystem
    - adcs
    - magnetorquer
    - reaction wheel
    - star tracker
    - propulsion
    - payload accommodation
  required_upstream_modules: []
  optional_upstream_modules:
    - END-001
    - END-004
    - END-016
planning_guidance: >
  Select END-019 when the mission request asks to design or size a small satellite or CubeSat, to choose its components or
  subsystems, or to check which commercial components can be put inside a 1U, 3U, 6U or 12U CubeSat. END-019 needs no upstream
  module. If the requirements state a satellite mass above 24 kg, do not select END-019: the reference platforms (Tyvak,
  Terran Orbital) are proposed in the module output instead.
required_inputs:
  - name: form_factor_u
    data_type: number
    required: false
    unit: U
    allowed_values: [1, 3, 6, 12]
    description: Optional CubeSat class in units (1U, 3U, 6U or 12U) chosen by the user. When it is empty END-019 uses the smallest class that carries the subsystems the mission needs; a class written in the requirements is only reported.
    assumption_allowed: false
outputs:
  - name: component_selector_results
    artifact_name: output_component_selector/component_selector_results.json
    data_type: json
    description: Selected component for every subsystem, with its published data, the counts in the database, the totals against the class limits and the parameters used.
  - name: component_selector_bom
    artifact_name: output_component_selector/component_selector_bom.csv
    data_type: csv
    description: Bill of materials of the selected components with masses, volumes, declared powers and datasheet links.
  - name: component_selector_requirements_mapping
    artifact_name: output_component_selector/component_selector_requirements_mapping.json
    data_type: json
    description: Parameters extracted from the requirements, with the sentence that supports each, and out-of-scope notes.
  - name: component_selector_power_handoff
    artifact_name: output_component_selector/component_selector_power_handoff.json
    data_type: json
    description: Maximum powers declared by the vendors for the selected components (no estimate), usable as a starting point by END-004 Power Budget.
  - name: component_selector_frontend_data
    artifact_name: results_component_selector/component_selector_data.js
    data_type: javascript
    description: JavaScript payload consumed by the STAR FrontEnd results tab.
  - name: component_selector_report
    artifact_name: results_component_selector/component_selector_report.html
    data_type: html
    description: Self-contained report with the component cards, the indicators and the mass and power budgets (opens in any browser).
execution:
  execution_mode: python_runner
  runner_module: runners.end019_runner
  runner_function: run_end019
  upstream_dependencies: []
  optional_upstream_dependencies:
  - END-001
  - END-004
  - END-016
  downstream_dependencies: []
  estimated_runtime: 2
interface_notes: >
  Two runs per STAR workflow (2026-10-17): the orchestrator runs END-019 first, as step 0, for the INITIAL design (requirements
  only): it writes output_component_selector/spacecraft_definition.json (class, envelope, mass, uniform-box inertia, face and mean
  projected areas, Cd/Cr, solar panels and the body faces they cover, battery, declared powers), the satellite END-001, END-003,
  END-004, END-010, END-016 and END-018 use, plus the *_initial products. The END-019 step of the workflow, the last one, is the
  FINAL design made with their results (END-001 altitude, END-004 energy, END-016 delta-v); it writes the usual products,
  spacecraft_definition_final.json and the changes with respect to the initial design (the modules are not re-run).
  The Python runner reads the module input JSON written by the orchestrator (requirements and resolved inputs) and, when they
  are in the same run, the END-001 orbits (altitude for the GSD and swath of the imagers), the END-004 power budget (energy per orbit
  for the battery capacity) and the END-016 space-safety summary
  (disposal delta-v). It designs the CubeSat for the mission (star_selector.mission: subsystems the mission needs, smallest
  class, requirements checked, other subsystems apart) and writes the products under modules_output/END-019/output_component_selector
  and the frontend files under modules_output/END-019/results_component_selector. The runner needs the star_component_selector
  package; it is found automatically in STAR/END019-ComponentSelector or through the STAR_COMPONENT_SELECTOR_ROOT variable.
