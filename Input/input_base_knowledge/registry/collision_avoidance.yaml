module_type: digital_twin_module
module_version: 1.0.0
module_id: END-016
module_name: Collision Avoidance
owner: UNIRM1
responsible:
  leader: TBD
  co_leader: TBD
short_description: Space-safety checks of the constellation END-001 designed - close approaches between its satellites with collision probability, orbital lifetime and post-mission disposal (5-year and 25-year rules).
description: >
  Inside STAR END-016 checks the space safety of the constellation designed by END-001. (1) Close approaches between the
  satellites of the constellation: every pair over the END-001 ephemeris window, with the time and distance of closest
  approach (refined between the ephemeris samples), the miss components (radial, in-track, cross-track), the relative speed,
  the collision probability Pc (Chan method, validated against NASA CARA Pc2D_Foster) with a declared position uncertainty
  and the largest Pc any uncertainty could give. (2) Orbital lifetime and disposal of every orbit shell: decay under drag
  with the NRLMSISE-00 atmosphere for low, mean and high solar activity, compliance with the FCC 5-year and IADC 25-year
  post-mission disposal rules, delta-v of the perigee-lowering burn that brings the lifetime within each rule, and the
  drag make-up delta-v per year that holds the operational altitude. MATLAB (END016-CollisionAvoidance/lib,
  star_collision_main; Aerospace Toolbox for NRLMSISE-00). The operational CDM / TLE collision-probability tools of the module
  (main.m, space-track.org) are not used inside STAR.
aliases:
  - collision avoidance
  - space safety
  - close approach
  - conjunction analysis
  - space debris mitigation
  - post-mission disposal
  - orbital lifetime
  - deorbit
capabilities:
  - Find the close approaches between every pair of satellites of the END-001 constellation and their collision probability.
  - Estimate the passive orbital lifetime of every orbit shell for low, mean and high solar activity.
  - Check the FCC 5-year and IADC 25-year post-mission disposal rules and compute the disposal delta-v.
  - Compute the drag make-up delta-v per year and flag orbits that decay before the end of the mission.
domain_of_validity:
  mission_phase:
  - pre_phase_a
  - phase_a
  - design_trade_off
  mission_type:
  - earth_observation
  - constellation
  - cubesat
  - small_satellite
  fidelity_level: preliminary
  notes: >
    Close approaches only between the satellites of the designed constellation (END-001 orbits, J2 secular); other space
    objects (catalogue, debris) are not included. Circular orbits; lifetime with constant solar activity per level
    (real decay crosses solar cycles); drag only.
activation_rules:
  include_when_any_requirement_contains:
    - collision
    - conjunction
    - close approach
    - space debris
    - debris mitigation
    - space safety
    - disposal
    - deorbit
    - end of life
    - re-enter
    - re-entry
    - orbital lifetime
    - safe separation
planning_guidance: >
  Select END-016 when the request asks about collisions or close approaches between satellites, space debris mitigation,
  post-mission disposal, re-entry or orbital lifetime of the constellation. END-016 needs END-001 (orbits and ephemerides)
  upstream in the same workflow.
required_inputs:
  - name: mission_lifetime_years
    data_type: number
    required: false
    unit: years
    description: Operational lifetime before disposal (from the requirements). With it END-016 flags orbits that decay before the end of the mission.
    assumption_allowed: true
  - name: position_sigma_rtn_m
    data_type: list
    required: false
    unit: m
    description: 1-sigma position uncertainty of each satellite (radial, in-track, cross-track) used for the collision probability.
    assumption_allowed: true
    default_value: [50, 200, 50]
  - name: hard_body_radius_m
    data_type: number
    required: false
    unit: m
    description: Combined hard-body radius of two satellites (default twice the radius of a disc with the drag area).
    assumption_allowed: true
  - name: screening_km
    data_type: number
    required: false
    unit: km
    description: Distance below which a close approach is reported.
    assumption_allowed: true
    default_value: 10
  - name: disposal_rules_years
    data_type: list
    required: false
    unit: years
    description: Post-mission disposal deadlines checked (5 and 25 always; others from the requirements).
    assumption_allowed: true
    default_value: [5, 25]
consumes:
- product: satellite_orbits
  required: true
  used_for: orbits of the satellites
- product: satellite_ephemerides
  required: true
  used_for: close approaches between the satellites
- product: spacecraft_definition
  required: true
  used_for: mass, drag area and Cd of the satellite
produces:
- product: kpis_end016
  path: kpis.json
  format: json
  required_keys: [kpis]
  guaranteed: true
  description: common KPI list of END-016 (star_kpis format, one file per run)
- product: space_safety_summary
  path: output_collision_avoidance/space_safety_summary.json
  format: json
  required_keys: [kpis]
  guaranteed: true
  description: configuration, KPIs, close approaches, lifetime and disposal
- product: intra_close_approaches
  path: output_collision_avoidance/intra_close_approaches.csv
  format: csv
  guaranteed: true
  description: close approaches below the screening distance
- product: intra_pair_min_distance
  path: output_collision_avoidance/intra_pair_min_distance.csv
  format: csv
  guaranteed: true
  description: minimum distance of every pair of satellites
- product: disposal_lifetime
  path: output_collision_avoidance/disposal_lifetime.csv
  format: csv
  guaranteed: true
  description: passive lifetime and disposal delta-v per orbit shell and solar activity
- product: collision_run_info
  path: results_collision_avoidance/collision_run_info.json
  format: json
  guaranteed: true
  description: configuration and provenance for the results tab
execution:
  execution_mode: python_runner_matlab_batch
  runner_module: runners.end016_runner
  runner_function: run_end016
  estimated_runtime: 1
interface_notes: >
  The Python runner copies the END-001 products of the run (satellite_NN.json, satellite_NN_ephemeris.csv) into one folder,
  takes mass, drag area and drag coefficient from the END-006 spacecraft_definition.json (else END-001's runtime input), the mission lifetime and any disposal deadline
  from the requirements, and the values the user approved, writes input_collision_avoidance.json (every value with its
  provenance) and runs star_collision_main of END016-CollisionAvoidance/lib with matlab -batch (MATLAB_EXECUTABLE,
  STAR_END016_MATLAB_SOURCE). Run mode test: mean solar activity only; full: low, mean and high. Products under
  modules_output/END-016/output_collision_avoidance, collision_run_info.json under results_collision_avoidance.
