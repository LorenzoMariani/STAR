module_id: END-010
id: END-010
module_name: Reflectance Determination
name: Reflectance Determination
owner: UNIRM1

description: >
  Reflectance determination module for generating reflectance/light-curve
  simulation outputs from orbital, attitude, illumination and observation geometry data.

short_description: >
  Simulates the reflected sunlight of a satellite (reflectance, light curve, phase
  angle, estimated apparent magnitude) as seen from a ground observer such as the
  Matera telescope, to assess the luminous impact of satellites on astronomy.

aliases:
  - reflectance determination
  - light curve simulation
  - satellite brightness and apparent magnitude
  - light pollution and luminous impact of satellites on astronomy
  - photometric detectability from a ground telescope

capabilities:
  - reflectance_determination
  - light_curve_generation
  - unity_based_rendering
  - observation_geometry_processing
  - apparent_magnitude_estimation
  - light_pollution_assessment

activation_rules:
  keywords:
    - reflectance
    - light curve
    - flux
    - brightness
    - photometry
    - apparent magnitude
    - phase angle
    - light pollution
    - luminous impact
    - telescope

planning_guidance: >
  Select this module when the request asks for reflected light, light curves,
  satellite brightness or apparent magnitude, luminous impact / light pollution
  on ground-based astronomy, or detectability from a telescope. It needs the
  orbit and attitude of the satellite during a pass visible from the observer at
  night: END-003 selects that pass (sunlit satellite, observer in darkness) and
  writes its ephemeris, so END-010 runs after END-003 and is normally the last
  module of an Earth-observation workflow.

required_inputs:
  - name: reflectance_configuration_json
    data_type: file
    required: true
    description: JSON configuration file for the reflectance determination MATLAB pipeline.

consumes:
- product: selected_passes
  required: true
  used_for: night pass visible from the observer
- product: lightcurve_ephemeris
  required: false
  used_for: ephemeris of the night pass
  fallback: ephemeris of the imaging pass
- product: attitude_propagation_eci
  required: false
  used_for: ephemeris of the imaging pass when there is no night pass
  fallback: none (the run stops without an ephemeris)
- product: attitude_orbit_window
  required: false
  used_for: ground site END-003 computed the pass for
  fallback: station of the END-010 template
- product: spacecraft_definition
  required: true
  used_for: class, mean projected area and orientation of the CubeSat model
produces:
- product: kpis_end010
  path: kpis.json
  format: json
  required_keys: [kpis]
  guaranteed: true
  description: common KPI list of END-010 (star_kpis format, one file per run)
- product: light_curve
  path: output_reflectance_determination/flux.csv
  format: csv
  guaranteed: true
  description: reflected-light flux time series of the night pass
- product: reflectance_summary
  path: results_reflectance_determination/reflectance_summary.json
  format: json
  guaranteed: true
  description: numbered KPI catalog (geometry, light curve, apparent magnitude, light pollution)
- product: reflectance_timeseries
  path: results_reflectance_determination/reflectance_timeseries.json
  format: json
  guaranteed: false
  description: time series for the results tab
execution:
  estimated_runtime: 3
  execution_mode: matlab_subprocess
  input_filename: END-010_input.json
  runner_module: runners.end010_runner
  runner_function: run_end010

interface_notes: >
  The current runner calls STAR/END010-ReflectanceDetermination/star_reflectance_determination.m
  through MATLAB command-line execution. If STAR/END010-ReflectanceDetermination/Input/input_reflectance_determination.json
  exists, it is passed to MATLAB through STAR_END010_INPUT_FILE. Otherwise, the MATLAB script uses its standalone default input path.
  The Unity player lib/BuildCubeSat renders the NASA-style CDS CubeSat model of the satellite of the run: the class of the
  END-006 initial design (spacecraft_definition.json, written at step 0 before the other modules; 6U without it), whose mean
  projected area is the reference area of the magnitude estimate; see END010-ReflectanceDetermination/unity_project/README_STAR.md.