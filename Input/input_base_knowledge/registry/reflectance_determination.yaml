module_id: END-010
id: END-010
module_name: Reflectance Determination
name: Reflectance Determination
owner: UNIRM1

description: >
  Reflectance determination module for generating reflectance/light-curve
  simulation outputs from orbital, attitude, illumination and observation geometry data.

short_description: >
  Simulates the reflected sunlight of a satellite (reflectance, light curve, phase
  angle, estimated apparent magnitude) as seen from a ground observer such as the
  Matera telescope, to assess the luminous impact of satellites on astronomy.

aliases:
  - reflectance determination
  - light curve simulation
  - satellite brightness and apparent magnitude
  - light pollution and luminous impact of satellites on astronomy
  - photometric detectability from a ground telescope

capabilities:
  - reflectance_determination
  - light_curve_generation
  - unity_based_rendering
  - observation_geometry_processing
  - apparent_magnitude_estimation
  - light_pollution_assessment

activation_rules:
  keywords:
    - reflectance
    - light curve
    - flux
    - brightness
    - photometry
    - apparent magnitude
    - phase angle
    - light pollution
    - luminous impact
    - telescope
  required_upstream_modules:
    - END-003

planning_guidance: >
  Select this module when the request asks for reflected light, light curves,
  satellite brightness or apparent magnitude, luminous impact / light pollution
  on ground-based astronomy, or detectability from a telescope. It needs the
  orbit and attitude of the satellite during a pass visible from the observer at
  night: END-003 selects that pass (sunlit satellite, observer in darkness) and
  writes its ephemeris, so END-010 runs after END-003 and is normally the last
  module of an Earth-observation workflow.

required_inputs:
  - name: reflectance_configuration_json
    data_type: file
    required: true
    description: JSON configuration file for the reflectance determination MATLAB pipeline.

outputs:
  - name: reflectance_results
    kind: result
    artifact_name: results_reflectance_determination
    data_type: folder
    description: Reflectance determination results folder.

  - name: light_curve
    kind: result
    artifact_name: output_reflectance_determination/flux.csv
    data_type: csv
    description: Simulated reflected-light or flux time series of the night pass selected by END-003.

  - name: unity_frames
    kind: result
    artifact_name: results_reflectance_determination/Frames
    data_type: folder
    description: Frames generated by the Unity simulation.

  - name: performance_kpi_catalog
    kind: result
    artifact_name: reflectance_summary.json
    data_type: json
    description: >
      Numbered key-performance-indicator catalog (run_validity,
      geometry_observability, light_curve_photometry and
      light_pollution_detectability categories), including an estimated
      peak apparent visual magnitude compared against the site's limiting
      visual magnitude.

execution:
  estimated_runtime: 3
  execution_mode: matlab_subprocess
  input_filename: END-010_input.json
  runner_module: runners.end010_runner
  runner_function: run_end010
  upstream_dependencies:
    - END-003
  optional_upstream_dependencies:
    - END-001
    - END-019
  downstream_dependencies: []

interface_notes: >
  The current runner calls STAR/END010-ReflectanceDetermination/star_reflectance_determination.m
  through MATLAB command-line execution. If STAR/END010-ReflectanceDetermination/Input/input_reflectance_determination.json
  exists, it is passed to MATLAB through STAR_END010_INPUT_FILE. Otherwise, the MATLAB script uses its standalone default input path.
  The Unity player lib/BuildCubeSat renders the NASA-style CDS CubeSat model of the class END-019 chose in the same run (optional
  upstream: END-010 then runs after END-019; 6U without it); see END010-ReflectanceDetermination/unity_project/README_STAR.md.